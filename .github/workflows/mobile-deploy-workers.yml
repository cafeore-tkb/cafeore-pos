name: mobile / deploy (Workers)

# mobile フロントをビルドして Cloudflare Workers へデプロイする。
#
# ssr: false の SPA なので、Worker のスクリプトは持たず build/client を
# 静的アセットとして配信するだけ（設定は services/mobile/wrangler.jsonc）。
#
# main への push と手動実行では本番へ deploy する。
# PR では versions upload に切り替え、本番のトラフィックは向けずに
# プレビュー URL 付きのバージョンだけ作る。

on:
  push:
    branches:
      - main
    paths:
      - 'services/mobile/**'
      - 'modules/common/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile-deploy-workers.yml'
  pull_request:
    paths:
      - 'services/mobile/**'
      - 'modules/common/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile-deploy-workers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-deploy-workers-${{ github.ref }}
  # 本番へのデプロイを途中で止めると中途半端な状態になりうるので、
  # 打ち切ってよいのは PR のプレビューだけにする。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    # 2つ除外している。
    #
    #   - fork からの PR … secrets が渡らないので実行しても必ず落ちる
    #     （既存の pos-deploy-pull-request.yml と同じ条件）
    #   - Dependabot の PR … 同じリポジトリのブランチから来るので上の条件は
    #     通ってしまうが、Dependabot が起点の実行には Actions の secrets が
    #     渡らない（Dependabot 用の別ストアが引かれる）ので、やはり認証で落ちる。
    #     npm の更新は pnpm-lock.yaml を触るため、除外しないと毎週赤くなる
    if: >-
      ${{ github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}

    steps:
      - uses: actions/checkout@v4

      - uses: './.github/actions/setup-deps'

      - name: ビルドする
        working-directory: services/mobile
        run: pnpm run build
        env:
          # 静的ファイルに焼き込まれる。ここに入れた値はブラウザから読める。
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SOHOSAI_VOTE_URL: ${{ vars.VITE_SOHOSAI_VOTE_URL }}

      - name: デプロイする
        working-directory: services/mobile
        env:
          # wrangler が読む名前は CLOUDFLARE_* 固定なので、GitHub 側の
          # WORKERS_ 接頭辞つきの名前からここで詰め替える。
          # アカウント ID は秘密情報ではないので Variables に置いている。
          CLOUDFLARE_API_TOKEN: ${{ secrets.WORKERS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.WORKERS_CLOUDFLARE_ACCOUNT_ID }}
          # CI からテレメトリを送らない。
          WRANGLER_SEND_METRICS: 'false'
          # スクリプトに ${{ }} を直接埋めるとログや PR タイトル経由で
          # コマンドを差し込まれうるので、値は env 経由で渡す。
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -uo pipefail

          status=0
          if [ "$IS_PR" = "true" ]; then
            # 本番のトラフィックは向けない。プレビュー URL が出力に出る。
            # 対象の Worker がまだ1度も deploy されていないと失敗するので、
            # 初回だけは main へのマージ（または手動実行）を先に通すこと。
            out=$(pnpm exec wrangler versions upload \
              --tag "pr-$PR_NUMBER" \
              --message "PR #$PR_NUMBER ($GITHUB_SHA)" 2>&1) || status=$?
          else
            out=$(pnpm exec wrangler deploy 2>&1) || status=$?
          fi

          echo "$out"
          {
            echo "### wrangler の出力"
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
