name: pr / cleanup

# PR を閉じた（マージ含む）とき、または preview ラベルを外したときに、
# その PR がビルドした成果物を片付ける。
#
# 閉じたときはラベルの有無にかかわらず片付ける。ラベルで出す運用より前に出した
# プレビューや、ラベルを外したときの片付けが失敗して残ったものもここで回収するため。
# 対象が無ければ何もしない。
#
# ## preview ラベル
#
# プレビューは preview ラベルが付いた PR にだけ出る（api-build.yml を参照）。
# ラベルは「プレビューが出ている」ことを表すので、閉じたときの片付けが
# **全部成功したら**ラベルも外す（remove-label）。失敗したら外さず、
# 残っているものがあることを示す。
#
# ラベルは GITHUB_TOKEN で外すので、それによる unlabeled ではこの workflow は
# 走り直さない（GITHUB_TOKEN が起こしたイベントは workflow を起動しない）。
#
# ## Artifact Registry
#
# api-build が api に、pos-deploy-cloudrun が pos-web に付けた pr-<番号> タグを外す。
# タグが外れたイメージは UNTAGGED になり、infra 側のクリーンアップポリシー
# （gcp/artifact_registry.tf）が一定期間後に本体を消す。
#
# **タグだけを消し、イメージ本体（バージョン）は消さない。** PR の head と
# main の tip が同じコミットになった場合（fast-forward マージなど）、同じ
# 内容のイメージが latest と同じダイジェストを指すことがあり、バージョンごと
# 消すと本番の参照先を壊しうるため。タグを外すだけならその心配がない。
#
# ## Cloud Run
#
# その PR に割り当てたリビジョンタグ（pr-<番号>）を、backend のプレビュー用サービス
# （cafeore-pos-preview）と web のプレビュー用サービス（cafeore-pos-web-preview）から外す。
# タグはサービスあたりの上限があるので放置できない。タグが外れたリビジョンはトラフィックを持たない
# ままなので、インスタンスは立たず課金もされない。
#
# ## Neon
#
# その PR 専用に作ったブランチ（preview/pr-<番号>）を消す。compute ごと消えるので
# CU-hours もストレージも解放される。**ブランチ名の規則は api-build.yml の
# NEON_BRANCH_PREFIX と必ず揃えること。** ずれると消えずに溜まる。
#
# ## Cloudflare Workers
#
# PR のプレビューは Cloud Run（pos-deploy-cloudrun）に移したので、新しくは作られない。
# 前に pos-deploy-workers が PR から versions upload したバージョンは**片付けていない**。
# wrangler に versions delete が無く、バージョンを個別に消す手段が今のところ無いため
# （wrangler preview delete は private beta）。閉じた PR のプレビュー URL も
# 残り続ける。pr-<番号> のエイリアスも、最後に上げたバージョンを指したまま残る。
# 焼き込んだ backend のタグ URL は上で外れるので、API には繋がらない。
#
# ## POS のプレビューのコメント
#
# pos-deploy-cloudrun.yml が PR に書いた「POS のプレビュー」コメントを、web のタグと一緒に消す。
# 前に pos-deploy-workers.yml が書いたコメント（目印が別）も消す。Workers の URL 自体は残るが、
# API に繋がらない URL をプレビューとして案内し続けないようにするため。backend のコメントは消していない。
# コメントは目印で探すので、**pos-deploy-cloudrun.yml の COMMENT_MARKER と
# 必ず揃えること。** ずれると消えずに残る。

# pull_request ではなく pull_request_target を使う。コンフリクトしている PR では
# pull_request のワークフローが動かず、閉じたりラベルを外したりしても片付けが走らないため。
# PR のコードは checkout せず PR 番号しか使わない。pull_request_target は fork の PR
# にも secrets と id-token を渡すので、fork は各 job の if で必ず除外すること。
# OIDC トークンの sub / ref は base ブランチ基準に変わるが、GCP の Workload Identity
# は repository だけで絞っている（infra の gcp/github_actions.tf）ので認証には影響しない。
# sub や ref で絞る条件を足すときは、pull_request_target の値も通すこと。
on:
  pull_request_target:
    types:
      - closed
      # preview ラベルを外したとき。別のラベルを外したときも起動するが、
      # job はすべてスキップする。
      - unlabeled

# paths でのフィルタは付けない。その PR が実際にイメージを作ったかどうかは
# ここでは分からないので、常に走らせて「無ければ何もしない」で扱う。

permissions:
  contents: read
  id-token: write

# 片付けを走らせる実行は、api-build のプレビューを出す実行と同じ group に入れる。
# cancel-in-progress: false なので、デプロイ中に来た片付けはデプロイを打ち切らず、
# 終わるのを待ってから走る。打ち切ると、送信済みの gcloud の操作がサーバ側で
# 後から完了し、片付けた後にタグが生え直しうるため。
# 逆に片付け中にラベルを付け直すと、api-build 側が片付けを取り消してデプロイし直す。
#
# 別のラベルを外しただけの実行は job がスキップされるだけだが、同じ group に入ると
# 待っている実行を取り消してしまうので、run_id で group を分けて逃がす。
# **group 名は api-build.yml の concurrency と揃えること。**
concurrency:
  group: >-
    ${{ (github.event.action == 'closed'
         || (github.event.action == 'unlabeled' && github.event.label.name == 'preview'))
        && format('preview-backend-pr-{0}', github.event.number)
        || format('pr-cleanup-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  artifact-registry:
    name: Delete PR image tag
    runs-on: ubuntu-latest

    # fork からの PR は必ず除外する。pull_request_target は fork の PR にも
    # secrets と id-token を渡すため。fork の PR はイメージも作っていない。
    #
    # Dependabot も除外する。Dependabot は不要になった PR を自分で閉じることが
    # あり、その実行には id-token が渡らないため。人がマージした場合は
    # ここを通るが、イメージが無いので NOT_FOUND 扱いで正常終了する。
    #
    # unlabeled は preview ラベルを外したときだけ片付ける。
    if: >-
      ${{ github.actor != 'dependabot[bot]'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (github.event.action == 'closed' || github.event.label.name == 'preview') }}

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'project-5d6e656b-4871-46ff-96f' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
      AR_REPOSITORY: ${{ vars.GCP_AR_CONTAINER_REPOSITORY || 'cafeore-pos' }}
      IMAGE_NAME: api

    steps:
      - name: GCP に認証する
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/185193732958/locations/global/workloadIdentityPools/github-actions/providers/github-actions-oidc' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || 'github-actions-ci@project-5d6e656b-4871-46ff-96f.iam.gserviceaccount.com' }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: pr-<番号> タグを消す
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -uo pipefail

          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$AR_REPOSITORY/$IMAGE_NAME"
          tag="pr-$PR_NUMBER"

          status=0
          out=$(gcloud artifacts docker tags delete "$image:$tag" --quiet 2>&1) || status=$?
          echo "$out"

          if [ "$status" -ne 0 ]; then
            # api を触っていない PR ではイメージ自体が作られていない。
            # 消すものが無いのは正常なので、その場合だけ成功扱いにする。
            if printf '%s\n' "$out" | grep -qiE 'not found|NOT_FOUND|does not exist'; then
              echo "$image:$tag は存在しない。この PR は api のイメージを作っていないとみなす"
              status=0
            else
              exit "$status"
            fi
          fi

          {
            echo "### Artifact Registry の後片付け"
            echo '```'
            echo "$image:$tag"
            echo '```'
            echo "タグを外した。イメージ本体は UNTAGGED になり、クリーンアップポリシーが後で回収する。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cloud Run のリビジョンタグを外す
        env:
          CLOUD_RUN_PREVIEW_SERVICE: ${{ vars.GCP_CLOUD_RUN_PREVIEW_SERVICE || 'cafeore-pos-preview' }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -uo pipefail

          status=0
          out=$(gcloud run services update-traffic "$CLOUD_RUN_PREVIEW_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --remove-tags="pr-$PR_NUMBER" \
            --quiet 2>&1) || status=$?
          echo "$out"

          if [ "$status" -ne 0 ]; then
            # api を触っていない PR ではタグを付けていない。
            # 消すものが無いのは正常なので、その場合だけ成功扱いにする。
            if printf '%s\n' "$out" | grep -qiE 'not found|does not exist|no tag'; then
              echo "pr-$PR_NUMBER のタグは無い。この PR は backend をデプロイしていないとみなす"
            else
              exit "$status"
            fi
          fi

  neon-branch:
    name: Delete Neon preview branch
    runs-on: ubuntu-latest

    # Artifact Registry 側と同じ条件に加え、Neon を使っていない場合はスキップ。
    if: >-
      ${{ github.actor != 'dependabot[bot]'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (github.event.action == 'closed' || github.event.label.name == 'preview')
          && vars.NEON_PROJECT_ID != '' }}

    steps:
      - name: preview/pr-<番号> ブランチを消す
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          # api-build.yml の NEON_BRANCH_PREFIX と同じ値にすること。
          NEON_BRANCH_PREFIX: preview/pr-
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -uo pipefail

          branch="$NEON_BRANCH_PREFIX$PR_NUMBER"

          status=0
          out=$(npx --yes neonctl@3 branches delete "$branch" \
            --project-id "$NEON_PROJECT_ID" 2>&1) || status=$?
          echo "$out"

          if [ "$status" -ne 0 ]; then
            # api を触っていない PR ではブランチを作っていない。
            # 消すものが無いのは正常なので、その場合だけ成功扱いにする。
            if printf '%s\n' "$out" | grep -qiE 'not found|does not exist'; then
              echo "$branch は存在しない。この PR は Neon ブランチを作っていないとみなす"
              status=0
            else
              exit "$status"
            fi
          fi

          {
            echo "### Neon の後片付け"
            echo '```'
            echo "branch: $branch"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  pos-web-preview:
    name: Delete POS web preview
    runs-on: ubuntu-latest

    # Artifact Registry 側と同じ条件。fork と Dependabot の PR には
    # pos-deploy-cloudrun.yml もプレビューを出さない。
    if: >-
      ${{ github.actor != 'dependabot[bot]'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (github.event.action == 'closed' || github.event.label.name == 'preview') }}

    # POS の web のプレビューを出す実行と同じ group に入れる。デプロイ中に片付けると、
    # 片付けた後にデプロイがタグとコメントを付け直してしまうため。
    # cancel-in-progress: false なので、デプロイが終わるのを待ってから片付ける。
    # 逆に片付けている途中でラベルを付け直すと、デプロイ側がこの job を取り消す。
    #
    # PR の github.ref は refs/pull/<番号>/merge なので、それを組み立てている。
    # 別のラベルを外しただけの実行は、待っているデプロイを取り消さないよう
    # run_id で group を分けて逃がす（上の concurrency と同じ理由）。
    # **group 名は pos-deploy-cloudrun.yml の concurrency と揃えること。**
    concurrency:
      group: >-
        ${{ (github.event.action == 'closed'
             || (github.event.action == 'unlabeled' && github.event.label.name == 'preview'))
            && format('pos-deploy-cloudrun-refs/pull/{0}/merge', github.event.number)
            || format('pr-cleanup-pos-web-skip-{0}', github.run_id) }}
      cancel-in-progress: false

    # job に permissions を書くと workflow のものは引き継がれないので、要るものを全部並べる。
    # PR のコードは checkout しない。
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'project-5d6e656b-4871-46ff-96f' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
      AR_REPOSITORY: ${{ vars.GCP_AR_CONTAINER_REPOSITORY || 'cafeore-pos' }}
      # pos-deploy-cloudrun.yml の IMAGE_NAME・CLOUD_RUN_PREVIEW_SERVICE と同じ値にすること。
      IMAGE_NAME: pos-web
      CLOUD_RUN_PREVIEW_SERVICE: ${{ vars.GCP_CLOUD_RUN_WEB_PREVIEW_SERVICE || 'cafeore-pos-web-preview' }}
      PR_NUMBER: ${{ github.event.number }}

    steps:
      - name: GCP に認証する
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/185193732958/locations/global/workloadIdentityPools/github-actions/providers/github-actions-oidc' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || 'github-actions-ci@project-5d6e656b-4871-46ff-96f.iam.gserviceaccount.com' }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: pos-web の pr-<番号> タグを消す
        run: |
          set -uo pipefail

          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$AR_REPOSITORY/$IMAGE_NAME"
          tag="pr-$PR_NUMBER"

          status=0
          out=$(gcloud artifacts docker tags delete "$image:$tag" --quiet 2>&1) || status=$?
          echo "$out"

          if [ "$status" -ne 0 ]; then
            # POS を触っていない PR ではイメージ自体が作られていない。
            # 消すものが無いのは正常なので、その場合だけ成功扱いにする。
            if printf '%s\n' "$out" | grep -qiE 'not found|NOT_FOUND|does not exist'; then
              echo "$image:$tag は存在しない。この PR は web のイメージを作っていないとみなす"
              status=0
            else
              exit "$status"
            fi
          fi

          {
            echo "### Artifact Registry の後片付け（web）"
            echo '```'
            echo "$image:$tag"
            echo '```'
            echo "タグを外した。イメージ本体は UNTAGGED になり、クリーンアップポリシーが後で回収する。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: web の Cloud Run のリビジョンタグを外す
        run: |
          set -uo pipefail

          status=0
          out=$(gcloud run services update-traffic "$CLOUD_RUN_PREVIEW_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --remove-tags="pr-$PR_NUMBER" \
            --quiet 2>&1) || status=$?
          echo "$out"

          if [ "$status" -ne 0 ]; then
            # POS を触っていない PR ではタグを付けていない（infra を apply する前は、サービスも無い）。
            # 消すものが無いのは正常なので、その場合だけ成功扱いにする。
            if printf '%s\n' "$out" | grep -qiE 'not found|does not exist|no tag'; then
              echo "pr-$PR_NUMBER のタグは無い。この PR は web をデプロイしていないとみなす"
            else
              exit "$status"
            fi
          fi

      # GCP の片付けが失敗しても、コメントは消す（job は失敗のままになり、ラベルは外れない）。
      - name: POS のプレビューのコメントを消す
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 1 つ目は pos-deploy-cloudrun.yml の COMMENT_MARKER と同じ値にすること。
          # 2 つ目は前の pos-deploy-workers.yml のもの。切り替えより前にプレビューを出した PR が
          # 閉じきったら消してよい。
          COMMENT_MARKERS: |-
            <!-- cafeore-preview: pos-web -->
            <!-- cafeore-preview: pos -->
        run: |
          set -uo pipefail

          # github-actions[bot] が書いたものだけを消す。目印を本文で引用した
          # 他の人や bot のコメントは消さないため。pos-deploy-cloudrun.yml も同じ条件で探す。
          # --paginate と --jq はページごとに出力するが、1 行 1 件なのでそのまま並べてよい。
          markers=$(printf '%s\n' "$COMMENT_MARKERS" | jq -R . | jq -sc .)
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body as \$b | $markers | any(. as \$m | \$b | contains(\$m)))) | .id") \
            || exit $?

          if [ -z "$ids" ]; then
            echo "POS のプレビューのコメントは無い"
            exit 0
          fi

          failed=0
          for id in $ids; do
            status=0
            out=$(gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/issues/comments/$id" 2>&1) || status=$?

            if [ "$status" -eq 0 ]; then
              echo "POS のプレビューのコメント $id を消した" | tee -a "$GITHUB_STEP_SUMMARY"
            elif printf '%s\n' "$out" | grep -q 'HTTP 404'; then
              # 誰かが先に消していると 404 になる。消えていればよいので成功扱いにする。
              echo "コメント $id は既に消えている"
            else
              echo "$out"
              failed=1
            fi
          done

          exit "$failed"

  remove-label:
    name: Remove preview label
    runs-on: ubuntu-latest
    needs:
      - artifact-registry
      - neon-branch
      - pos-web-preview

    # 閉じたときの片付けが全部済んだら preview ラベルを外す。
    # Artifact Registry 側と POS の web（タグとコメント）は成功が必須。Neon 側は NEON_PROJECT_ID が
    # 未設定ならスキップされるので、それも済んだ扱いにする。どれかが失敗・取り消しなら
    # 外さない（残っているものがあることをラベルで示すため）。
    # unlabeled で片付けたときは、ラベルはもう外れているので何もしない。
    if: >-
      ${{ !cancelled()
          && github.event.action == 'closed'
          && contains(github.event.pull_request.labels.*.name, 'preview')
          && needs.artifact-registry.result == 'success'
          && (needs.neon-branch.result == 'success' || needs.neon-branch.result == 'skipped')
          && needs.pos-web-preview.result == 'success' }}

    # ラベルの付け外しに要る権限だけにする。PR のコードは checkout しない。
    permissions:
      pull-requests: write

    steps:
      - name: preview ラベルを外す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -uo pipefail

          status=0
          out=$(gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/preview" 2>&1) || status=$?

          if [ "$status" -ne 0 ]; then
            # 誰かが先に外していると 404 になる。外れていればよいので成功扱いにする。
            if printf '%s\n' "$out" | grep -qiE 'Label does not exist|HTTP 404'; then
              echo "preview ラベルは既に外れている"
              exit 0
            fi
            echo "$out"
            exit "$status"
          fi

          echo "片付けが済んだので preview ラベルを外した" | tee -a "$GITHUB_STEP_SUMMARY"
