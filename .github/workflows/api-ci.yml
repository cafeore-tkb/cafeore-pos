name: api

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yml'
      - 'go.mod'
      - 'go.sum'
  merge_group:

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'api/go.mod'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: api
          version: v2.9.0

  # 本物の Postgres を使うテストは、この 1 つの Postgres を TEST_DATABASE_URL で共有する。
  # go test ./... はパッケージを並行で走らせるので、どのテストも既存の schema・データを壊さない。
  #   - ハンドラの結合テスト: テストごとに使い捨ての schema を作り、モデルからテーブルを作って
  #     終わったら消す（api/internal/handlers/testdb_test.go の newTestDB）
  #   - 起動時のマイグレーション（cmd/server）: public スキーマ前提なので、テストごとに使い捨ての
  #     database を作って流す。プレビューは preview ラベルの PR にしか出ないので、ラベルの無い PR
  #     でも AutoMigrate が通るか・反映後にズレが無いかをここで見る
  # CI では TEST_DATABASE_URL が無いと落ちるので、これらのテストが黙って飛ばされることはない。
  # 本番（Supabase）に合わせて 17。
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'api/go.mod'
      - run: go test -race -v ./...

  # Go のビルドだけを見る。イメージ全体は下の image で見る。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'api/go.mod'
      - run: go build -v ./cmd/server

  # Dockerfile からイメージが作れるかを見る。push はしない。
  #
  # api-build も PR でイメージを作るが、preview ラベルが付いた PR だけなので、
  # ラベルの無い PR では Dockerfile の壊れや、go.mod とベースイメージの
  # Go のバージョンのずれに main へのマージ（本番デプロイ）まで気づけない。
  # ここでは全 PR と merge_group で作る。設定は api-build と揃えている。
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: イメージをビルドする（push しない）
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          # main の api-build が書いたキャッシュを読むだけにする。PR から書くと
          # PR ごとにキャッシュが積み上がり、リポジトリの上限を圧迫するため。
          cache-from: type=gha
