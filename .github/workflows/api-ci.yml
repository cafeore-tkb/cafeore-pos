name: api

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yml'
      - 'go.mod'
      - 'go.sum'
  merge_group:

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'api/go.mod'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: api
          version: v2.9.0

  # ほとんどのテストは DB を使わない（GORM の DryRun）。internal/database だけが
  # 本物の Postgres に api/migrations を流し、モデルとずれていないかを確かめる。
  # 本番（Supabase）に合わせて 17 にしている。
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'api/go.mod'
      - run: go test -v ./...

  # PR では api-build もイメージをビルドするが、merge_group で走るのはこちらだけ。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'api/go.mod'
      - run: go build -v ./cmd/server
