name: api

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yml'
      - 'go.mod'
      - 'go.sum'
  merge_group:

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'api/go.mod'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: api
          version: v2.9.0

  # テストは DB を使わない（GORM の DryRun）ので、DB のサービスは要らない。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'api/go.mod'
      - run: go test -v ./...

  # Go のビルドだけを見る。イメージ全体は下の image で見る。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'api/go.mod'
      - run: go build -v ./cmd/server

  # Dockerfile からイメージが作れるかを見る。push はしない。
  #
  # api-build も PR でイメージを作るが、preview ラベルが付いた PR だけなので、
  # ラベルの無い PR では Dockerfile の壊れや、go.mod とベースイメージの
  # Go のバージョンのずれに main へのマージ（本番デプロイ）まで気づけない。
  # ここでは全 PR と merge_group で作る。設定は api-build と揃えている。
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: イメージをビルドする（push しない）
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          # main の api-build が書いたキャッシュを読むだけにする。PR から書くと
          # PR ごとにキャッシュが積み上がり、リポジトリの上限を圧迫するため。
          cache-from: type=gha
