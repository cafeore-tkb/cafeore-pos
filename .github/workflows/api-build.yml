name: api / build

# backend のコンテナイメージをビルドして Artifact Registry へ push する。
#
# 認証は Workload Identity Federation。サービスアカウントキーは使わない。
# GCP 側の構成は infra リポジトリの gcp/github_actions.tf を参照。
#
# push 先は Terraform で新しく作った Docker リポジトリ（既定 cafeore-pos）で、
# Cloud Build が使っている cloud-run-source-deploy とは別物。
# この workflow はデプロイまではしない（イメージを置くだけ）。

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/api-build.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api-build.yml'
  workflow_dispatch:

# WIF の OIDC トークン発行に id-token: write が必須。
# 足りないと google-github-actions/auth が
# "Failed to get ID token" で落ちる。
permissions:
  contents: read
  id-token: write

concurrency:
  group: api-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push to Artifact Registry
    runs-on: ubuntu-latest

    # fork からの PR には id-token が発行されないので、実行しても必ず落ちる。
    # 既存の pos-deploy-pull-request.yml と同じ条件で除外する。
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    env:
      # いずれも秘密情報ではない。既定値は infra の `terraform output` の現行値。
      # Terraform 側で ID を変えたら、このリポジトリの Variables に入れて上書きする。
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'project-5d6e656b-4871-46ff-96f' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
      AR_REPOSITORY: ${{ vars.GCP_AR_CONTAINER_REPOSITORY || 'cafeore-pos' }}
      IMAGE_NAME: api

    steps:
      - uses: actions/checkout@v4

      - name: GCP に認証する
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/185193732958/locations/global/workloadIdentityPools/github-actions/providers/github-actions-oidc' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || 'github-actions-ci@project-5d6e656b-4871-46ff-96f.iam.gserviceaccount.com' }}
          # docker login にそのまま渡せる短期トークンを受け取る。
          # SA を impersonate するので service_account の指定が必要。
          token_format: access_token

      - name: Artifact Registry に docker login する
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: タグを決める
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}
          # PR のイメージには **pr-<番号> しか付けない**。
          # sha タグも一緒に付けてしまうと、PR を閉じたときに pr- タグを消しても
          # sha タグが残ってバージョンが TAGGED のままになり、
          # 「未参照になったら消す」クリーンアップの対象から漏れる。
          #
          # pr-<番号> は PR に push するたび新しいイメージへ付け替わる。
          # 外れた古いイメージは UNTAGGED になり、こちらもクリーンアップで回収される。
          tags: |
            type=sha,format=long,prefix=,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - name: ビルドして push する
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          # Cloud Run は amd64。Dockerfile 側でも GOARCH=amd64 を固定している。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 既定では provenance attestation が付いて OCI index になり、
          # 単一イメージを前提にしたツール（gcloud run deploy の一部経路など）が
          # 扱いを間違えることがある。Cloud Build が作っている既存イメージと
          # 形を揃えるため無効化している。
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: push したイメージを表示する
        run: |
          echo "### push したイメージ" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
