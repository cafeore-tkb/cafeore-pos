name: pos / deploy (Workers)

# POS フロントをビルドして Cloudflare Workers へデプロイする。
#
# ssr: false の SPA なので、Worker のスクリプトは持たず build/client を
# 静的アセットとして配信するだけ（設定は services/pos/wrangler.jsonc）。
#
# main への push と手動実行では本番へ deploy する。
# PR では versions upload に切り替え、本番のトラフィックは向けずに
# プレビュー URL 付きのバージョンだけ作る。
#
# ただし versions upload は Worker が既にあることが前提なので、まだ無いと
# 失敗する。変数 WORKERS_AUTO_DEPLOY_IF_NOT_EXIST が true のときに限り、
# その場合だけ deploy にフォールバックして Worker を作る。
#
# PR のプレビューは **preview ラベルが付いた open な PR にだけ**出す
# （api-build.yml の「PR では preview ラベルが付いているときだけ」を参照）。
# ラベルを外しても、作ったバージョンは消せないので残る。PR に書いたプレビューの
# コメントは消す（pr-cleanup.yml を参照）。

on:
  push:
    branches:
      - main
    paths:
      - 'services/pos/**'
      - 'modules/common/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pos-deploy-workers.yml'
  pull_request:
    # 既定の opened / synchronize / reopened に、ラベルを付けたときを足している。
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    paths:
      - 'services/pos/**'
      - 'modules/common/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pos-deploy-workers.yml'
  workflow_dispatch:

permissions:
  contents: read
  # プレビュー用 backend の URL を引くための WIF。
  # 引けなくてもデプロイは止めないので、GCP が落ちていても Cloudflare へは出せる。
  id-token: write
  # プレビュー URL を PR にコメントするのに必要。
  # fork からの PR は job の if で除外してあるので、書き込みを許しても
  # 外部の人のコードがこの権限を使うことはない。
  pull-requests: write

# プレビューを出さない PR の実行（ラベルの無い PR への push、別のラベルを
# 付けたときなど）は job がスキップされるだけだが、同じ group に入ると
# 走っているプレビューのデプロイを取り消してしまう。run_id で group を
# 分けて逃がす。**条件は job の if と揃えること。**
#
# pr-cleanup.yml のコメントを消す job も PR ではこの group に入り、デプロイが
# 終わるのを待ってから消す。**group 名を変えるときは pr-cleanup.yml も揃えること。**
concurrency:
  group: >-
    ${{ (github.event_name != 'pull_request'
         || (github.actor != 'dependabot[bot]'
             && github.event.pull_request.head.repo.full_name == github.repository
             && github.event.pull_request.state == 'open'
             && contains(github.event.pull_request.labels.*.name, 'preview')
             && (github.event.action != 'labeled' || github.event.label.name == 'preview')))
        && format('pos-deploy-workers-{0}', github.ref)
        || format('pos-deploy-workers-skip-{0}', github.run_id) }}
  # 本番へのデプロイを途中で止めると中途半端な状態になりうるので、
  # 打ち切ってよいのは PR のプレビューだけにする。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    # 3つ除外している。
    #
    #   - fork からの PR … secrets が渡らないので実行しても必ず落ちる
    #   - Dependabot の PR … 同じリポジトリのブランチから来るので上の条件は
    #     通ってしまうが、Dependabot が起点の実行には Actions の secrets が
    #     渡らない（Dependabot 用の別ストアが引かれる）ので、やはり認証で落ちる。
    #     npm の更新は pnpm-lock.yaml を触るため、除外しないと毎週赤くなる
    #   - preview ラベルの無い PR … プレビューはラベルを付けた PR にだけ出す。
    #     別のラベルを付けたときと、閉じた PR にラベルを付けたときも出さない
    #
    # **PR の条件は上の concurrency と揃えること。**
    if: >-
      ${{ github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
              || (github.event.pull_request.head.repo.full_name == github.repository
                  && github.event.pull_request.state == 'open'
                  && contains(github.event.pull_request.labels.*.name, 'preview')
                  && (github.event.action != 'labeled' || github.event.label.name == 'preview'))) }}

    env:
      # PR コメントを service ごとに1件へまとめるための目印。
      # pr-cleanup.yml もこの目印でコメントを探して消すので、変えるときは揃えること。
      COMMENT_MARKER: '<!-- cafeore-preview: pos -->'
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'project-5d6e656b-4871-46ff-96f' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
      CLOUD_RUN_PREVIEW_SERVICE: ${{ vars.GCP_CLOUD_RUN_PREVIEW_SERVICE || 'cafeore-pos-preview' }}
      SERVICE_LABEL: 'POS'

    steps:
      - uses: actions/checkout@v4

      - uses: './.github/actions/setup-deps'

      # PR のビルドに焼き込む API の URL を確定させる。
      #
      # Cloud Run のサービス URL は**サービス単位で固定**で、リビジョンが
      # 変わっても変わらない。つまり backend のデプロイを待つ必要はなく、
      # サービスさえ存在していれば先に引ける。ビルドは VITE_* を焼き込むので、
      # この確定はビルドより前でなければならない。
      #
      # 引けなくても**落とさない**（サービス未作成、GCP 障害、権限不足など）。
      # その場合は下の VITE_API_BASE_URL_PREVIEW → VITE_API_BASE_URL の順に
      # フォールバックする。Cloudflare へのデプロイを GCP の可用性に
      # 引きずられないようにするため。
      - name: GCP に認証する
        id: gcp_auth
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/185193732958/locations/global/workloadIdentityPools/github-actions/providers/github-actions-oidc' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || 'github-actions-ci@project-5d6e656b-4871-46ff-96f.iam.gserviceaccount.com' }}

      - uses: google-github-actions/setup-gcloud@v2
        if: ${{ github.event_name == 'pull_request' && steps.gcp_auth.outcome == 'success' }}
        continue-on-error: true

      - name: プレビュー用 backend の URL を引く
        id: api_url
        if: ${{ github.event_name == 'pull_request' && steps.gcp_auth.outcome == 'success' }}
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail

          # 別の PR の上に積んだ PR で backend を変えていなければ、向き先の PR の backend を使う
          # （api-build.yml の backend-owner と同じスクリプト）。決められなければ自分の番号。
          owner=$(bash .github/scripts/preview-backend-owner.sh "$PR_NUMBER") || owner="$PR_NUMBER"
          case "$owner" in
            ''|*[!0-9]*) owner="$PR_NUMBER" ;;
          esac
          echo "owner=$owner" >> "$GITHUB_OUTPUT"

          # backend は PR ごとに pr-<番号> のリビジョンタグを付けてデプロイされ、
          # そのタグ専用の URL を持つ。まずは実物を引く。
          spec=$(gcloud run services describe "$CLOUD_RUN_PREVIEW_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json 2>&1) || spec=""

          url=""
          if [ -n "$spec" ]; then
            url=$(printf '%s' "$spec" \
              | jq -r --arg t "pr-$owner" \
                  'first(.status.traffic[]? | select(.tag == $t) | .url) // empty' \
              2>/dev/null) || url=""
          fi

          # まだ backend がデプロイされていないと、そのタグは存在しない。
          # タグ URL はサービス URL のホスト名に "<タグ>---" を足した形なので、
          # サービス URL から組み立てておく。あとで backend が出れば有効になる。
          if [ -z "$url" ] && [ -n "$spec" ]; then
            base=$(printf '%s' "$spec" | jq -r '.status.url // empty' 2>/dev/null) || base=""
            case "$base" in
              https://*) url="https://pr-$owner---${base#https://}" ;;
            esac
          fi

          case "$url" in
            https://*) echo "url=$url" >> "$GITHUB_OUTPUT"; echo "API は $url（#$owner の backend）を使う" ;;
            *) echo "URL を引けなかったので変数のフォールバックに任せる" ;;
          esac

      - name: ビルドする
        working-directory: services/pos
        run: pnpm run build
        env:
          # 静的ファイルに焼き込まれる。ここに入れた値はブラウザから読める。
          VITE_WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          # PR では上で引いたプレビュー用 backend の URL を焼き込む。
          # 引けなかった場合は VITE_API_BASE_URL_PREVIEW → VITE_API_BASE_URL の
          # 順にフォールバックする。
          VITE_API_BASE_URL: >-
            ${{ (github.event_name == 'pull_request'
                 && (steps.api_url.outputs.url || vars.VITE_API_BASE_URL_PREVIEW))
                || vars.VITE_API_BASE_URL }}

      - name: デプロイする
        id: deploy
        working-directory: services/pos
        env:
          # wrangler が読む名前は CLOUDFLARE_* 固定なので、GitHub 側の
          # WORKERS_ 接頭辞つきの名前からここで詰め替える。
          # アカウント ID は秘密情報ではないので Variables に置いている。
          CLOUDFLARE_API_TOKEN: ${{ secrets.WORKERS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.WORKERS_CLOUDFLARE_ACCOUNT_ID }}
          # CI からテレメトリを送らない。
          WRANGLER_SEND_METRICS: 'false'
          # スクリプトに ${{ }} を直接埋めるとログや PR タイトル経由で
          # コマンドを差し込まれうるので、値は env 経由で渡す。
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PR_NUMBER: ${{ github.event.number }}
          # Worker がまだ存在しないときに限り、PR でも wrangler deploy に
          # フォールバックする。詳しくは下のスクリプト内のコメントを参照。
          AUTO_DEPLOY_IF_NOT_EXIST: ${{ vars.WORKERS_AUTO_DEPLOY_IF_NOT_EXIST }}
        run: |
          set -uo pipefail

          # Worker が既に存在するかどうか。
          #
          # 判定できないとき（認証エラーなど別の理由で失敗したとき）は
          # **存在する扱いにして true を返す**。ここで存在しないと誤断定すると、
          # 本来 versions upload で済むところを本番の deploy に倒してしまうため。
          # その場合は本来のコマンドを走らせて、そちらのエラーを出させる。
          worker_exists() {
            local out
            local status=0

            out=$(pnpm exec wrangler versions list 2>&1) || status=$?
            if [ "$status" -eq 0 ]; then
              return 0
            fi

            if printf '%s\n' "$out" | grep -qiE 'not found|does not exist|10007'; then
              return 1
            fi

            echo "Worker の存在を判定できなかった。存在する前提で続行する:"
            echo "$out"
            return 0
          }

          # 走らせるコマンドを決める。
          if [ "$IS_PR" != "true" ]; then
            # main への push と手動実行は本番へ。
            mode="deploy"
          elif [ "$AUTO_DEPLOY_IF_NOT_EXIST" = "true" ] && ! worker_exists; then
            # wrangler versions upload は対象の Worker が既にあることが前提で、
            # 無いと失敗する。初回だけ deploy に倒して Worker を作る。
            #
            # **PR から本番の Worker が作られる**ことになるので、変数
            # WORKERS_AUTO_DEPLOY_IF_NOT_EXIST が明示的に true のときだけ
            # この経路に入る。初回の立ち上げが済んだら変数を消すこと。
            echo "Worker が存在しないので deploy にフォールバックする"
            mode="deploy"
          else
            # 本番のトラフィックは向けない。プレビュー URL が出力に出る。
            mode="versions-upload"
          fi

          status=0
          if [ "$mode" = "deploy" ]; then
            out=$(pnpm exec wrangler deploy 2>&1) || status=$?
          else
            out=$(pnpm exec wrangler versions upload \
              --tag "pr-$PR_NUMBER" \
              --message "PR #$PR_NUMBER ($GITHUB_SHA)" 2>&1) || status=$?
          fi

          echo "$out"

          # wrangler の出力から workers.dev の URL を拾う。
          # versions upload ならプレビュー URL、deploy なら本番の URL。
          # 取れなくてもここでは失敗させない（コメントを省くだけ）。
          preview_url=$(printf '%s\n' "$out" \
            | grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' \
            | head -1) || true

          {
            echo "mode=$mode"
            echo "preview_url=$preview_url"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### wrangler の出力（mode: $mode）"
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      # デプロイが成功したときだけ走る（既定の if: success()）。
      - name: プレビュー URL を PR にコメントする
        if: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.preview_url != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          MODE: ${{ steps.deploy.outputs.mode }}
          API_OWNER: ${{ steps.api_url.outputs.owner }}
        run: |
          set -uo pipefail

          body=$(printf '%s\n' \
            "$COMMENT_MARKER" \
            "### $SERVICE_LABEL のプレビュー" \
            "" \
            "| | |" \
            "| --- | --- |" \
            "| URL | $PREVIEW_URL |" \
            "| backend | ${API_OWNER:+#$API_OWNER のもの} |" \
            "| commit | \`$GITHUB_SHA\` |" \
            "| mode | \`$MODE\` |" \
            "" \
            "このコメントは push のたびに書き換わる。")

          # 既に自分が書いたコメントがあれば、増やさずにそれを書き換える。
          # github-actions[bot] が書いたものに限る。目印を本文で引用した他の人や
          # bot のコメント（Claude の概要など）を上書きしてしまうため。
          # 消す側の pr-cleanup.yml も同じ条件で探す。
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate \
            --jq "map(select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$COMMENT_MARKER\")))) | .[0].id // empty")

          if [ -n "$comment_id" ]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -f body="$body" > /dev/null
            echo "既存のコメント $comment_id を更新した"
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$body" > /dev/null
            echo "コメントを新規作成した"
          fi
