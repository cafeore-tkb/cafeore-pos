name: pos / deploy (Workers)

# **POS を GCP に移す途中の、今の本番。** DNS を GCP の LB に付け替えて確かめ、切り替えが済んだら
# この workflow ごと消す（services/pos/worker・wrangler.jsonc・R2 も一緒に。README の「POS を GCP に移す」の手順 7）。
# 付け替えるまでは、main への push のたびに今までどおり本番の Worker を出し直す。付け替えた後は出さない
# （下の「まだ Workers を向いているか確かめる」）。
#
# POS フロントをビルドして Cloudflare Workers へデプロイする。
#
# ssr: false の SPA なので、画面は build/client を静的アセットとして配信する
# （設定は services/pos/wrangler.jsonc）。Worker のスクリプトは /api などを
# Cloud Run の API へ中継するだけ（services/pos/worker/index.ts）。
#
# main への push と手動実行で本番へ deploy する。
# **PR のプレビューは Cloud Run に移した**（pos-deploy-cloudrun.yml）ので、ここでは PR では走らせない。
# 前に PR から versions upload したプレビューのバージョンは消せないので残る（pr-cleanup.yml を参照）。
#
# 本番は、WORKERS_PROD_CLOUDFLARE_* があればそのアカウントへ出し、無ければ WORKERS_CLOUDFLARE_* の
# アカウントへ出す。変数 WORKERS_CUSTOM_DOMAIN があれば独自ドメインを付ける
# （README の「POS の Worker を cafeore のアカウントに移す」）。

on:
  push:
    branches:
      - main
    paths:
      - 'services/pos/**'
      - 'modules/common/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pos-deploy-workers.yml'
  workflow_dispatch:

permissions:
  contents: read
  # ビルドの番号（.github/scripts/build-info.sh）で、マージコミットから PR を引くのに要る。
  pull-requests: read

# 本番へのデプロイを途中で止めると中途半端な状態になりうるので、打ち切らない。
# 待機できるのは最新の 1 件だけなので、実行は溜まらない。
concurrency:
  group: pos-deploy-workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    # Dependabot が起点の実行には Actions の secrets が渡らない（Dependabot 用の別ストアが
    # 引かれる）ので、認証で落ちる。
    if: ${{ github.actor != 'dependabot[bot]' }}

    steps:
      - uses: actions/checkout@v4

      # DNS を GCP の LB に付け替えた後（README の「POS を GCP に移す」の手順 4）は、Workers の本番を出さない
      # （手順 7 でこの workflow ごと消すまで）。出すと --domain pos.cafeore.cafe がカスタムドメインを付け直そうとして、
      # Terraform の A レコードとぶつかる（CI の wrangler は既にある DNS のレコードを上書きして独自ドメインを付ける。
      # ぶつかったときにどうなるかは確かめていない）。WORKERS_CUSTOM_DOMAIN は戻すときのために残しておく。
      #
      # 付け替えたかどうかは、今の応答で見る。Workers のカスタムドメインは Cloudflare を通るので、応答の Server は
      # cloudflare になる（Access がログインへ飛ばすときも）。何かが応答したのに cloudflare でなければ、もう別のところ
      # （GCP の LB）を向いている。応答が無い（ドメインがまだ無い、A レコードを消して名前が引けないなど）ときは出す。
      #
      # main への push では出さずに成功で終わる（警告を残す）。手動実行では失敗にする。戻すときに、
      # ランナーの DNS のキャッシュ（TTL の間）で GCP を見て、出したつもりで出ていないことにならないように。
      - name: pos.cafeore.cafe がまだ Workers を向いているか確かめる
        id: route
        env:
          CUSTOM_DOMAIN: ${{ vars.WORKERS_CUSTOM_DOMAIN }}
        run: |
          set -uo pipefail

          if [ -z "$CUSTOM_DOMAIN" ]; then
            # --domain を渡さないので、ぶつからない
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          probe=$(curl -sS -o /dev/null --max-time 10 \
            -w '%{http_code} %header{server}' "https://$CUSTOM_DOMAIN/session-check" 2>/dev/null) || true
          code="${probe%% *}"
          server=$(printf '%s' "${probe#* }" | tr '[:upper:]' '[:lower:]')
          echo "https://$CUSTOM_DOMAIN/session-check: ${code:-応答なし} Server: ${server:-なし}"

          if [ -n "$code" ] && [ "$code" != "000" ] && [ "$server" != "cloudflare" ]; then
            msg="$CUSTOM_DOMAIN は Cloudflare 以外（Server: ${server:-なし}）から応答している。GCP の LB に付け替えた後なので、Workers の本番は出さない（README の「POS を GCP に移す」）"
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::$msg。Workers に戻すなら、A レコードを消して名前が引けなくなってから流し直す"
              exit 1
            fi
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: './.github/actions/setup-deps'
        if: ${{ steps.route.outputs.skip != 'true' }}

      # どの PR・コミットのビルドかを画面に焼き、トップページに出す（API の分は /status から）。
      # 本番は main のマージコミットから PR を引く（.github/scripts/build-info.sh）。
      - name: ビルドの番号を決める
        id: build_info
        if: ${{ steps.route.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build-info.sh >> "$GITHUB_OUTPUT"

      - name: ビルドする
        if: ${{ steps.route.outputs.skip != 'true' }}
        working-directory: services/pos
        run: pnpm run build
        env:
          # 静的ファイルに焼き込まれる。ここに入れた値はブラウザから読める。
          VITE_WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          VITE_BUILD_PR: ${{ steps.build_info.outputs.pr }}
          VITE_BUILD_COMMIT: ${{ steps.build_info.outputs.commit }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: デプロイする
        id: deploy
        if: ${{ steps.route.outputs.skip != 'true' }}
        working-directory: services/pos
        env:
          # wrangler が読む名前は CLOUDFLARE_* 固定なので、GitHub 側の
          # WORKERS_ 接頭辞つきの名前からここで詰め替える。
          # アカウント ID は秘密情報ではないので Variables に置いている。
          #
          # WORKERS_PROD_* があればそちらのアカウント（cafeore）へ出す。無ければ WORKERS_CLOUDFLARE_* の
          # アカウント（cafeorepos）へ。2 つは組で入れる（下のスクリプトで確かめる）。
          CLOUDFLARE_API_TOKEN: >-
            ${{ secrets.WORKERS_PROD_CLOUDFLARE_API_TOKEN
                || secrets.WORKERS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: >-
            ${{ vars.WORKERS_PROD_CLOUDFLARE_ACCOUNT_ID
                || vars.WORKERS_CLOUDFLARE_ACCOUNT_ID }}
          HAS_PROD_TOKEN: ${{ secrets.WORKERS_PROD_CLOUDFLARE_API_TOKEN != '' }}
          PROD_ACCOUNT_ID: ${{ vars.WORKERS_PROD_CLOUDFLARE_ACCOUNT_ID }}
          # CI からテレメトリを送らない。
          WRANGLER_SEND_METRICS: 'false'
          # スクリプトに ${{ }} を直接埋めるとログ経由でコマンドを差し込まれうるので、
          # 値は env 経由で渡す。
          #
          # 本番の Worker が /api を中継する先（Cloud Run の API のオリジン）。
          # README の「API の認証」を参照。
          API_ORIGIN: ${{ vars.WORKERS_API_ORIGIN }}
          # 本番の Worker に付ける独自ドメイン（pos.cafeore.cafe）。ゾーンが
          # WORKERS_PROD_CLOUDFLARE_ACCOUNT_ID のアカウントに無いと付けられないので、
          # WORKERS_PROD_* と一緒に入れる（下のスクリプトのコメントを参照）。
          CUSTOM_DOMAIN: ${{ vars.WORKERS_CUSTOM_DOMAIN }}
          # 中継するときに付ける、LB の Cloud Armor と照らし合わせるトークン
          # （infra の api_proxy_token と同じ値）。Worker の secret の PROXY_TOKEN として渡す。
          LB_PROXY_TOKEN: ${{ secrets.LB_PROXY_TOKEN }}
          # 呼び出し画面の音声を作る ElevenLabs の鍵（worker/call-voice.ts）。
          # Worker の secret の ELEVENLABS_API_KEY として入れる。
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -uo pipefail

          # 出し先は WORKERS_PROD_* のトークンとアカウント ID の組で決まる。片方だけだと、
          # 別のアカウントのトークンで出そうとして落ちるか、思わないアカウントに出る。
          has_prod_account=false
          if [ -n "$PROD_ACCOUNT_ID" ]; then
            has_prod_account=true
          fi
          if [ "$HAS_PROD_TOKEN" != "$has_prod_account" ]; then
            echo "::error::secret の WORKERS_PROD_CLOUDFLARE_API_TOKEN と変数の WORKERS_PROD_CLOUDFLARE_ACCOUNT_ID は両方入れるか、両方消す"
            exit 1
          fi

          # 画面が API を Worker 経由で呼ぶ設定（VITE_API_BASE_URL が workers.dev か独自ドメイン）なのに
          # 中継先が無いと、本番の POS が API に届かなくなる。その組み合わせでは出さない。
          var_args=()
          if [ -n "$API_ORIGIN" ]; then
            var_args=(--var "API_ORIGIN:$API_ORIGIN")
          else
            case "$VITE_API_BASE_URL" in
              *.workers.dev* | "https://$CUSTOM_DOMAIN" | "https://$CUSTOM_DOMAIN/"*)
                echo "::error::VITE_API_BASE_URL が Worker を向いているのに WORKERS_API_ORIGIN が無い。このままだと POS が API に届かない"
                exit 1
                ;;
            esac
            echo "::warning::WORKERS_API_ORIGIN が無いので、Worker は /api を中継しない"
          fi

          # 独自ドメインを付ける。
          #
          # wrangler は routes（--domain も含む）があると workers_dev を既定で false にするので、
          # 付けると workers.dev の本番の URL は止まる（preview_urls は wrangler.jsonc で別に決まる）。
          # 変数を消して deploy し直すと workers.dev がまた開く（独自ドメインは消えない）。
          #
          # wrangler は workers.dev を止めてから独自ドメインを付ける。ゾーンがこのアカウントに
          # 無いと、workers.dev だけが止まって独自ドメインは付かず、本番の POS に届かなくなる。
          # そうなったら変数を消して手動実行し直す。WORKERS_PROD_* 無しで（cafeorepos の
          # アカウントのまま）独自ドメインだけを入れたときは、出す前に止める。
          #
          # DNS を GCP の LB に付け替えた後は、ここまで来ない（上の「まだ Workers を向いているか確かめる」）。
          domain_args=()
          if [ -n "$CUSTOM_DOMAIN" ]; then
            if [ -z "$PROD_ACCOUNT_ID" ]; then
              echo "::error::WORKERS_CUSTOM_DOMAIN は WORKERS_PROD_CLOUDFLARE_ACCOUNT_ID（独自ドメインのゾーンがあるアカウント）と一緒に入れる"
              exit 1
            fi
            if ! printf '%s' "$CUSTOM_DOMAIN" | grep -qE '^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$'; then
              echo "::error::WORKERS_CUSTOM_DOMAIN にはホスト名だけを入れる（https:// や / を付けない）"
              exit 1
            fi
            # 画面が workers.dev の Worker を向いたままだと、新しい Worker を通らない。
            # このアカウントの workers.dev は上のとおり止まり、前のアカウントの Worker は残っていれば
            # 動くが、消した時点で POS が API に届かなくなる。
            case "$VITE_API_BASE_URL" in
              *.workers.dev*)
                echo "::error::WORKERS_CUSTOM_DOMAIN があるのに VITE_API_BASE_URL が workers.dev を向いている。https://$CUSTOM_DOMAIN にする"
                exit 1
                ;;
            esac
            domain_args=(--domain "$CUSTOM_DOMAIN")
          fi

          # 中継するときは、トークンも deploy のたびに --secrets-file で入れ直す。
          #
          # wrangler secret put で Worker に置いておくだけだと、PR のプレビューの
          # versions upload の直後の deploy で PROXY_TOKEN が消えたことがある。
          # 消えると中継が LB で 403 になり、POS が API に届かなくなる。
          # --secrets-file に書いていない secret は消えない（wrangler の挙動）。
          #
          # ElevenLabs の鍵も deploy のたびに入れる。書かなかった secret は前のバージョンから
          # 引き継がれるので、GitHub の secret を変えたときに古い値が残らないようにする。
          # 無ければ入れない（呼び出し画面は音声を流さず、チャイムだけになる）。
          #
          # 値はコマンドラインに載せず、RUNNER_TEMP のファイル経由で渡して最後に消す。
          proxy_token=""
          if [ -n "$API_ORIGIN" ]; then
            if [ -z "$LB_PROXY_TOKEN" ]; then
              echo "::error::WORKERS_API_ORIGIN があるのに secret の LB_PROXY_TOKEN が無い。このままだと中継が LB で 403 になる"
              exit 1
            fi
            proxy_token="$LB_PROXY_TOKEN"
          fi
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::warning::secret の ELEVENLABS_API_KEY が無いので、呼び出し画面の音声は作れない（チャイムだけになる）"
          fi
          secret_args=()
          if [ -n "$proxy_token" ] || [ -n "$ELEVENLABS_API_KEY" ]; then
            secrets_file="$RUNNER_TEMP/worker-secrets.json"
            trap 'rm -f "$secrets_file"' EXIT
            (umask 077 && jq -n \
              --arg proxy "$proxy_token" \
              --arg eleven "$ELEVENLABS_API_KEY" \
              '(if $proxy == "" then {} else {PROXY_TOKEN: $proxy} end)
               + (if $eleven == "" then {} else {ELEVENLABS_API_KEY: $eleven} end)' \
              > "$secrets_file")
            secret_args=(--secrets-file "$secrets_file")
          fi

          status=0
          out=$(pnpm exec wrangler deploy "${var_args[@]}" "${domain_args[@]}" "${secret_args[@]}" 2>&1) || status=$?
          echo "$out"

          {
            echo "### wrangler の出力"
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
