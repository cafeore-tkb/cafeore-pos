name: caos

on:
  pull_request:
    paths:
      - 'services/caos/**'
      - '.github/workflows/caos-ci.yml'
      - 'biome.json'
      - 'pnpm-lock.yaml'
  merge_group:

defaults:
  run:
    working-directory: services/caos

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: './.github/actions/setup-deps'
      - run: pnpm run typecheck
      - run: pnpm run build

  # api-ci の lint と見分けるため、ジョブ名は biome にしている（pos-ci と同じ）。
  # biome.json がリポジトリ直下にあるので、ルートで実行する。
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: './.github/actions/setup-deps'
      - run: pnpm run lint
        working-directory: .
