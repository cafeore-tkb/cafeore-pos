name: Claude Review

# PR を開いたときと、コミットが push されるたびに Claude Code が
# 1. 実装の要約と重点的に見るべき場所を PR コメントにまとめ（push のたびに同じコメントを更新）
# 2. 最新のコミット時点で残っている修正点をすべて載せたレビューを毎回投稿する（前回からの未修正も含む）
# 3. 直ったインラインコメントは解決済みにし、古い総評は折りたたむ
# 認証は Claude サブスクの OAuth トークン（secrets.CLAUDE_CODE_OAUTH_TOKEN）
# 既存の PR は Actions 画面か `gh workflow run claude.yml -f pr_number=<番号>` で手動でも回せる
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: レビューする PR の番号
        required: true
        type: number

# 続けて push されたら古いレビューは止めて、サブスクの枠を無駄にしない
concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # draft、bot の PR、fork からの PR（Secret が読めない）は対象外。手動実行は指定された PR を必ず回す
    if: |
      github.event_name == 'workflow_dispatch' || (
        !github.event.pull_request.draft &&
        github.event.pull_request.user.type != 'Bot' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefOid,headRefOid \
            --jq '"base_sha=\(.baseRefOid)\nhead_sha=\(.headRefOid)"' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
      # Claude が付けた未解決のインラインコメントを一覧にして、直ったかを Claude に判定させる
      - name: List open Claude threads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .claude-review
          gh api graphql --paginate \
            -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$PR_NUMBER" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!, $endCursor: String) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100, after: $endCursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id isResolved path line originalLine
                        comments(first: 1) { nodes { author { login } body } }
                      }
                    }
                  }
                }
              }' \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[]
              | select((.isResolved | not) and (.comments.nodes[0].author.login | test("^claude(\\[bot\\])?$")))
              | {id, path, line: (.line // .originalLine), body: .comments.nodes[0].body}' \
            | jq -s . > .claude-review/threads.json
          echo "open threads: $(jq length .claude-review/threads.json)"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}
            BASE SHA: ${{ steps.pr.outputs.base_sha }}
            HEAD SHA: ${{ steps.pr.outputs.head_sha }}

            この PR について、次の 2 段階を順番に行ってください。コメントはすべて日本語で書きます。

            ## 1. 実装の要約（PR コメント）

            `gh pr view` と `gh pr diff` で PR 全体を読み、人間のレビュアー向けの案内を書く。

            - 1 行目は必ず `<!-- claude-summary -->` にする
            - `### 概要`: 何をなぜ変えたかを 2〜4 文で
            - `### 変更の全体像`: 領域（POS / mobile / api / common など）ごとに、振る舞いの変化を箇条書きで。ファイルを列挙するだけにしない
            - `### 重点的に見てほしい場所`: 3〜5 個まで。`path/to/file.ts:行` と、なぜそこを見るべきか（データ構造や API の変更、金額・在庫の計算、Firestore のルール、並行処理、エラー処理、既存の振る舞いが変わる箇所など）を 1 行で。リスクの高い順に並べる
            - 全体で 40 行以内に収める

            `gh pr view --comments` で `<!-- claude-summary -->` を含むコメントがすでにあれば、`gh pr comment --edit-last --body-file <file>` で最新の PR 全体の内容に書き換える。なければ `gh pr comment --body-file <file>` で新しく投稿する。
            このワークフローは PR へのコメントをこの要約にしか使わないので、`--edit-last` で要約コメントが更新される。

            ## 2. レビュー

            毎回、HEAD SHA 時点の PR 全体（`gh pr diff`）をレビューし、その時点で残っている修正点を「全部」載せたレビューを新しく投稿する。
            前回のレビューを読まなくても、最新のレビューだけで今直すべきことが全部わかる状態にする。

            - バグ、壊れるケース、セキュリティの問題を優先して指摘する。好みの問題や細かいスタイルは書かない。
            - `gh pr view --comments` で過去の Claude のレビュー（`<!-- claude-review -->` を含むもの）を読み、
              そこで指摘した点が HEAD SHA のコードで直っているかを 1 つずつ確かめる。
            - レビュー本文は `gh pr review <PR NUMBER> --comment --body-file <file>` で投稿し、次の形にする。
              - 1 行目は `<!-- claude-review -->`、2 行目に `レビュー対象: <HEAD SHA の先頭 7 文字>`
              - `### 修正が必要な点`: 今残っている指摘をすべて、重要な順に番号付きで。各項目は `path/to/file.ts:行`、問題、直し方の方針。
                前回から残っているものには「（未修正）」、今回はじめて見つけたものには「（新規）」を付ける
              - `### 前回から修正された点`: 前回の指摘のうち直ったものを 1 行ずつ。初回やなければ省く
              - 修正が必要な点がなければ、その旨を 1 行で書く
            - 今回はじめて見つけた指摘は、`mcp__github_inline_comment__create_inline_comment` で該当行にもインラインコメントする。
              未修正の指摘はインラインでは繰り返さず、レビュー本文にだけ載せる。
              インラインコメントのツールが使えない場合（手動実行など）は、レビュー本文だけでよい。
            - `.claude-review/threads.json` に、過去に付けたインラインコメントのうち未解決のもの（id・path・line・body）が入っている。
              それぞれ HEAD SHA のコードで直っているかを確かめ、直っているものの id を 1 行に 1 つずつ `.claude-review/resolved.txt` に Write で書く。
              直っていないものはレビュー本文の「修正が必要な点」に（未修正）として載せる。空の配列なら何もしない。
              解決済みにする操作はこのあとのステップが行うので、自分ではしない。
            - `gh pr comment` はレビューには使わない（要約コメントの `--edit-last` が壊れるため）。
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr review --comment *),Bash(gh pr review * --comment *),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git cat-file:*),Read,Write"
      # Claude が直ったと判定したインラインコメントに、確認したコミットを返信してから解決済みにする
      - name: Resolve fixed Claude threads
        if: hashFiles('.claude-review/resolved.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          grep -oE '[A-Za-z0-9_=-]+' .claude-review/resolved.txt | sort -u | while read -r id; do
            # threads.json にある（Claude が付けた未解決の）スレッドだけを対象にする
            jq -e --arg id "$id" 'any(.[]; .id == $id)' .claude-review/threads.json >/dev/null || continue
            gh api graphql -f id="$id" -f body="${HEAD_SHA:0:7} で修正を確認したので解決済みにします（Claude Review）" -f query='
              mutation($id: ID!, $body: String!) {
                addPullRequestReviewThreadReply(input: { pullRequestReviewThreadId: $id, body: $body }) { comment { id } }
                resolveReviewThread(input: { threadId: $id }) { thread { isResolved } }
              }' >/dev/null
            echo "resolved $id"
          done
      # 最新以外の Claude の総評を「Outdated」として折りたたむ
      - name: Minimize old Claude reviews
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          reviews=$(gh api graphql --paginate \
            -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$PR_NUMBER" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!, $endCursor: String) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    reviews(first: 100, after: $endCursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes { id body isMinimized author { login } }
                    }
                  }
                }
              }' \
            --jq '.data.repository.pullRequest.reviews.nodes[]
              | select((.author.login | test("^claude(\\[bot\\])?$")) and (.body | contains("<!-- claude-review -->")))
              | [.id, .isMinimized] | @tsv')
          # 古い順に並んでいるので、最後の 1 件（最新の総評）は残す
          echo "$reviews" | sed '$d' | while IFS=$'\t' read -r id minimized; do
            if [ -z "$id" ] || [ "$minimized" = "true" ]; then continue; fi
            gh api graphql -f id="$id" -f query='
              mutation($id: ID!) {
                minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) { minimizedComment { isMinimized } }
              }' >/dev/null
          done
