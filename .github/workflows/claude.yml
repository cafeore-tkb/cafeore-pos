name: Claude Review

# PR を開いたときと、コミットが push されるたびに Claude Code がレビューする
# 認証は Claude サブスクの OAuth トークン（secrets.CLAUDE_CODE_OAUTH_TOKEN）
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 続けて push されたら古いレビューは止めて、サブスクの枠を無駄にしない
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # draft、bot の PR、fork からの PR（Secret が読めない）は対象外
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}
            BASE SHA: ${{ github.event.pull_request.base.sha }}
            BEFORE SHA: ${{ github.event.before }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            この PR をレビューしてください。

            - EVENT が synchronize のときは、`git diff BEFORE_SHA HEAD_SHA` で今回 push された差分を中心に見る。
              BEFORE SHA が履歴にない（force push など）ときは PR 全体の差分を見る。
            - それ以外のときは `gh pr diff` で PR 全体を見る。
            - バグ、壊れるケース、セキュリティの問題を優先して指摘する。好みの問題や細かいスタイルは書かない。
            - `gh pr view --comments` で既存のコメントを確認し、同じ指摘を繰り返さない。
            - 具体的な行への指摘は `mcp__github_inline_comment__create_inline_comment` でインラインコメントにする。
            - 最後に `gh pr comment` で、今回レビューした範囲と指摘の要約を短く 1 件だけ投稿する。問題がなければそう書く。
            - コメントはすべて日本語で書く。
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git cat-file:*)"
