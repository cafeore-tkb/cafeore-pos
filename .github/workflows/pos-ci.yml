name: pos

on:
  pull_request:
    paths:
      - 'services/pos/**'
      - 'modules/common/**'
      - '.github/workflows/common-ci.yml'
      - '.github/workflows/pos-ci.yml'
      - 'biome.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
  merge_group:

defaults:
  run:
    working-directory: services/pos

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: './.github/actions/setup-deps'
      - run: pnpm run typecheck

  analytics-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: './.github/actions/setup-deps'
      - run: pnpm exec vitest run app/lib/analytics/operations.test.ts

  caos-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: './.github/actions/setup-deps'
      - run: pnpm exec vitest run --config vitest.caos.config.ts app/caos/hooks/useMasterSheetTab.test.ts app/caos/logic/orderCommentComposer.test.ts

  # 本番の画面を配る Cloud Run のサーバー（server/）と、PR のプレビューの Worker（worker/）。
  # どちらも呼び出しの音声（worker/call-voice.ts）を使う。
  server-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: './.github/actions/setup-deps'
      - run: pnpm exec vitest run -t unit server worker

  # services/pos/Dockerfile からイメージが作れるかを見る。push はしない。
  #
  # 本番の Cloud Run へのデプロイ（pos-deploy-cloudrun.yml）は main への push でしか走らないので、
  # ここで見ないと Dockerfile の壊れ（.dockerignore で要るものを落とした、など）に本番の
  # デプロイまで気づけない（api-ci の image と同じ）。設定は pos-deploy-cloudrun.yml と揃えている。
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: イメージをビルドする（push しない）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/pos/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            VITE_API_BASE_URL=https://pos.cafeore.cafe
          provenance: false
          # main の pos-deploy-cloudrun が書いたキャッシュを読むだけにする。PR から書くと
          # PR ごとにキャッシュが積み上がり、リポジトリの上限を圧迫するため。
          cache-from: type=gha,scope=pos-web

  # api-ci の lint と見分けるため、ジョブ名は biome にしている。
  # biome.json がリポジトリ直下にあるので、ルートで実行する。
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: './.github/actions/setup-deps'
      - run: pnpm run lint
        working-directory: .
