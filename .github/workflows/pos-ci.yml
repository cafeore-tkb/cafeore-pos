name: pos

on:
  pull_request:
    paths:
      - 'services/pos/**'
      - 'modules/common/**'
      - '.github/workflows/common-ci.yml'
      - '.github/workflows/pos-ci.yml'
      - 'biome.json'
      - 'pnpm-lock.yaml'
  merge_group:

defaults:
  run:
    working-directory: services/pos

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: './.github/actions/setup-deps'
      - run: pnpm run typecheck

  analytics-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: './.github/actions/setup-deps'
      - run: pnpm exec vitest run app/lib/analytics/operations.test.ts

  caos-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: './.github/actions/setup-deps'
      - run: pnpm exec vitest run --config vitest.caos.config.ts app/caos/hooks/useMasterSheetTab.test.ts

  # api-ci の lint と見分けるため、ジョブ名は biome にしている。
  # biome.json がリポジトリ直下にあるので、ルートで実行する。
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: './.github/actions/setup-deps'
      - run: pnpm run lint
        working-directory: .
