name: Setup dependencies
description: pnpm と Node をセットアップして、ワークスペース全体の依存をインストールする

# `on:` は composite action では読まれないので置かない
# （description が無いと actionlint が落ちるので、こちらは必須）。

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: './package.json'
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: pnpm install
      shell: bash
