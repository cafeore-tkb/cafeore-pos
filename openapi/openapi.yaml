components:
  schemas:
    StatusResponse:
      type: object
      required:
        - status
        - timestamp
        - version
        - database
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: 1.0.0
        database:
          type: string
          example: connected
    ItemResponse:
      type: object
      required:
        - id
        - name
        - abbr
        - item_type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        item_type:
          $ref: '#/components/schemas/ItemTypeResponse'
    # 作成リクエスト用（IDや自動生成フィールドを除外）
    ItemCreateRequest:
      type: object
      required:
        - name
        - abbr
        - item_type_id
      properties:
        name:
          type: string
        abbr:
          type: string
        item_type_id:
          type: string
          format: uuid
    # 更新リクエスト用
    ItemUpdateRequest:
      type: object
      required:
        - id
        - name
        - abbr
        - item_type_id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        item_type_id:
          type: string
          format: uuid
    MenuItemResponse:
      type: object
      required:
        - item
        - quantity
      properties:
        item:
          $ref: '#/components/schemas/ItemResponse'
        quantity:
          type: integer
          minimum: 1
    MenuItemRequest:
      type: object
      required:
        - item_id
        - quantity
      properties:
        item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    MenuResponse:
      type: object
      required:
        - id
        - name
        - abbr
        - price
        - key
        - items
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        price:
          type: integer
        key:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItemResponse'
    MenuCreateRequest:
      type: object
      required:
        - name
        - abbr
        - price
        - key
        - items
      properties:
        name:
          type: string
        abbr:
          type: string
        price:
          type: integer
          minimum: 0
        key:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MenuItemRequest'
    MenuUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/MenuCreateRequest'
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
    ItemTypeResponse:
      type: object
      required:
        - id
        - name
        - display_name
        - makes_cup
        - needs_brew
        - senior_only
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
        makes_cup:
          type: boolean
          description: この種類のアイテムは1杯ずつカップを作る（注文のカップ・マスター・提供画面に出る）。グッズは false
        needs_brew:
          type: boolean
          description: この種類のアイテムは抽出が要る（割引の対象の杯数・ドリッパーの割り振りに数える）。makes_cup が false なら必ず false
        senior_only:
          type: boolean
          description: この種類のアイテムは上級生だけが淹れる（限定）。needs_brew が false なら必ず false
    ItemTypeCreateRequest:
      type: object
      required:
        - name
        - display_name
      properties:
        name:
          type: string
        display_name:
          type: string
        makes_cup:
          type: boolean
          default: true
          description: 省略したら true
        needs_brew:
          type: boolean
          description: 省略したら makes_cup と同じ。makes_cup が false のときに true は 400
        senior_only:
          type: boolean
          default: false
          description: 省略したら false。needs_brew が false のときに true は 400
    # 更新リクエスト用
    ItemTypeUpdateRequest:
      type: object
      required:
        - id
        - name
        - display_name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
        makes_cup:
          type: boolean
          description: 省略したら今の値のまま
        needs_brew:
          type: boolean
          description: 省略したら今の値のまま（makes_cup を false にしたときは false）。makes_cup が false のときに true は 400
        senior_only:
          type: boolean
          description: 省略したら今の値のまま（needs_brew が false になるときは false）。needs_brew が false のときに true は 400
    # 指名を入れたMenu
    MenuInfo:
      type: object
      required:
        - id
        - menu_name
        - unit_price
        - menu
        - assignee
        - dripper
      properties:
        id:
          type: string
          format: uuid
          description: 注文明細ID
        menu_name:
          type: string
          description: 注文時点のメニュー名
        unit_price:
          type: integer
          description: 注文時点のメニュー価格
        menu:
          $ref: '#/components/schemas/MenuResponse'
        assignee:
          type: string
          nullable: true
          description: 指名の自由記述（ラベルに印刷する文）。dripper が無い明細では null。番号より前の注文は自由記述だけのことがある
        dripper:
          type: integer
          minimum: 1
          maximum: 6
          nullable: true
          description: 指名したドリッパーの番号（1st〜6th は 1〜6）。指名しない明細は null
    # 注文の1杯。注文明細（メニュー）の構成品を数量分に展開したもの（グッズは含まない）
    OrderCupResponse:
      type: object
      required:
        - id
        - order_menu_id
        - item
        - ready_at
        - served_at
        - dripper
        - dripper_position
        - drip_id
        - brew_started_at
        - brew_finished_at
        - emergency_at
        - emergency_drip_id
        - emergency_printed_at
      properties:
        id:
          type: string
          format: uuid
        order_menu_id:
          type: string
          format: uuid
          description: このカップを含む注文明細のID（MenuInfo.id）
        item:
          $ref: '#/components/schemas/ItemResponse'
        ready_at:
          type: string
          format: date-time
          nullable: true
          description: このカップが準備完了になった時刻。未準備なら null
        served_at:
          type: string
          format: date-time
          nullable: true
          description: このカップを提供した時刻。未提供なら null
        dripper:
          type: integer
          nullable: true
          minimum: 1
          maximum: 6
          description: CaOS が置いたドリッパーの番号（1〜6）。未割当なら null。以下の CaOS の列は CaOS 以外の画面は読まない
        dripper_position:
          type: number
          format: double
          nullable: true
          description: CaOS のドリッパーの中の順番（小さいほど先）
        drip_id:
          type: string
          format: uuid
          nullable: true
          description: CaOS のカードの印。同じ値のカップを 1 枚のカード（1 回のドリップ）で淹れる
        brew_started_at:
          type: string
          format: date-time
          nullable: true
          description: CaOS で抽出を始めた時刻
        brew_finished_at:
          type: string
          format: date-time
          nullable: true
          description: CaOS で抽出を終えた時刻
        emergency_at:
          type: string
          format: date-time
          nullable: true
          description: |
            緊急（入れ直し）にした時刻。緊急でなければ null（POST /api/caos/emergency で付ける。2 回は付けない）。
            緊急にしたとき、dripper・dripper_position・brew_started_at・brew_finished_at は空に戻り、入れ直しのカードの値になる（drip_id は最初に淹れたカードのまま）
        emergency_drip_id:
          type: string
          format: uuid
          nullable: true
          description: 入れ直しで淹れるカードの印。緊急のカップでは CaOS のカードはこちらで決まる。null なら未割当の緊急のカード
        emergency_printed_at:
          type: string
          format: date-time
          nullable: true
          description: |
            緊急のシールを印刷した時刻。emergency_at があってこれが null のカップは、プリンターにつないだレジが印刷する
            （POST .../emergency-label/claim で付けられたときだけ印刷する。失敗したら .../release で null に戻す）
