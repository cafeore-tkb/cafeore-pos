        received:
          type: integer
        discount_order_id:
          type: integer
          nullable: true
        discount_order_cups:
          type: integer
        menu_ids:
          type: array
          items:
            $ref: '#/components/schemas/MenuInfoCreate'

    # 一覧取得用（軽量版、関連データを含まない場合）
    OrderListItem:
