        level:
          $ref: '#/components/schemas/InventoryLevel'
        counted_at:
          type: string
          format: date-time
          nullable: true
          description: 最後の棚卸し。無ければ最初の入荷
        counted_quantity:
          type: number
          format: double
          nullable: true
        received:
          type: number
          format: double
          description: counted_at 以降の入荷・調整の合計
        consumed:
          type: number
          format: double
          description: counted_at 以降の注文での消費量
        servings:
          type: integer
          description: counted_at 以降に売れた杯数
        remaining:
          type: number
          format: double
          nullable: true
        remaining_servings:
          type: number
          format: double
          nullable: true
        servings_last_hour:
          type: integer
          description: 直近1時間に売れた杯数
    StockEventKind:
      type: string
