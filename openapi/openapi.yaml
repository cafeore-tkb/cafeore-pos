      summary: 緊急のシールの印刷に失敗したので、印刷した時刻を空に戻す
      description: |
        emergency_printed_at が送った時刻（claim で付けた時刻）のままなら null に戻し、注文を配る（次の更新で、どれかのレジが試し直す）。
        ほかの値になっていれば何もしない（409）。
      operationId: releaseEmergencyLabel
      tags:
        - caos
      parameters:
        - name: id
          in: path
          required: true
          description: オーダーID
          schema:
            type: string
            format: uuid
        - name: cupId
          in: path
          required: true
          description: カップID（OrderResponse.cups[].id）
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyLabelRelease'
      responses:
        '204':
          description: 空に戻した
        '400':
          description: 形の違うリクエスト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: オーダーまたはカップが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 印刷した時刻が送った時刻と違う（何もしない）
