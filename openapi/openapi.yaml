    CaosCardStatus:
      type: string
      enum: [unassigned, queued, brewing, done]
      x-enum-varnames: [CaosCardStatusUnassigned, CaosCardStatusQueued, CaosCardStatusBrewing, CaosCardStatusDone]
      description: unassigned＝未割当（保存しない） / queued＝列の待機 / brewing＝抽出中（1 つの列に 1 枚） / done＝終了
    CaosCardCup:
      type: object
      description: カードの中の 1 杯。商品・注文番号・指名は注文（/api/ws/orders の orders）のカップから引く
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: 注文のカップの ID
    CaosCard:
      type: object
      description: |
        CaOS の盤面のカード。1 回のドリップ（最大 2 杯）が 1 枚。
        未割当のカードは保存せず、まだカードに入っていないカップから組み立てる（id は null。cups の ID の組で指す）。
      required: [id, status, lane, position, started_at, finished_at, cups]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: 保存したカードの ID。未割当のカードは null（統合した未割当のカードだけはカップに入れた ID を持つ）
        status:
          $ref: '#/components/schemas/CaosCardStatus'
        lane:
          type: integer
          nullable: true
          minimum: 1
          maximum: 6
          description: 担当の列（1〜6）。未割当は null
        position:
          type: number
          format: double
          description: 並び。待機は列の中の順番（小さいほど先。ふつうは注文番号）、未割当は表示の順（0 から）
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        cups:
          type: array
          items:
            $ref: '#/components/schemas/CaosCardCup'
    CaosCardRef:
      type: object
      description: カードの指し方。保存したカードは id、未割当のカードは cups の ID の組（cup_ids）。配られたカードの id と cups をそのまま送ればよい
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        cup_ids:
          type: array
          items:
            type: string
            format: uuid
    CaosOpName:
      type: string
      enum: [assign, unassign, next, merge, undo]
      x-enum-varnames: [CaosOpNameAssign, CaosOpNameUnassign, CaosOpNameNext, CaosOpNameMerge, CaosOpNameUndo]
    CaosOp:
      type: object
      description: |
        盤面への操作。name で選び、使うものだけを送る。
        - assign：card を lane へ（未割当→待機、待機→別の列・列の中の順番の入れ替え）。index は列の待機の中の位置（0 始まり）。無ければ注文番号の順。列が空いていればそのまま抽出を始める
        - unassign：待機の card を未割当に戻す
        - next：lane の抽出中のカードを終わらせ、そのカップを準備完了にして、待機の次を始める。card を付けると、それが今の抽出中のときだけ終わらせる
        - merge：1 杯の card と with（未割当どうし・待機どうし、同じ商品・同じ指名）を 2 杯の同時抽出にまとめる
        - undo：op_id の操作を 1 つ戻す
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/CaosOpName'
        card:
          $ref: '#/components/schemas/CaosCardRef'
        with:
          $ref: '#/components/schemas/CaosCardRef'
        lane:
          type: integer
          minimum: 1
          maximum: 6
        index:
          type: integer
          minimum: 0
        op_id:
          type: string
          format: uuid
    CaosOpResult:
      type: object
      required: [op_id]
      properties:
        op_id:
          type: string
          format: uuid
          nullable: true
          description: この操作の記録の ID（「1つ戻す」で送る）。何も変わらなかった操作と undo では null
    ErrorResponse:
      type: object
      required:
        - error
