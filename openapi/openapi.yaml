    CaosCupState:
      type: object
      description: カップの今の CaOS の値（OrderCupResponse の同じ名前の列をそのまま）。全部 null なら未割当
      required: [dripper, dripper_position, drip_id, brew_started_at, brew_finished_at]
      properties:
        dripper:
          type: integer
          nullable: true
          minimum: 1
          maximum: 6
        dripper_position:
          type: integer
          nullable: true
        drip_id:
          type: string
          format: uuid
          nullable: true
        brew_started_at:
          type: string
          format: date-time
          nullable: true
        brew_finished_at:
          type: string
          format: date-time
          nullable: true
    CaosCupAfter:
      type: object
      description: |
        CaOS がカップに書く値。順番の数と抽出の時刻は送らない（順番はサーバーが insert_before から決め、開始・終了の時刻はサーバーが押した時刻から付ける。CaosPress）。
        start_brew が true なら列の先頭に入れて抽出を始める（brew_started_at を付ける。抽出中のカードなら始め直す）。false なら待機・未割当（brew_started_at・brew_finished_at は null。抽出中のカードは始めた時刻が消える）。
        dripper・drip_id・insert_before が全部 null で start_brew が false なら未割当。dripper が null で drip_id があれば、統合した未割当（同じ drip_id のカップと 1 枚のカード）
      required: [dripper, drip_id, insert_before, start_brew]
      properties:
        dripper:
          type: integer
          nullable: true
          minimum: 1
          maximum: 6
        drip_id:
          type: string
          format: uuid
          nullable: true
        insert_before:
          type: string
          format: uuid
          nullable: true
          description: |
            dripper の待機の、どのカード（drip_id）の前に入れるか。null なら最後。待機の先頭に入れるときは待機の先頭のカードの drip_id（抽出中のカードの前、つまり列の先頭は start_brew）。
            dripper が null（未割当）のときと、ほかのカップのカードに入る（統合）ときは null
        start_brew:
          type: boolean
          description: 列の先頭に入れて抽出を始める（空いているドリッパーに置いてそのまま始める・抽出中のカードを待機に下げて先頭に入れる）。時刻は押した時刻（CaosPress）
    CaosCupsWrite:
      type: object
      description: |
        カップの組を before から after にする。before はカップの今の値（注文の応答の値をそのまま送り返す。時刻はミリ秒までで比べる）。
        終わったカードのカップは書けない（終えるのは「次へ」）。抽出中のカードは、カップを全部いっしょに書く
      required: [cup_ids, before, after]
      properties:
        merge_into:
          type: string
          format: uuid
          description: 統合元の書き込みに付ける統合先の cup または淹れ直しの ID。統合の向きを履歴に残す。
        cup_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        before:
          $ref: '#/components/schemas/CaosCupState'
        after:
          $ref: '#/components/schemas/CaosCupAfter'
    CaosPress:
      type: object
      description: |
        操作を押した時刻（at）と、それを送った時刻（sent_at）。どちらも端末の時計の、エポックのミリ秒。
        端末に残して後ろで送る操作（電波が切れていたあいだに押したもの）も、抽出の開始・終了を押した時刻で付けるため。サーバーは次のように時刻を決める：
        - 送った時刻がサーバーの今より 5 秒より後か、30 秒より前なら、端末の時計がずれているとみて、押した時刻をその差だけずらす（サーバーの今 −（送った時刻 − 押した時刻））。
          そうでなければ押した時刻のまま（30 秒までは、通信にかかった長さかもしれないので）
        - サーバーの今より後ならサーバーの今。今日（日本時間）より前ならサーバーの今
        - 同じドリッパーで前の抽出を終えた時刻より前なら、その時刻
        省略すると（押した時刻を送らない古い画面）、サーバーの今
      required: [at, sent_at]
      properties:
        at:
          type: integer
          format: int64
          description: 押した時刻（端末の時計、エポックのミリ秒）
        sent_at:
          type: integer
          format: int64
          description: 送った時刻（端末の時計、エポックのミリ秒）。送り直すたびにそのときの時刻
    CaosDiscardRequest:
      type: object
      description: 元カードの対象だけを破棄する。drip_idは再送時も固定する破棄後のカードID。提供・在庫は変更しない。
      required: [cup_ids, before, drip_id]
      properties:
        cup_ids:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: string
            format: uuid
        before:
          $ref: '#/components/schemas/CaosCupState'
        drip_id:
          type: string
          format: uuid
        press:
          $ref: '#/components/schemas/CaosPress'
    CaosCupsWriteRequest:
      type: object
      required: [writes]
      properties:
        writes:
          type: array
          minItems: 1
