  /api/caos/cups:
    put:
      summary: CaOS が決めたことを注文のカップに書く
      description: |
        CaOS（ドリップ管制）の盤面は、注文のカップ（OrderResponse の cups）と淹れ直し（cups の emergencies）の列（dripper・dripper_position・drip_id・brew_started_at・brew_finished_at）で持つ。
        割当・ドリッパーの移動・順番の入れ替え・未割当に戻す・統合は、どれもこの PUT でカップの列を書く。
        cup_ids にはカップの id か淹れ直しの id を入れる（淹れ直しは、その行の列を書く。指名・商品・注文は淹れ直したカップのもの）。以下の「カップ」は淹れ直しも含む。
        writes の全部を 1 つのトランザクションで書く（どれか 1 つでも通らなければ何も書かない）。
        書いたカップの注文（順番をずらしたカップの注文も）は /api/ws/orders の {"type":"order"} で、このインスタンスにつないでいる画面に配る。

        順番（dripper_position。整数）はサーバーが決める。画面は after の insert_before（どのカードの前に入れるか）だけを送る：
        - insert_before のカードの番号を p とし、そのドリッパーで番号が p 以上の、まだ終わっていないカップを全部 +1 してから、書くカップに p を入れる
        - insert_before が null なら、そのドリッパーの終わっていないカップの最大＋1（無ければ 1）。ずらさない
        - drip_id がほかのカップ（この書き込みに入っていないもの）と同じなら、そのカードに入る（統合）。番号はそのカードと同じにし、ずらさない（insert_before は null）
        - 列から抜けたカードの番号は空いたまま（詰めない）

        抽出の時刻そのものは画面から送らない。列の先頭は抽出中で、カードを列の先頭に入れて始めるときは after の start_brew を true にし、サーバーが brew_started_at を付ける。
        時刻は press（押した時刻。CaosPress）から決め、press が無ければサーバーの今。start_brew が false なら brew_started_at を消す。
        抽出中のカードも動かせる：先頭でない所（待機）・未割当に動かすと始めた時刻が消え、先頭に入れ直すと今から始め直す。
        抽出中のある列の先頭に入れるときは、同じ writes で抽出中だったカードを待機（insert_before で待機の先頭）に下げる。通常終了は「次へ」、淹れ直し元の破棄は POST /api/caos/discard。

        確かめること：
        - before が今の値と違う（ほかの端末が先に書いた・注文の編集で消えた・「次へ」で始まった・順番がずれた）なら 409（楽観ロック）。画面は届いた注文で盤面を組み立て直す
        - after の insert_before のカードが、そのドリッパーの待機に無ければ 409
        - 終わったカード（brew_finished_at がある）は書けない。抽出中のカードはほかのカードに統合できず（drip_id は今のままか null）、カップを全部いっしょに書く
        - 今日（日本時間）の注文のカップだけ書ける
        - 抽出が要らない種類（種類の名前に others か milk を含む）のカップは、ドリッパーにもカードにも入れられない
        - 指名の番号のあるカップ（明細の dripper が 1〜6）は、その番号のドリッパーにしか置けない
        - 指名の違うカップ（明細の dripper。指名なしも 1 つの値）は、1 枚のカード（同じ drip_id）にできない
        - 上級生のみのカップ（item_types.senior_only）も、担当者が上級生でないドリッパーに置ける（断らない。画面が置いたときに知らせる）
        - 抽出を始められる（start_brew）のは、書く前のそのドリッパーに抽出中のカードがあるか、書くカップのほかに待機のカードが無いときだけ（抽出中が無く待機があれば、始めるのは「次へ」で待機の先頭）。
          書いたあと、そのドリッパーで抽出中は 1 枚だけ（全部書いてから確かめるので、writes の順によらない）。1 枚のカードは最大 2 杯。同じ drip_id のカップは同じ値（書かないカップも含めて）
      operationId: writeCaosCups
      tags:
        - caos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaosCupsWriteRequest'
      responses:
        '204':
          description: 書いた
        '400':
          description: 形の違うリクエスト・決まりに合わない（何も書かない）。error を画面にそのまま出す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: before が今の値と違う（何も書かない）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/caos/drippers/{dripper}/next:
    post:
      summary: CaOS の「次へ」
      description: |
        そのドリッパーの抽出中のカードを終え（brew_finished_at）、同じドリッパーの待機の先頭（dripper_position・注文番号・drip_id の順）を抽出中にする（brew_started_at）。
        時刻は press（押した時刻。CaosPress）から決め、press が無ければサーバーの今。始めてから 10 秒（始めた時刻と、この「次へ」の時刻の差）は断る（400）。
        カップ・注文の準備完了（ready_at）は付けない（付けるのは提供の画面の PATCH /api/orders/{id}/ready・/api/orders/{id}/cups/{cupId}/ready など）。
        カードの通常終了はこの「次へ」（淹れ直し元の破棄は POST /api/caos/discard）（提供の画面でカップを全部準備完了・提供にしても、抽出中・待機のカードのまま）。抽出中が無ければ待機の先頭を始めるだけ。
        start_next が false なら抽出中のカードを終えるだけで、待機の先頭は始めない（抽出中が無ければ 409）。
        start_drip_id を送ると、待機の先頭がそのカードのときだけ始める（違えば何も変えずに 409。押した待機のカードを始めるとき、ほかの端末が先頭を入れ替えていたら別のカードを始めない）。
        drip_id には画面が抽出中と見ているカードを送る。今の抽出中と違えば 409（二度押しや、ほかの端末と同時に押したときに次のカードまで終わらせない）。
      operationId: advanceCaosDripper
      tags:
        - caos
      parameters:
        - name: dripper
          in: path
          required: true
          description: ドリッパーの番号（1〜6）
          schema:
            type: integer
            minimum: 1
            maximum: 6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaosNextRequest'
      responses:
        '204':
          description: 終えた・始めた（書いた注文は PUT /api/caos/cups と同じく配る）
        '400':
          description: 形の違うリクエスト・始めてから 10 秒たっていない（何も変えない）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 画面の見ている抽出中が今と違う・抽出中も待機も無い・start_next が false で抽出中が無い・待機の先頭が start_drip_id と違う（何も変えない）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cup-emergencies:
    post:
      summary: カップを緊急（淹れ直し）にする
      description: |
        カップ 1 杯につき淹れ直しを 1 つ（cup_emergencies の行）足す。同じカップは何度でも淹れ直せる。カップの列（最初の抽出の記録）は変えない。
        淹れ直しは CaOS で未割当の淹れ直しのカードになり、割当・移動・統合は PUT /api/caos/cups、終えるのは「次へ」で、ふつうのカップと同じ決まりで扱う
        （cup_ids に淹れ直しの id を入れる。列は淹れ直しの行のもの）。
        足したカップの注文は /api/ws/orders の {"type":"order"} で配る（OrderCupResponse の emergencies）。
        今日（日本時間）の注文の、抽出が要るカップだけ。
        淹れ直しで減る在庫（そのカップのアイテムの在庫と、カップを作る種類ならそのカップ 1 つ）の量は、足したときの在庫の設定で決めて残す（注文と同じ）。
        在庫は足したときに使ったことにする（CaOS の抽出の時刻には依らない。GET /api/inventory）。
      operationId: createCupEmergencies
      tags:
        - caos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CupEmergencyCreateRequest'
      responses:
        '201':
          description: 足した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CupEmergencyCreateResponse'
        '400':
          description: 形の違うリクエスト・決まりに合わない（何も足さない）。error を画面にそのまま出す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: カップが消えた（何も足さない）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cup-emergencies/reasons:
    get:
      summary: よく使う緊急（淹れ直し）の理由
      description: |
        緊急の入力に出す理由の候補。前の日までも含めた全部の淹れ直しの理由を、使った回数の多い順（同じなら理由の文字の順）に 5 つまで。理由の無い淹れ直しは数えない。
      operationId: getCupEmergencyReasons
      tags:
        - caos
      responses:
        '200':
          description: 理由（よく使う順）
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/cup-emergencies/{id}:
    delete:
      summary: 緊急（淹れ直し）を取り消す
      description: |
        押し間違えた淹れ直しを消す。まだ抽出を始めていない（未割当か待機の）淹れ直しだけ。淹れ直しで減らした在庫も戻す（減る在庫の行も消す）。
        淹れ直したカップの注文は /api/ws/orders の {"type":"order"} で配る。
        取り消したことは /api/ws/orders の {"type":"cup_emergency_cancelled","cup_emergency_id":"<id>"} で全部の画面に知らせる（ほかのインスタンスへは DB の通知 cup_emergency_cancelled で）。
        画面は、この知らせを受けたときだけ、その淹れ直しの未印刷のシールを消す。
        レジに頼んだ代理印刷（POST /api/label-print-requests の id が淹れ直しの id のもの）も消す（代理印刷のレジは、この知らせで刷るのをやめる）。
        注文の編集（PUT /api/orders/{id}）で外したカップ・消した注文（DELETE /api/orders/{id}）の淹れ直しも、同じく代理印刷ごと消し、同じ知らせを出す。
      operationId: deleteCupEmergency
      tags:
        - caos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 取り消した
        '400':
          description: 抽出を始めた淹れ直し・前の日の注文（何も消さない）。error を画面にそのまま出す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 淹れ直しが無い（取り消した・注文が編集・削除された）か、ほかの端末で先に動いた（何も消さない）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/caos/lanes/{dripper}:
    put:
      summary: CaOS のドリッパーの担当者を替える（交代）
      description: |
        そのドリッパーの今日の担当者を替える。押したらその場で替える（抽出中かどうかは見ない。待機のカードもそのまま残す）。
        name が空なら担当者なし（senior は false にする）。senior は画面が sohosai-shift の上級生の名簿（seniors）で判定した値で、そのまま持つ。
        変えたら今日の担当者の全部を /api/ws/orders の {"type":"caos_lanes"} で全部の画面に配り、ほかのインスタンスへは DB の通知（dripper_assignees_changed）で知らせる
        （画面は今日の担当者をこの配信で受け取る。つないだときにも、今日の担当者があれば届く。読むだけの API は無い）。
        同じトランザクションで交代の記録（dripper_assignee_changes。時刻・ドリッパー・前の名前・後の名前・後の人が上級生か）を 1 行足す（抽出の統計のため。画面には出さない）。
      operationId: putCaosLane
      tags:
        - caos
      parameters:
        - name: dripper
          in: path
          required: true
          description: ドリッパーの番号（1〜6）
          schema:
            type: integer
            minimum: 1
            maximum: 6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaosLaneUpdateRequest'
      responses:
        '200':
          description: 替えた。今日の担当者の全部
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaosLanes'
        '400':
          description: 形の違うリクエスト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/caos/lanes/swap:
    post:
      summary: CaOS の 2 つのドリッパーの担当者を入れ替える
      description: |
        2 つのドリッパーの今日の担当者（名前と上級生か）を 1 つのトランザクションで入れ替える。カードは動かさない。
        配信は PUT /api/caos/lanes/{dripper} と同じ。交代の記録はドリッパーごとに 1 行ずつ（2 行）足す。
      operationId: swapCaosLanes
      tags:
        - caos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaosLaneSwapRequest'
      responses:
        '200':
          description: 入れ替えた。今日の担当者の全部
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaosLanes'
        '400':
          description: 形の違うリクエスト（同じドリッパーどうし、など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/caos/lanes/seniors:
    post:
      summary: CaOS の今の担当者の上級生かだけを直す
      description: |
        画面が sohosai-shift の上級生の名簿（seniors）を読み直したとき、今の担当者の上級生かを新しい名簿の判定に合わせる。名前は変えない。
        今日の担当者の名前が lanes の name と同じ（ほかの画面が替えていない）で、上級生かが senior と違うドリッパーだけ senior を書く
        （名前の無いドリッパー・名前の違うドリッパーは何もしない。同じ値を何度送っても同じ結果）。
        交代ではないので、交代の記録（dripper_assignee_changes）は足さない。
        書いたドリッパーがあれば、配信は PUT /api/caos/lanes/{dripper} と同じ（無ければ配らない）。
      operationId: updateCaosLaneSeniors
      tags:
        - caos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaosLaneSeniorsRequest'
      responses:
        '200':
          description: 直した（直すものが無かったときも）。今日の担当者の全部
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaosLanes'
        '400':
          description: 形の違うリクエスト（ドリッパーの番号が違う、など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/master-status:
    get:
      summary: オーダーストップの記録の一覧
      description: |
        オーダーストップ・再開の記録を古い順（created_at の昇順）に返す。
        今の状態は最後の1件。画面は WebSocket の master_state で受け取る。
      operationId: getMasterState
      tags:
        - system
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MasterStateResponse'
    post:
      summary: オーダーストップ・再開
      description: |
        状態変更を記録し、WebSocket の master_state で全端末に配信する。同じ状態の再送では履歴を増やさず、現在の状態を返す。
        expected を渡すと、確認時点の type と created_at が最新の状態と一致する場合だけ更新する。不一致は409で何も書かない。
        履歴がない場合の expected は type=operational、created_at=null。省略する従来の画面も利用できる。
        オーダーストップの状態を書くのはここだけ。
      operationId: updateMasterState
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterStateUpdateRequest'
      responses:
        '201':
          description: 記録した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterStateResponse'
        '409':
          description: 確認後に受付状態が変わりました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: type が stop でも operational でもない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/inventory:
    get:
      summary: 在庫の残量一覧
      description: |
        推定残量。人が入れるのは棚卸しの実数（と入荷）だけで、残りは「最後の棚卸しの実数 ＋ その後の入荷・調整 − その後に使った分」。
        使った量は、注文を受けたとき・淹れ直しを足したときに残した量（その時点の per_serving とカップの種類で決めたもの）で数える。
        棚卸しの前か後か（と直近 1 時間か）は、その物を実際に使った時刻で決める。
          - 抽出が要るカップ（豆などのアイテムの在庫と、カップ）：提供の画面でそのカップを提供可能にした時刻（order_cups.ready_at）。
            無ければ提供済みにした時刻（served_at）。どちらも無ければ、まだ使っていない
          - 抽出の要らない物（グッズ・ミルク・コースターなど）：注文を受けた時刻
          - 緊急（淹れ直し）：淹れ直しを足した時刻（取り消せば数えない）
        在庫は提供の画面の側で数え、CaOS の抽出の時刻（brew_started_at）は使わない。まだ提供可能にしていない注文を先に引くこともしない。
      operationId: getInventory
      tags:
        - inventory
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryStatus'
  /api/inventory/resources:
    post:
      summary: カップの作成
      description: 作れるのはカップだけ。アイテムの在庫はアイテムと一緒に作る（POST /api/items）。
      operationId: createStockResource
      tags:
        - inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockResourceRequest'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResourceResponse'
        '400':
          description: 名前が空、または item_type_ids の種類が無い・重複
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/inventory/resources/{id}:
    put:
      summary: 在庫対象の更新
      description: アイテムの在庫は量・単位・通知の段階だけ変えられる。name・item_type_ids を送ると 400（名前を変えるときはアイテムの名前を変える。PUT /api/items/{id}）。
      operationId: updateStockResource
      tags:
        - inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockResourceRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResourceResponse'
        '400':
          description: 値が正しくない。アイテムの在庫に name・item_type_ids を送った
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: カップの削除
      description: 消せるのはカップだけ。アイテムの在庫はアイテムを消すと一緒に消える（DELETE /api/items/{id}）。
      operationId: deleteStockResource
      tags:
        - inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
        '400':
          description: アイテムの在庫は消せない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/inventory/resources/{id}/events:
    post:
      summary: 棚卸し・入荷・調整の記録
      description: count は実数で残量を置き換える（0 以上）。receipt は入荷として正の数を足す。adjust は差分として足す（減らすときは負の値、0 は不可）。
      operationId: createStockEvent
      tags:
        - inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockEventCreateRequest'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockEventCreateResponse'
  /api/inventory/remind:
    post:
      summary: 残量確認のリマインドを Slack に送る
      description: |
        スケジューラから定期的に叩く。次のどちらかを満たさないと 401。
          - Authorization: Bearer の Google ID トークン（INVENTORY_REMIND_INVOKER の SA が audience INVENTORY_REMIND_AUDIENCE で発行したもの）。本番の Cloud Scheduler はこちら
          - X-Cron-Secret ヘッダーが INVENTORY_CRON_SECRET と一致する。ローカルや手動実行用
        直近に注文が無い（営業していない）ときは送らない。
      operationId: remindInventory
      tags:
        - inventory
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryRemindResponse'
        '401':
          description: ID トークンも合言葉も合わない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cashier-state:
    get:
      summary: レジ状態取得
      description: レジが編集中の注文と直前に確定した注文の ID。まだ一度も同期されていなければ 404。
      operationId: getCashierState
      tags:
        - system
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierStateResponse'
        '404':
          description: まだレジ状態が無い
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: レジ状態更新
      description: 単一のレジ状態を丸ごと置き換える。成功すると WebSocket で全クライアントへ配信される。
      operationId: updateCashierState
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashierStateUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierStateResponse'
        '400':
          description: editting_order に必須のキーが無い、または型が違う
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/square/status:
    get:
      summary: Square 連携が使えるか
      description: |
        SQUARE_ACCESS_TOKEN があれば enabled。フロントはこれを見て Square の決済ボタンと端末の選択を出す。
        決済に使う端末は GET /api/square/devices で取る（ペアリング済みの端末が無ければ決済できない）。
      operationId: getSquareStatus
      tags:
        - square
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareStatusResponse'
  /api/square/devices:
    get:
      summary: Square 端末の一覧
      description: |
        登録した端末と、ペアリング待ちのコード。古い順。
        コードの入力を待っている行（UNPAIRED の行と、コードを発行し直したペアリング済みの行）は、
        Square に問い合わせて最新にしてから返す。
        レジは status が PAIRED の行から、そのレジで使う端末を選ぶ。
      operationId: getSquareDevices
      tags:
        - square
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SquareDeviceResponse'
    post:
      summary: device_id を直接登録する
      description: |
        ペアリングせずに、分かっている device_id をそのまま登録する。Sandbox では実機と
        ペアリングできないので、Square が用意しているテスト用の device_id を登録するのに使う。
      operationId: createSquareDevice
      tags:
        - square
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SquareDeviceCreateRequest'
      responses:
        '201':
          description: 登録した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareDeviceResponse'
        '400':
          description: 入力が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: その device_id は登録済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/devices/pair:
    post:
      summary: 端末をペアリングするコード（Device Code）を発行する
      description: |
        返ってきた code を端末のサインイン画面（「デバイスコードでサインイン」）に入力すると、
        GET /api/square/devices で status が PAIRED になり、device_id が入る。
        Square のダッシュボードで発行したコードではペアリングできない（API で発行したコードが必要）。
      operationId: pairSquareDevice
      tags:
        - square
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SquareDevicePairRequest'
      responses:
        '201':
          description: 発行した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareDeviceResponse'
        '400':
          description: 入力が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Square がコードを発行しなかった
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Square 連携が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/devices/import:
    post:
      summary: Square でペアリング済みの端末を取り込む
      description: |
        API で発行したコードのうち PAIRED のものを Square から取り、まだ登録していない端末を登録する。
        管理画面を作る前にペアリングした端末や、一覧から外した端末を戻すのに使う。
        同じ端末に複数のコードがあるときは、最後にペアリングしたコードの名前を使う。
        取り込んだ端末だけを返す（既に登録していた端末は含めない）。
      operationId: importSquareDevices
      tags:
        - square
      responses:
        '200':
          description: 取り込んだ端末
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SquareDeviceResponse'
        '502':
          description: Square から一覧を取れなかった
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Square 連携が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/devices/{id}:
    delete:
      summary: 端末を一覧から外す
      description: |
        レジで選べなくなるだけで、端末は Square にサインインしたまま（API ではペアリングを解除できない）。
        外した端末は POST /api/square/devices/import で戻せる。
      operationId: deleteSquareDevice
      tags:
        - square
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 外した
        '404':
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/devices/{id}/code:
    post:
      summary: ペアリング済みの端末にコード（Device Code）を発行し直す
      description: |
        端末がサインアウトしたときに、サインインし直すコードを発行する。返ってきた code を端末のサインイン画面
        （「デバイスコードでサインイン」）に入力する。発行しただけでは端末はサインアウトしない。
        入力されるまでも status は PAIRED のままで、今の device_id で決済に使える。
        入力されたら GET /api/square/devices で code が消える。同じ端末なら device_id は変わらない。
        別の端末で入力したら、その端末の device_id に置き換わる。
        入力されないまま期限が切れたら code が消えるだけで、status は PAIRED のまま。
        入力待ちのときにもう一度呼ぶと、新しいコードに置き換わる。
      operationId: issueSquareDeviceCode
      tags:
        - square
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 発行した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareDeviceResponse'
        '400':
          description: ID が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ペアリング済みの端末ではない（ペアリング待ち・期限切れ）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Square がコードを発行しなかった
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Square 連携が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/checkouts:
    post:
      summary: Square Terminal に決済画面を出す
      description: |
        決済が先・注文が後の順で使う。完了したら、返ってきた id を square_checkout_id に入れて POST /api/orders する。
        同じ idempotency_key で再送したときは、新しく作らずに同じ決済依頼を返す。
        同じ端末で別の決済依頼が進行中なら 409 を返し、進行中のものを checkout に入れる。
        別の端末で進行中の決済依頼があっても出せる。
        その端末に決済手段を選ぶ画面（POST /api/square/actions）を出したままなら、先に取り消してから出す
        （端末への依頼は順に出るので、残っていると決済画面がその後ろに並ぶ）。
      operationId: createSquareCheckout
      tags:
        - square
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SquareCheckoutCreateRequest'
      responses:
        '201':
          description: 作成した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '200':
          description: 同じ idempotency_key の決済依頼が既にある
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '400':
          description: 入力が不正、または device_id がペアリング済みの端末として登録されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 同じ端末で別の決済依頼が進行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutConflictResponse'
        '502':
          description: Square が依頼を受け付けなかった
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '503':
          description: Square 連携が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/checkouts/unlinked:
    get:
      summary: 支払い済みなのに注文と結び付いていない決済依頼
      description: |
        決済中にレジが落ちた・注文の送信に失敗したなどで、お金だけ受け取った状態のものを照合するために使う。新しい順。
        返金が終わったものは出さない。返金の結果待ち（refund_status が pending）のものは、Square に問い合わせて最新にしてから返す。
        注文を残して返金した決済（一覧には出さない）も、返金の結果待ちなら Square に問い合わせ、変わったらその注文を配り直す。
      operationId: getUnlinkedSquareCheckouts
      tags:
        - square
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SquareCheckoutResponse'
  /api/square/checkouts/{id}:
    get:
      summary: 決済依頼の状態を取る
      description: 未確定なら Square に問い合わせて最新にしてから返す。レジはこれを数秒おきに呼んで完了を待つ。
      operationId: getSquareCheckout
      tags:
        - square
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '404':
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/checkouts/{id}/cancel:
    post:
      summary: 決済依頼を取り消す
      description: PENDING / IN_PROGRESS のときだけ取り消せる。電子マネーで端末にエラーが出ているときは API から取り消せないので、端末側で取り消す。
      operationId: cancelSquareCheckout
      tags:
        - square
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 取り消しを依頼した（IN_PROGRESS だったときは CANCEL_REQUESTED を経て CANCELED になる）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '404':
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Square が取り消しを受け付けなかった（既に完了しているなど）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutConflictResponse'
  /api/square/checkouts/{id}/refund:
    post:
      summary: 支払い済みの決済を全額返金する
      description: |
        Refunds API で、元の決済手段（カード・電子マネー・QR）へ全額を返す（Terminal API の返金はカナダの Interac 専用で、日本では使えない）。
        注文と結び付いていれば、Square が返金を受け付けた時点（refund_status が pending）でその注文をキャンセルする
        （消さずに cancelled_at を付ける）。決済は注文に結び付いたままなので、あとで Square で失敗したら、
        その注文の square_refund_status が failed になる。
        交通系 IC の決済は Square でも返金できないので、Square が断ったときは 502 で refund_status が failed の決済依頼を返す。
        応答が無かったときは 502 で refund_status が unknown の決済依頼を返す。
        返金の結果は Square で後から決まることがある（refund_status が pending）。GET /api/square/checkouts/{id} と
        GET /api/square/checkouts/unlinked が Square に問い合わせて最新にする。
        応答が失われたら同じ決済でもう一度呼んでよい（同じ idempotency_key で頼み直すので二重に返金されない）。
      operationId: refundSquareCheckout
      tags:
        - square
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Square が返金を受け付けた（refund_status が pending か refunded）。結び付いていた注文はキャンセルした
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '404':
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 支払いを確かめられていない、または返金を頼んでいる途中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutConflictResponse'
        '500':
          description: 返金は受け付けたが、注文をキャンセルできなかった。もう一度呼ぶとキャンセルだけをする
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Square が返金を断った、または応答が無かった
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '503':
          description: Square 連携が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/square-refund:
    post:
      summary: 注文に使った Square の決済を全額返金し、注文をキャンセルする
      description: |
        その注文に結び付いた決済依頼で POST /api/square/checkouts/{id}/refund と同じことをする。
        個別会計で Square の決済が複数あれば、全部を返金し、全部を受け付けたときだけ注文をキャンセルする
        （消さずに cancelled_at を付ける。番号は使ったまま、在庫も戻さない）。現金で払った分は返さない
        （手で返して POST /api/orders/{id}/cash-refund で記録する）。
        応答はそのうちの 1 つ（返金できなかったもの、無ければ結果待ちのもの、無ければ最後のもの）。
        途中で止まっても、もう一度呼ぶと受け付け済みの決済は頼み直さずに残りを返金する。
      operationId: refundOrderSquarePayment
      tags:
        - square
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Square が返金を受け付け、注文をキャンセルした
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '404':
          description: 注文が無い
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            支払いを確かめられていない、または返金を頼んでいる途中（checkout にその決済依頼を付ける）。
            注文はあるが Square の決済が無い（現金の注文など）ときも 409 で、error だけを返す
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SquareCheckoutConflictResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 返金は受け付けたが、注文をキャンセルできなかった。もう一度呼ぶとキャンセルだけをする
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Square が返金を断った、または応答が無かった
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '503':
          description: Square 連携が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/square-refund-keep-order:
    post:
      summary: 注文に使った Square の決済を全額返金し、注文は残す
      description: |
        その注文に結び付いた決済依頼を POST /api/square/checkouts/{id}/refund と同じように返金するが、注文は消さない
        （カップの提供も続き、請求額・支払い方法もそのまま）。返金の状態は注文の square_refund_status で配る。
        あとで Square で返金が失敗したら、その注文の square_refund_status が failed になる（「未登録の Square 決済」には出ない）。
        結果待ち（pending）の返金は GET /api/square/checkouts/unlinked が Square に問い合わせて最新にする。
        返金を受け付けたあとに POST /api/orders/{id}/square-refund を呼ぶと、Square には頼まずにキャンセルだけをする。
        個別会計で Square の決済が複数あれば全部を返金する（応答の選び方は square-refund と同じ）。
      operationId: refundOrderSquarePaymentKeepingOrder
      tags:
        - square
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Square が返金を受け付けた（refund_status が pending か refunded）。注文はそのまま
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '404':
          description: 注文が無い
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            支払いを確かめられていない、または返金を頼んでいる途中（checkout にその決済依頼を付ける）。
            注文はあるが Square の決済が無い（現金の注文など）ときも 409 で、error だけを返す
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SquareCheckoutConflictResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Square が返金を断った、または応答が無かった
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '503':
          description: Square 連携が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/actions:
    post:
      summary: Square Terminal にお客さんが決済手段を選ぶ画面を出す
      description: |
        Terminal API の action（SELECT）で、options の決済手段を端末に並べる。レジは会計の段階に入ったら出し、
        お客さんが選んだら（outcome が selected）その決済手段で会計する。レジは SPLIT（割り勘）を並べない。
        スタッフがレジで決済手段を選んだら取り消す。
        同じ idempotency_key で再送したときは、新しく作らずに同じものを返す。
        端末への依頼は 1 件ずつ順に出るので、その端末に出したままの別の画面（この API で出したもの）は取り消してから出す。
        同じ端末で決済依頼が進行中なら出さずに 409 を返す（決済画面の後ろに並んでしまうため）。
        決済依頼を作るとき（POST /api/square/checkouts）も、その端末に出したままのこの画面を先に取り消す。
      operationId: createSquareAction
      tags:
        - square
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SquareActionCreateRequest'
      responses:
        '201':
          description: 作成した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareActionResponse'
        '200':
          description: 同じ idempotency_key のものが既にある
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareActionResponse'
        '400':
          description: 入力が不正、または device_id がペアリング済みの端末として登録されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 同じ端末で決済依頼が進行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Square が依頼を受け付けなかった
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareActionResponse'
        '503':
          description: Square 連携が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/actions/{id}:
    get:
      summary: 決済手段を選ぶ画面の状態を取る
      description: まだ選ばれていなければ Square に問い合わせて最新にしてから返す。レジはこれを数秒おきに呼んで、選ばれるのを待つ。
      operationId: getSquareAction
      tags:
        - square
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareActionResponse'
        '404':
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/actions/{id}/cancel:
    post:
      summary: 決済手段を選ぶ画面を取り消す
      description: |
        スタッフがレジで決済手段を選んだとき・会計を終えたときに呼ぶ。端末は待ち受けの画面に戻る。
        既に選ばれていた・取り消されていたときは、何もせずに今の状態を返す（outcome で分かる）。
      operationId: cancelSquareAction
      tags:
        - square
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 取り消しを依頼した、または既に終わっていた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareActionResponse'
        '404':
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Square にまだ届いていない（作っている途中）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Square が取り消しを受け付けなかった
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Square 連携が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/webhook:
    post:
      summary: Square からの Webhook（terminal.checkout.created / terminal.checkout.updated）
      description: |
        x-square-hmacsha256-signature ヘッダーの署名が合わなければ 403。
        （ヘッダーをパラメータとして書くと、生成される api_gin.go が models の型を参照できずビルドが通らないので説明だけに留める）
      operationId: receiveSquareWebhook
      tags:
        - square
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 受け取った
        '403':
          description: 署名が合わない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Webhook の署名鍵が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/data-reset:
    get:
      summary: 営業データのリセットの前の状態
      description: |
        管理者（AUTH_ADMIN_EMAILS）だけ。API の認証が有効でない（AUTH_MODE が off か *-report-only）ときは誰も使えない
        （PR のプレビューは AUTH_PREVIEW_ADMIN で管理者としてログインした扱いなので使える）。
        消す表と行数・残す表・受付を止めているか・確認の文字を返す。
      operationId: getDataResetStatus
      tags: [admin]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResetStatus'
        '403':
          description: 管理者でない、または API の認証が有効でない。error を画面にそのまま出す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: 営業データを消す
      description: |
        管理者だけ。注文・CaOS の記録・Square の決済の記録・棚卸しと入荷の記録・受付状態の履歴などを消し、
        メニュー・アイテム・在庫対象・色・プリンター・Square 端末の設定は残す。DB のユーザーやスキーマには触らない。
        受付を止めていて、消す直前の中身が backupSha256 のバックアップ（GET /api/admin/data-reset/backup）と同じで、
        confirmation が確認の文字と同じときだけ消す。消したら WebSocket で data_reset を配る。
      operationId: resetData
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataResetRequest'
      responses:
        '200':
          description: 消した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResetResult'
        '400':
          description: リクエストが不正（確認の文字が違うなど）。error を画面にそのまま出す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 管理者でない、または API の認証が有効でない。error を画面にそのまま出す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 受付を止めていない・ダウンロードしたあとにデータが変わった・知らない表がある。何も消していない。error を画面にそのまま出す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 消す表をロックしてから決まった時間（60 秒）以内に確かめきれなかった。ロールバックしたので何も消していない。error を画面にそのまま出す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/data-reset/backup:
    get:
      summary: 営業データのリセットで消す表の中身を全部書き出す
      description: |
        管理者だけ。消す表の全行を、表ごとに決まった順で JSON にする（同じ中身なら同じバイト列になる）。
        リセットのときは、このファイルの SHA-256 を backupSha256 に入れる。
      operationId: exportDataResetBackup
      tags: [admin]
      responses:
        '200':
          description: バックアップの JSON ファイル
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResetBackup'
        '403':
          description: 管理者でない、または API の認証が有効でない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    StatusResponse:
      type: object
      required:
        - status
        - timestamp
        - version
        - database
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: 1.0.0
        database:
          type: string
          example: connected
        build:
          $ref: '#/components/schemas/BuildInfo'
    BuildInfo:
      type: object
      description: |
        このサーバーがどの PR・コミットからビルドされたか。CI がイメージを作るときに焼き込む。
        POS のトップページに、画面のビルドと並べて出す。
        ローカルで動かしたときは空。この項目より前のサーバーは build 自体を返さない。
      properties:
        pr:
          type: integer
          description: PR の番号。プレビューはその PR、本番はマージした PR。分からなければ省く
          example: 889
        commit:
          type: string
          description: コミットの SHA。プレビューは PR の head のコミット。分からなければ省く
          example: 90b89b2a1c3e4f5061728394a5b6c7d8e9f01234
    ItemResponse:
      type: object
      required:
        - id
        - name
        - abbr
        - item_type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        item_type:
          $ref: '#/components/schemas/ItemTypeResponse'
    # 作成リクエスト用（IDや自動生成フィールドを除外）
    ItemCreateRequest:
      type: object
      required:
        - name
        - abbr
        - item_type_id
      properties:
        name:
          type: string
        abbr:
          type: string
        item_type_id:
          type: string
          format: uuid
    # 更新リクエスト用
    ItemUpdateRequest:
      type: object
      required:
        - id
        - name
        - abbr
        - item_type_id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        item_type_id:
          type: string
          format: uuid
    MenuItemResponse:
      type: object
