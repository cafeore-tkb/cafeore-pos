      x-enum-descriptions:
        - TM-L90
        - TM-m30
    PrinterPaperWidth:
      type: string
      description: |
        プリンターに入れる紙（ロール紙・ラベル紙）の幅。刷るものをこの紙の印字幅に合わせる
      enum:
        - 58mm
        - 80mm
      x-enum-varnames:
        - PrinterPaperWidth58mm
        - PrinterPaperWidth80mm
      # 画面に出す名前。POS（openapiEnumLabels）はここに合わせる
      x-enum-descriptions:
        - 58mm
        - 80mm
    PrinterPaperType:
      type: string
      description: |
        プリンターに入れる紙の種類。印字できる幅が変わる（ダイカットラベルはレシート紙より狭い。TM-L90 の 80mm で 576 → 560 ドット）。
        receipt はレシート紙（ロール紙・連続ラベル）、die_cut_label はダイカットラベル（台紙に 1 枚ずつ並んだシール）
      enum:
        - receipt
        - die_cut_label
      x-enum-varnames:
        - PrinterPaperTypeReceipt
        - PrinterPaperTypeDieCutLabel
      # 画面に出す名前。POS（openapiEnumLabels）はここに合わせる
      x-enum-descriptions:
        - レシート紙
        - ダイカットラベル
    LabelPrinterTrailingFeed:
      type: string
      description: |
        ラベル用のプリンターで、一連の印刷（1 回に送るシール）の最後にどう送るか。
        blank_label は空のシールを 1 枚送る（シールの先頭に少しの高さの白を刷ってから、次のシールの先頭まで送る）。
        peeling は剥離位置（ピーラーでシールを台紙から剥がす所）まで送る（ピーラーは、そのシールを取るまで次を刷らない）
      enum:
