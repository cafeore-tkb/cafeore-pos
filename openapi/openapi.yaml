    StockResourceRequest:
      type: object
      description: name と item_type_ids はカップだけに使う。アイテムの在庫ではアイテムの名前を使い、この 2 つを送ると 400
      required:
        - unit
        - per_serving
        - notify_from
        - notify_step
        - buffer
      properties:
        name:
          type: string
          description: カップの名前（カップでは必須）
          example: ホットカップ
        item_type_ids:
          type: array
          description: このカップを使うアイテムの種類。この種類のアイテムが 1 つ売れるごとに per_serving 減る。省略すると今のまま（作るときは空）
          items:
            type: string
            format: uuid
        unit:
          type: string
          description: 数える単位（個 / g）
          example: 個
        per_serving:
          type: number
          format: double
          description: 1 回で減る量。残量を回数に換算するのにも使う（豆 15、コースター 1、カップ 1）
          minimum: 0
          not:
            enum: [0]
          example: 1
        notify_from:
          type: integer
          description: 残りがこの回数を切ったら通知を始める
          minimum: 0
          example: 500
        notify_step:
          type: integer
          description: notify_from から何回減るごとに通知するか
          minimum: 0
          example: 100
        buffer:
          type: integer
          description: 最低限残したい回数。これを切ると危険扱い
          minimum: 0
          example: 100
    StockResourceResponse:
      type: object
      required:
        - id
        - kind
        - item_id
        - name
        - item_type_ids
        - unit
        - per_serving
        - notify_from
        - notify_step
        - buffer
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/StockResourceKind'
        item_id:
          type: string
          format: uuid
          nullable: true
          description: アイテムの在庫ならそのアイテム。カップは null
        name:
          type: string
          description: アイテムの在庫ならアイテムの名前、カップならカップの名前
        item_type_ids:
          type: array
          description: このカップを使うアイテムの種類（アイテムの在庫は空）
          items:
            type: string
            format: uuid
        unit:
          type: string
        per_serving:
          type: number
          format: double
        notify_from:
          type: integer
        notify_step:
          type: integer
        buffer:
          type: integer
    InventoryLevel:
