      type: object
      description: API を呼んだ相手と、その権限。
      required: [enforcement, email, role]
      properties:
        enforcement:
          type: string
          enum: ['off', report-only, enforce]
          x-enum-varnames: [MeEnforcementOff, MeEnforcementReportOnly, MeEnforcementEnforce]
          description: |
            API が相手を確かめて弾くか（AUTH_MODE）。
            off は確かめない（誰でも全部の操作ができる。email と role は null）。
