    InventoryRemindResponse:
      type: object
      required:
        - sent
      properties:
        sent:
          type: boolean
        reason:
          type: string
    PaymentMethod:
      type: string
      enum: [cash, square]
      default: cash
      description: 支払い方法。square は Square Terminal での決済（カード・電子マネー・QR）
    SquarePaymentType:
      type: string
      enum: [CARD_PRESENT, FELICA_ALL, QR_CODE]
      description: Square Terminal に出す決済画面の種類（Square の payment_type をそのまま使う）
    SquareCheckoutOutcome:
      type: string
      enum: [pending, paid, failed, attention]
      description: |
        レジが次に何をすべきかをサーバーが判定したもの。
          - pending: まだ決まっていない。待つ
          - paid: 支払い済みで、受取額も依頼額と一致した。注文を送ってよい
          - failed: 取り消された・失敗した。お金は受け取っていない
          - attention: 完了したが受取額が依頼額と合わないなど、人が Square の管理画面で確かめる必要がある
    SquareRefundStatus:
      type: string
      enum: [none, pending, refunded, failed, unknown]
      # SquareCheckoutOutcome と値（pending / failed）が重なると、oapi-codegen が両方の定数名に型名を付けて
      # 既存の models.Pending などが消える。こちらだけ名前を決めておく。
      x-enum-varnames: [RefundNone, RefundPending, RefundRefunded, RefundFailed, RefundUnknown]
      description: |
        返金（全額）の状態。
          - none: 返金を頼んでいない
          - pending: Square に頼んだ。結果を待っている
          - refunded: 返金が終わった
          - failed: Square が断った・失敗した（お金は手元にある）。もう一度頼めるし、注文にも使える
          - unknown: Square から応答が無く、返金できたか分からない。もう一度頼むと確かめる（同じ idempotency_key を使うので二重には返金されない）。分かるまで注文には使えない
    SquareStatusResponse:
      type: object
      required:
        - enabled
        - environment
        - webhook_enabled
      properties:
        enabled:
          type: boolean
        environment:
          type: string
          description: production か sandbox
        webhook_enabled:
          type: boolean
    SquareDeviceStatus:
      type: string
      enum: [UNPAIRED, PAIRED, EXPIRED]
      description: |
        端末のペアリングの状態（Square の Device Code の status）。
          - UNPAIRED: コードを発行した。端末でまだ入力されていない
          - PAIRED: ペアリング済み。決済に使える
          - EXPIRED: 入力されないまま期限が切れた。外して発行し直す
    SquareDeviceResponse:
      type: object
      required:
        - id
        - name
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: 管理画面とレジで出す名前（例 レジ1）
        status:
          $ref: '#/components/schemas/SquareDeviceStatus'
        device_id:
          type: string
          nullable: true
          description: 端末の ID。決済の依頼に使う。PAIRED になるまで null
        code:
          type: string
          nullable: true
          description: 端末のサインイン画面に入力するコード。UNPAIRED の間だけ入る
        pair_by:
          type: string
          format: date-time
          nullable: true
          description: コードの期限。これを過ぎると EXPIRED になる
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SquareDevicePairRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: 管理画面とレジで出す名前。Square の管理画面にもコードの名前として出る
    SquareDeviceCreateRequest:
      type: object
      required:
        - name
        - device_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        device_id:
          type: string
          minLength: 1
          maxLength: 255
    SquareCheckoutCreateRequest:
      type: object
      required:
        - idempotency_key
        - device_id
        - amount
        - payment_type
      properties:
        device_id:
          type: string
          minLength: 1
          description: 決済画面を出す端末。GET /api/square/devices で PAIRED の行の device_id
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 64
          description: レジが決済ごとに作る一意な値（UUID）。再送しても二重に決済画面が出ないようにする
        amount:
          type: integer
          minimum: 1
          description: 請求額（円）
        payment_type:
          $ref: '#/components/schemas/SquarePaymentType'
        order_number:
          type: integer
          nullable: true
          description: 依頼時点の注文番号（端末のメモと照合の表示に使う）
    SquareCheckoutResponse:
      type: object
      required:
        - id
        - device_id
        - status
        - outcome
        - amount
        - payment_type
        - payment_ids
        - refund_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        device_id:
          type: string
          description: 決済画面を出した端末
        checkout_id:
          type: string
          nullable: true
          description: Square の TerminalCheckout の id
        status:
          type: string
          description: Square の status（PENDING / IN_PROGRESS / CANCEL_REQUESTED / CANCELED / COMPLETED）。依頼前は CREATING、依頼に失敗したら ERROR
        outcome:
          $ref: '#/components/schemas/SquareCheckoutOutcome'
        cancel_reason:
          type: string
          nullable: true
        amount:
          type: integer
        paid_amount:
          type: integer
          nullable: true
          description: 完了後に Payments API で確かめた受取額（円）
        payment_type:
          type: string
        payment_ids:
          type: array
          items:
            type: string
        error_message:
          type: string
          nullable: true
        order_number:
          type: integer
          nullable: true
        order_id:
          type: string
          format: uuid
          nullable: true
          description: この決済で作った注文。まだ無ければ null
        refund_status:
          $ref: '#/components/schemas/SquareRefundStatus'
        refund_error:
          type: string
          nullable: true
          description: 返金を断られた・確かめられなかったときの Square のエラー
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SquareCheckoutConflictResponse:
      type: object
      required:
        - error
        - checkout
      properties:
        error:
          type: string
        checkout:
          $ref: '#/components/schemas/SquareCheckoutResponse'
