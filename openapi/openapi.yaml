                $ref: '#/components/schemas/StockUsage'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockUsage'
  /api/inventory/remind:
    post:
      summary: 残量確認のリマインドを Slack に送る
      description: |
        スケジューラから定期的に叩く。次のどちらかを満たさないと 401。
          - Authorization: Bearer の Google ID トークン（INVENTORY_REMIND_INVOKER の SA が audience INVENTORY_REMIND_AUDIENCE で発行したもの）。本番の Cloud Scheduler はこちら
          - X-Cron-Secret ヘッダーが INVENTORY_CRON_SECRET と一致する。ローカルや手動実行用
        （ヘッダーをパラメータやセキュリティスキームとして書くと、生成される api_gin.go が models の型を参照できずビルドが通らないので説明だけに留める）
        直近に注文が無い（営業していない）ときは送らない。
      operationId: remindInventory
      tags:
        - inventory
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryRemindResponse'
        '401':
          description: ID トークンも合言葉も合わない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cashier-state:
    get:
      summary: レジ状態取得
      description: レジが編集中の注文と直前に確定した注文の ID。まだ一度も同期されていなければ 404。
      operationId: getCashierState
      tags:
        - system
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierStateResponse'
        '404':
          description: まだレジ状態が無い
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: レジ状態更新
      description: 単一のレジ状態を丸ごと置き換える。成功すると WebSocket で全クライアントへ配信される。
      operationId: updateCashierState
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashierStateUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierStateResponse'
        '400':
          description: editting_order に必須のキーが無い、または型が違う
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/square/status:
    get:
      summary: Square 連携が使えるか
      description: |
        SQUARE_ACCESS_TOKEN があれば enabled。フロントはこれを見て Square の決済ボタンと端末の選択を出す。
        決済に使う端末は GET /api/square/devices で取る（ペアリング済みの端末が無ければ決済できない）。
      operationId: getSquareStatus
      tags:
        - square
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareStatusResponse'
  /api/square/devices:
    get:
      summary: Square 端末の一覧
      description: |
        登録した端末と、ペアリング待ちのコード。古い順。
        ペアリング待ち（UNPAIRED）の行は、Square に問い合わせて最新にしてから返す。
        レジは status が PAIRED の行から、そのレジで使う端末を選ぶ。
      operationId: getSquareDevices
      tags:
        - square
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SquareDeviceResponse'
    post:
      summary: device_id を直接登録する
      description: |
        ペアリングせずに、分かっている device_id をそのまま登録する。Sandbox では実機と
        ペアリングできないので、Square が用意しているテスト用の device_id を登録するのに使う。
      operationId: createSquareDevice
      tags:
        - square
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SquareDeviceCreateRequest'
      responses:
        '201':
          description: 登録した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareDeviceResponse'
        '400':
          description: 入力が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: その device_id は登録済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/devices/pair:
    post:
      summary: 端末をペアリングするコード（Device Code）を発行する
      description: |
        返ってきた code を端末のサインイン画面（「デバイスコードでサインイン」）に入力すると、
        GET /api/square/devices で status が PAIRED になり、device_id が入る。
        Square のダッシュボードで発行したコードではペアリングできない（API で発行したコードが必要）。
      operationId: pairSquareDevice
      tags:
        - square
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SquareDevicePairRequest'
      responses:
        '201':
          description: 発行した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareDeviceResponse'
        '400':
          description: 入力が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Square がコードを発行しなかった
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Square 連携が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/devices/import:
    post:
      summary: Square でペアリング済みの端末を取り込む
      description: |
        API で発行したコードのうち PAIRED のものを Square から取り、まだ登録していない端末を登録する。
        管理画面を作る前にペアリングした端末や、一覧から外した端末を戻すのに使う。
        同じ端末に複数のコードがあるときは、最後にペアリングしたコードの名前を使う。
        取り込んだ端末だけを返す（既に登録していた端末は含めない）。
      operationId: importSquareDevices
      tags:
        - square
      responses:
        '200':
          description: 取り込んだ端末
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SquareDeviceResponse'
        '502':
          description: Square から一覧を取れなかった
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Square 連携が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/devices/{id}:
    delete:
      summary: 端末を一覧から外す
      description: |
        レジで選べなくなるだけで、端末は Square にサインインしたまま（API ではペアリングを解除できない）。
        外した端末は POST /api/square/devices/import で戻せる。
      operationId: deleteSquareDevice
      tags:
        - square
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 外した
        '404':
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/checkouts:
    post:
      summary: Square Terminal に決済画面を出す
      description: |
        決済が先・注文が後の順で使う。完了したら、返ってきた id を square_checkout_id に入れて POST /api/orders する。
        同じ idempotency_key で再送したときは、新しく作らずに同じ決済依頼を返す。
        同じ端末で別の決済依頼が進行中なら 409 を返し、進行中のものを checkout に入れる。
        別の端末で進行中の決済依頼があっても出せる。
      operationId: createSquareCheckout
      tags:
        - square
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SquareCheckoutCreateRequest'
      responses:
        '201':
          description: 作成した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '200':
          description: 同じ idempotency_key の決済依頼が既にある
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '400':
          description: 入力が不正、または device_id がペアリング済みの端末として登録されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 同じ端末で別の決済依頼が進行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutConflictResponse'
        '502':
          description: Square が依頼を受け付けなかった
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '503':
          description: Square 連携が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/checkouts/unlinked:
    get:
      summary: 支払い済みなのに注文と結び付いていない決済依頼
      description: |
        決済中にレジが落ちた・注文の送信に失敗したなどで、お金だけ受け取った状態のものを照合するために使う。新しい順。
        返金が終わったものは出さない。返金の結果待ち（refund_status が pending）のものは、Square に問い合わせて最新にしてから返す。
      operationId: getUnlinkedSquareCheckouts
      tags:
        - square
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SquareCheckoutResponse'
  /api/square/checkouts/{id}:
    get:
      summary: 決済依頼の状態を取る
      description: 未確定なら Square に問い合わせて最新にしてから返す。レジはこれを数秒おきに呼んで完了を待つ。
      operationId: getSquareCheckout
      tags:
        - square
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '404':
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/checkouts/{id}/cancel:
    post:
      summary: 決済依頼を取り消す
      description: PENDING / IN_PROGRESS のときだけ取り消せる。電子マネーで端末にエラーが出ているときは API から取り消せないので、端末側で取り消す。
      operationId: cancelSquareCheckout
      tags:
        - square
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 取り消しを依頼した（IN_PROGRESS だったときは CANCEL_REQUESTED を経て CANCELED になる）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '404':
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Square が取り消しを受け付けなかった（既に完了しているなど）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutConflictResponse'
  /api/square/checkouts/{id}/refund:
    post:
      summary: 支払い済みの決済を全額返金する
      description: |
        Refunds API で、元の決済手段（カード・電子マネー・QR）へ全額を返す（Terminal API の返金はカナダの Interac 専用で、日本では使えない）。
        注文と結び付いていれば、Square が返金を受け付けた時点でその注文を消す。
        Square が受け付けた時点（refund_status が pending）で注文を消す。あとで Square で失敗したら、決済は
        GET /api/square/checkouts/unlinked に refund_status が failed で出るので、頼み直すか注文を登録し直す。
        交通系 IC の決済は Square でも返金できないので、Square が断ったときは 502 で refund_status が failed の決済依頼を返す。
        応答が無かったときは 502 で refund_status が unknown の決済依頼を返す。
        返金の結果は Square で後から決まることがある（refund_status が pending）。GET /api/square/checkouts/{id} と
        GET /api/square/checkouts/unlinked が Square に問い合わせて最新にする。
        応答が失われたら同じ決済でもう一度呼んでよい（同じ idempotency_key で頼み直すので二重に返金されない）。
      operationId: refundSquareCheckout
      tags:
        - square
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Square が返金を受け付けた（refund_status が pending か refunded）。結び付いていた注文は消した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '404':
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 支払いを確かめられていない、または返金を頼んでいる途中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutConflictResponse'
        '500':
          description: 返金は受け付けたが、注文を消せなかった。もう一度呼ぶと注文だけを消す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Square が返金を断った、または応答が無かった
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '503':
          description: Square 連携が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/square-refund:
    post:
      summary: 注文に使った Square の決済を全額返金し、注文を消す
      description: その注文に結び付いた決済依頼で POST /api/square/checkouts/{id}/refund と同じことをする。
      operationId: refundOrderSquarePayment
      tags:
        - square
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Square が返金を受け付け、注文を消した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '404':
          description: 注文が無い、またはその注文に Square の決済が無い（現金の注文など）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 支払いを確かめられていない、または返金を頼んでいる途中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutConflictResponse'
        '500':
          description: 返金は受け付けたが、注文を消せなかった。もう一度呼ぶと注文だけを消す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Square が返金を断った、または応答が無かった
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '503':
          description: Square 連携が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/webhook:
    post:
      summary: Square からの Webhook（terminal.checkout.created / terminal.checkout.updated）
      description: |
        x-square-hmacsha256-signature ヘッダーの署名が合わなければ 403。
        （ヘッダーをパラメータとして書くと、生成される api_gin.go が models の型を参照できずビルドが通らないので説明だけに留める）
      operationId: receiveSquareWebhook
      tags:
        - square
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 受け取った
        '403':
          description: 署名が合わない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Webhook の署名鍵が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    StatusResponse:
      type: object
      required:
        - status
        - timestamp
        - version
        - database
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: 1.0.0
        database:
          type: string
          example: connected
    ItemResponse:
      type: object
      required:
        - id
        - name
        - abbr
        - item_type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        item_type:
          $ref: '#/components/schemas/ItemTypeResponse'
    # 作成リクエスト用（IDや自動生成フィールドを除外）
    ItemCreateRequest:
      type: object
      required:
        - name
        - abbr
        - item_type_id
      properties:
        name:
          type: string
        abbr:
          type: string
        item_type_id:
          type: string
          format: uuid
    # 更新リクエスト用
    ItemUpdateRequest:
      type: object
      required:
        - id
        - name
        - abbr
        - item_type_id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        item_type_id:
          type: string
          format: uuid
    MenuItemResponse:
      type: object
      required:
        - item
        - quantity
      properties:
        item:
          $ref: '#/components/schemas/ItemResponse'
        quantity:
          type: integer
          minimum: 1
    MenuItemRequest:
      type: object
      required:
        - item_id
        - quantity
      properties:
        item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    MenuResponse:
      type: object
      required:
        - id
        - name
        - abbr
        - price
        - key
        - items
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        price:
          type: integer
        key:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItemResponse'
    MenuCreateRequest:
      type: object
      required:
        - name
        - abbr
        - price
        - key
        - items
      properties:
        name:
          type: string
        abbr:
          type: string
        price:
          type: integer
          minimum: 0
        key:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MenuItemRequest'
    MenuUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/MenuCreateRequest'
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
    ItemTypeResponse:
      type: object
      required:
        - id
        - name
        - display_name
        - makes_cup
        - needs_brew
        - senior_only
        - iced_brew
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
        makes_cup:
          type: boolean
          description: この種類のアイテムは1杯ずつカップを作る（注文のカップ・マスター・提供画面に出る）。グッズは false
        needs_brew:
          type: boolean
          description: この種類のアイテムは抽出が要る（割引の対象の杯数・ドリッパーの割り振りに数える）。makes_cup が false なら必ず false
        senior_only:
          type: boolean
          description: この種類のアイテムは上級生だけが淹れる。needs_brew が false なら必ず false
        iced_brew:
          type: boolean
          description: この種類のアイテムはアイスで淹れる（CaOS でアイスに対応していないドリッパーに割り振らない）。needs_brew が false なら必ず false
    ItemTypeCreateRequest:
      type: object
      required:
        - name
        - display_name
      properties:
        name:
          type: string
        display_name:
          type: string
        makes_cup:
          type: boolean
          default: true
          description: 省略したら true
        needs_brew:
          type: boolean
          description: 省略したら makes_cup と同じ。makes_cup が false のときに true は 400
        senior_only:
          type: boolean
          default: false
          description: 省略したら false。needs_brew が false のときに true は 400
        iced_brew:
          type: boolean
          default: false
          description: 省略したら false。needs_brew が false のときに true は 400
    # 更新リクエスト用
    ItemTypeUpdateRequest:
      type: object
      required:
        - id
        - name
        - display_name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
        makes_cup:
          type: boolean
          description: 省略したら今の値のまま
        needs_brew:
          type: boolean
          description: 省略したら今の値のまま（makes_cup を false にしたときは false）。makes_cup が false のときに true は 400
        senior_only:
          type: boolean
          description: 省略したら今の値のまま（needs_brew が false になるときは false）。needs_brew が false のときに true は 400
        iced_brew:
          type: boolean
          description: 省略したら今の値のまま（needs_brew が false になるときは false）。needs_brew が false のときに true は 400
    # 指名を入れたMenu
    MenuInfo:
      type: object
      required:
        - id
        - menu_name
        - unit_price
        - menu
        - assignee
      properties:
        id:
          type: string
          format: uuid
          description: 注文明細ID
        menu_name:
          type: string
          description: 注文時点のメニュー名
        unit_price:
          type: integer
          description: 注文時点のメニュー価格
        menu:
          $ref: '#/components/schemas/MenuResponse'
        assignee:
          type: string
          nullable: true
    # 注文の1杯。注文明細（メニュー）の構成品を数量分に展開したもの（グッズは含まない）
    OrderCupResponse:
      type: object
      required:
        - id
        - order_menu_id
        - item
        - ready_at
        - served_at
        - dripper
        - dripper_position
        - drip_id
        - brew_started_at
        - brew_finished_at
      properties:
        id:
          type: string
          format: uuid
        order_menu_id:
          type: string
          format: uuid
          description: このカップを含む注文明細のID（MenuInfo.id）
        item:
          $ref: '#/components/schemas/ItemResponse'
        ready_at:
          type: string
          format: date-time
          nullable: true
          description: このカップが準備完了になった時刻。未準備なら null
        served_at:
          type: string
          format: date-time
          nullable: true
          description: このカップを提供した時刻。未提供なら null
        dripper:
          type: integer
          nullable: true
          minimum: 1
          maximum: 6
          description: CaOS が置いたドリッパーの番号（1〜6）。未割当なら null。以下の CaOS の列は CaOS 以外の画面は読まない
        dripper_position:
          type: integer
          nullable: true
          description: CaOS のドリッパーの中の順番（小さいほど先）。サーバーが決める（途中に入れると後ろを +1 する。抜けた番号は詰めない）
        drip_id:
          type: string
          format: uuid
          nullable: true
          description: CaOS のカードの印。同じ値のカップを 1 枚のカード（1 回のドリップ）で淹れる
        brew_started_at:
          type: string
          format: date-time
          nullable: true
          description: CaOS で抽出を始めた時刻
        brew_finished_at:
          type: string
          format: date-time
          nullable: true
          description: CaOS で抽出を終えた時刻
    # Create用のMenuInfo
    MenuInfoCreate:
      type: object
      required:
        - menu_id
        - assignee
      properties:
        order_menu_id:
          type: string
          format: uuid
          description: 更新時に残す既存明細のID。新規明細では省略する。価格・名称はサーバーが保存する。
        menu_id:
          type: string
          format: uuid
        assignee:
          type: string
          nullable: true
    # レスポンス用（完全な情報）
    OrderResponse:
      type: object
      required:
        - id
        - order_id
        - created_at
        - billing_amount
        - received
        - payment_method
        - menus
        - cups
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: integer
        created_at:
          type: string
          format: date-time
        ready_at:
          type: string
          format: date-time
          nullable: true
        served_at:
          type: string
          format: date-time
          nullable: true
        billing_amount:
          type: integer
        received:
          type: integer
        discount_order_id:
          type: integer
          nullable: true
        discount_order_cups:
          type: integer
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        menus:
          type: array
          items:
            $ref: '#/components/schemas/MenuInfo'
        cups:
          type: array
