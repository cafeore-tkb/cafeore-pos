        submitted_order_id:
          type: string
          format: uuid
          nullable: true
          description: 直前に確定した注文の ID。編集中は null
        updated_at:
          type: string
          format: date-time
    CashierStateUpdateRequest:
      type: object
      required:
        - editting_order
        - submitted_order_id
      properties:
        editting_order:
          type: object
          additionalProperties: true
        submitted_order_id:
          type: string
          format: uuid
          nullable: true
    CaosCupState:
      type: object
      description: カップの今の CaOS の値（OrderCupResponse の同じ名前の列をそのまま。緊急のカップの drip_id は emergency_drip_id）。全部 null なら未割当
      required: [dripper, dripper_position, drip_id, brew_started_at, brew_finished_at]
      properties:
        dripper:
          type: integer
          nullable: true
          minimum: 1
          maximum: 6
        dripper_position:
          type: number
          format: double
          nullable: true
        drip_id:
          type: string
          format: uuid
          nullable: true
        brew_started_at:
          type: string
          format: date-time
          nullable: true
        brew_finished_at:
          type: string
          format: date-time
          nullable: true
    CaosCupAfter:
      type: object
      description: |
        CaOS がカップに書く値。抽出の時刻は送らない（開始・終了の時刻はサーバーの今で付ける）。
        start_brew が true なら抽出を始める（brew_started_at にサーバーの今を入れる）。false なら待機・未割当（brew_started_at・brew_finished_at は null）。
        dripper・dripper_position・drip_id が全部 null で start_brew が false なら未割当
      required: [dripper, dripper_position, drip_id, start_brew]
      properties:
        dripper:
          type: integer
          nullable: true
          minimum: 1
          maximum: 6
        dripper_position:
          type: number
          format: double
          nullable: true
        drip_id:
          type: string
          format: uuid
          nullable: true
        start_brew:
          type: boolean
          description: 抽出を始める（空いているドリッパーに置いてそのまま始める）。時刻はサーバーの今
    CaosCupsWrite:
      type: object
      description: |
        カップの組を before から after にする。before はカップの今の値（注文の応答の値をそのまま送り返す。時刻はミリ秒までで比べる）。
        抽出中・終わりのカップ（brew_started_at のあるカップ）は書けない（終えるのは「次へ」）
      required: [cup_ids, before, after]
      properties:
        cup_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        before:
          $ref: '#/components/schemas/CaosCupState'
        after:
          $ref: '#/components/schemas/CaosCupAfter'
    CaosCupsWriteRequest:
      type: object
      required: [writes]
      properties:
        writes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CaosCupsWrite'
    CaosNextRequest:
      type: object
      required: [drip_id]
      properties:
        drip_id:
          type: string
          format: uuid
          nullable: true
          description: 画面が抽出中と見ているカードの drip_id。抽出中が無いと見ているなら null
    CaosNextResult:
      type: object
      required: [finished_drip_id, started_drip_id]
      properties:
        finished_drip_id:
          type: string
          format: uuid
          nullable: true
          description: 終えたカード。無ければ null
        started_drip_id:
          type: string
          format: uuid
          nullable: true
          description: 始めたカード。待機が無ければ null
    CaosEmergencyRequest:
      type: object
      required: [cup_ids, interrupt]
      properties:
        cup_ids:
          type: array
          minItems: 1
          description: 緊急にするカップ
          items:
            type: string
            format: uuid
        interrupt:
          type: boolean
          description: カップの抽出中のカードを中断する（そのカードのカップを全部緊急にし、ドリッパーの待機の先頭を始める）
    CaosEmergencyResult:
      type: object
      required: [marked_cup_ids, interrupted_drip_ids, started_drip_ids]
      properties:
        marked_cup_ids:
          type: array
          description: 緊急にしたカップ（もう緊急だったカップは含まない）
          items:
            type: string
            format: uuid
        interrupted_drip_ids:
          type: array
          description: 中断した抽出中のカード
          items:
            type: string
            format: uuid
        started_drip_ids:
          type: array
          description: 中断のあとに始めた待機の先頭のカード
          items:
            type: string
            format: uuid
    EmergencyLabelClaim:
      type: object
      required: [claimed, emergency_printed_at]
      properties:
        claimed:
          type: boolean
          description: true なら、このレジが緊急のシールを印刷する
        emergency_printed_at:
          type: string
          format: date-time
          nullable: true
          description: 今の印刷した時刻（claimed が true なら付けた時刻。release に送る）
    EmergencyLabelRelease:
      type: object
      required: [emergency_printed_at]
      properties:
        emergency_printed_at:
          type: string
          format: date-time
          description: claim で付けた時刻
    CaosLane:
      type: object
      description: ドリッパーの今日の担当者。担当者がいなければ name が空で senior は false
      required: [dripper, name, senior, updated_at]
      properties:
        dripper:
          type: integer
          minimum: 1
          maximum: 6
        name:
          type: string
          description: 担当者の名前（前後の空白を落としたもの）。空なら担当者なし
        senior:
          type: boolean
          description: 上級生（限定を淹れられる）か。交代した時点で画面が sohosai-shift の名簿で判定した値
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: 最後に替えた時刻。今日まだ替えていなければ null
    CaosLanes:
      type: object
      description: 今日（日本時間）のドリッパー 1〜6 の担当者。lanes は 6 つ全部を番号の順に持つ
      required: [day, lanes]
      properties:
        day:
          type: string
          description: 日本時間の日付（YYYY-MM-DD）。画面はこの日が今日のときだけ使う
          example: "2026-11-03"
        lanes:
          type: array
          items:
            $ref: '#/components/schemas/CaosLane'
    CaosLaneUpdateRequest:
      type: object
      required: [name, senior]
      properties:
        name:
          type: string
          maxLength: 40
          description: 担当者の名前（前後の空白は落とす）。空なら担当者なし
        senior:
          type: boolean
          description: 上級生（限定を淹れられる）か。画面が sohosai-shift の名簿（seniors）で判定して送る。name が空なら無視して false
    CaosLaneSwapRequest:
      type: object
      required: [first, second]
      properties:
        first:
          type: integer
          minimum: 1
          maximum: 6
        second:
          type: integer
          minimum: 1
          maximum: 6
    CaosUndoCupState:
      type: object
      description: |
        「1つ戻す」で比べる・書き戻すカップの値。CaosCupState にカップの準備完了（ready_at）・提供済み（served_at）・緊急（emergency_at）の時刻を足したもの。
        drip_id は CaosCupState と同じく、緊急のカップでは入れ直しのカード（emergency_drip_id）。
        served_at・emergency_at は比べるだけで書かない（restore の served_at・emergency_at は current と同じにする。緊急を戻すのは今は無い）
      required: [dripper, dripper_position, drip_id, brew_started_at, brew_finished_at, ready_at, served_at, emergency_at]
      properties:
        dripper:
          type: integer
          nullable: true
          minimum: 1
          maximum: 6
        dripper_position:
          type: number
          format: double
          nullable: true
        drip_id:
          type: string
          format: uuid
          nullable: true
        brew_started_at:
          type: string
          format: date-time
          nullable: true
        brew_finished_at:
          type: string
          format: date-time
          nullable: true
        ready_at:
          type: string
          format: date-time
          nullable: true
        served_at:
          type: string
          format: date-time
          nullable: true
        emergency_at:
          type: string
          format: date-time
          nullable: true
    CaosUndoCup:
      type: object
      description: 1 杯の書き戻し。current はその操作で自分が書いた値（サーバーが付けた時刻も含む）、restore はその操作の前の値。今の値が current なら restore にする（時刻はミリ秒までで比べる）
      required: [cup_id, current, restore]
      properties:
        cup_id:
          type: string
          format: uuid
        current:
          $ref: '#/components/schemas/CaosUndoCupState'
        restore:
          $ref: '#/components/schemas/CaosUndoCupState'
    CaosUndoRequest:
      type: object
      required: [cups]
      properties:
        cups:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CaosUndoCup'
    ErrorResponse:
