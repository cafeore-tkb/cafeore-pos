# openapi/openapi.yaml
openapi: 3.1.0
info:
  title: CafeOre POS API
  version: 1.0.0
  description: 珈琲・俺POSシステムのAPI仕様

servers:
  - url: http://localhost:8080
    description: 開発環境

paths:
  /status:
    get:
      summary: サーバーステータス取得
      operationId: getStatus
      tags:
        - system
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/items:
    get:
      summary: アイテム一覧取得
      operationId: getItems
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: '#/components/schemas/ItemResponse'
    post:
      summary: アイテム作成
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
  /api/items/{id}:
    get:
      summary: idからアイテム情報取得
      operationId: getItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
    put:
      summary: アイテム情報更新
      operationId: updateItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
    delete:
      summary: アイテム削除
      operationId: deleteItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
  /api/menus:
    get:
      summary: メニュー一覧取得
      operationId: getMenus
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuResponse'
    post:
      summary: メニュー作成
      operationId: createMenu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuCreateRequest'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
  /api/menus/{id}:
    get:
      summary: メニュー取得
      operationId: getMenu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
    put:
      summary: メニュー更新
      operationId: updateMenu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
    delete:
      summary: メニュー削除
      operationId: deleteMenu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
  /api/item-types:
    get:
      summary: アイテムタイプ一覧取得
      operationId: getItemTypes
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: '#/components/schemas/ItemTypeResponse'
    post:
      summary: アイテムタイプ作成
      operationId: createItemType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemTypeCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemTypeResponse'
  /api/item-types/{id}:
    get:
      summary: idからアイテムタイプ情報取得
      operationId: getItemType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemTypeResponse'
    put:
      summary: アイテム情報更新
      operationId: updateItemType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemTypeUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemTypeResponse'
    delete:
      summary: アイテムタイプ削除
      operationId: deleteItemType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
  /api/color-settings:
    get:
      summary: 背景色設定一覧取得
      operationId: getColorSettings
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColorSettingResponse'
    put:
      summary: 背景色設定の作成・更新
      description: 対象（target_type, target_id）と画面（screen）の組が既にあれば色を上書きし、無ければ作成する
      operationId: upsertColorSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColorSettingUpsertRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColorSettingResponse'
        '400':
          description: リクエストが不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/color-settings/{id}:
    delete:
      summary: 背景色設定削除
      operationId: deleteColorSetting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
        '404':
          description: 背景色設定が見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders:
    get:
      summary: オーダー一覧取得
      operationId: getOrders
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: '#/components/schemas/OrderResponse'
    post:
      summary: オーダー作成
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /api/orders/{id}:
    get:
      summary: idからオーダー情報取得
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
    put:
      summary: オーダー情報更新
      operationId: updateOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
    delete:
      summary: オーダー削除
      operationId: deleteOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
  /api/orders/{id}/ready:
    patch:
      summary: オーダーを準備完了にする
      operationId: markOrderReady
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '404':
          description: オーダーが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/served:
    patch:
      summary: オーダーを提供完了にする
      operationId: markOrderServe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '404':
          description: オーダーが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/cups/{cupId}/ready:
    patch:
      summary: カップを準備完了にする
      description: 1杯ずつ準備完了と未準備を切り替える。全カップが準備完了になると注文も準備完了になり、外すと注文の準備完了も外れる。
      operationId: markOrderCupReady
      parameters:
        - name: id
          in: path
          required: true
          description: オーダーID
          schema:
            type: string
            format: uuid
        - name: cupId
          in: path
          required: true
          description: カップID（OrderResponse.cups[].id）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: IDの形式が不正です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: オーダーまたはカップが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/cups/{cupId}/served:
    patch:
      summary: カップを提供完了にする
      description: 1杯ずつ提供済みと未提供を切り替える。全カップが提供済みになると注文も提供済みになり、外すと注文の提供済みも外れる。
      operationId: markOrderCupServe
      parameters:
        - name: id
          in: path
          required: true
          description: オーダーID
          schema:
            type: string
            format: uuid
        - name: cupId
          in: path
          required: true
          description: カップID（OrderResponse.cups[].id）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: IDの形式が不正です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: オーダーまたはカップが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/comments:
    get:
      summary: 特定オーダーのコメント一覧取得
      operationId: getOrderComments
      tags:
        - comments
      parameters:
        - name: id
          in: path
          required: true
          description: オーダーID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentResponse'
        '404':
          description: オーダーが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: オーダーにコメント追加
      operationId: createOrderComment
      tags:
        - comments
      parameters:
        - name: id
          in: path
          required: true
          description: オーダーID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '404':
          description: オーダーが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/caos/ops:
    post:
      summary: CaOS の今日の盤面への操作
      description: |
        割当・未割当に戻す・次へ・統合・1つ戻すのどれか 1 つ（name で選ぶ）。1 つの盤面への操作は、その日の advisory lock で 1 件ずつ順番に処理する。
        盤面はカップ中心：カードの中身はカップ（order_cups の drip_id）が持ち、未割当のカードは保存せずカップから組み立てる。
        「次へ」は、そのカードのカップだけを準備完了にする（POS のカップの準備完了と同じ処理。注文の準備完了はカップから決まる）。
        「1つ戻す」（undo）は、操作の結果の op_id を指定する。サーバーが残した操作の記録で戻し、記録のあとカードやカップが変わっていたら 422 で断る。
        盤面は /api/ws/orders の {"type":"drips","drips":[CaosCard]} で全部の画面に配る（操作のたびと、注文が変わったとき）。
      operationId: applyCaosOp
      tags:
        - caos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaosOp'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaosOpResult'
        '400':
          description: 形の違うリクエスト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 同時に変わった注文と重なり、何度か試しても通らなかった（何も変えない）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: ルールに合わない操作（何も変えない）。error を画面にそのまま出す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/master-status:
    get:
      summary: マスターステート取得
      operationId: getMasterState
      tags:
        - system
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MasterStateResponse'
    post: 
      summary: マスターステート更新
      operationId: updateMasterState
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterStateUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterStateResponse'

  /api/inventory:
    get:
      summary: 在庫の残量一覧
      description: 最後の棚卸しからの入荷・注文での消費を差し引いた推定残量。
      operationId: getInventory
      tags:
        - inventory
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryStatus'
  /api/inventory/resources:
    post:
      summary: 在庫対象の作成
      operationId: createStockResource
      tags:
        - inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockResourceRequest'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResourceResponse'
  /api/inventory/resources/{id}:
    put:
      summary: 在庫対象の更新
      operationId: updateStockResource
      tags:
        - inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockResourceRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResourceResponse'
    delete:
      summary: 在庫対象の削除
      operationId: deleteStockResource
      tags:
        - inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
  /api/inventory/resources/{id}/events:
    post:
      summary: 棚卸し・入荷・調整の記録
      description: count は実数で残量を置き換える（0 以上）。receipt は入荷として正の数を足す。adjust は差分として足す（減らすときは負の値、0 は不可）。
      operationId: createStockEvent
      tags:
        - inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockEventCreateRequest'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockEventCreateResponse'
  /api/inventory/usages:
    get:
      summary: アイテム1杯あたりの使用量一覧
      operationId: getStockUsages
      tags:
        - inventory
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockUsage'
    put:
      summary: アイテム1杯あたりの使用量をまとめて置き換える
      operationId: replaceStockUsages
      tags:
        - inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/StockUsage'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockUsage'
  /api/inventory/remind:
    post:
      summary: 残量確認のリマインドを Slack に送る
      description: |
        スケジューラから定期的に叩く。次のどちらかを満たさないと 401。
          - Authorization: Bearer の Google ID トークン（INVENTORY_REMIND_INVOKER の SA が audience INVENTORY_REMIND_AUDIENCE で発行したもの）。本番の Cloud Scheduler はこちら
          - X-Cron-Secret ヘッダーが INVENTORY_CRON_SECRET と一致する。ローカルや手動実行用
        （ヘッダーをパラメータやセキュリティスキームとして書くと、生成される api_gin.go が models の型を参照できずビルドが通らないので説明だけに留める）
        直近に注文が無い（営業していない）ときは送らない。
      operationId: remindInventory
      tags:
        - inventory
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryRemindResponse'
        '401':
          description: ID トークンも合言葉も合わない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cashier-state:
    get:
      summary: レジ状態取得
      description: レジが編集中の注文と直前に確定した注文の ID。まだ一度も同期されていなければ 404。
      operationId: getCashierState
      tags:
        - system
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierStateResponse'
        '404':
          description: まだレジ状態が無い
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: レジ状態更新
      description: 単一のレジ状態を丸ごと置き換える。成功すると WebSocket で全クライアントへ配信される。
      operationId: updateCashierState
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashierStateUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierStateResponse'
        '400':
          description: editting_order に必須のキーが無い、または型が違う
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    StatusResponse:
      type: object
      required:
        - status
        - timestamp
        - version
        - database
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: 1.0.0
        database:
          type: string
          example: connected
    ItemResponse:
      type: object
      required:
        - id
        - name
        - abbr
        - item_type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        item_type:
          $ref: '#/components/schemas/ItemTypeResponse'
    # 作成リクエスト用（IDや自動生成フィールドを除外）
