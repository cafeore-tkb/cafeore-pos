          type: integer
        ready_at:
          type: string
          format: date-time
          nullable: true
        served_at:
          type: string
          format: date-time
          nullable: true
        billing_amount:
          type: integer
        received:
          type: integer
        discount_order_id:
          type: integer
          nullable: true
        discount_order_cups:
          type: integer
        menu_ids:
          type: array
          items:
            $ref: '#/components/schemas/MenuInfoCreate'

    # 一覧取得用（軽量版、関連データを含まない場合）
    OrderListItem:
      type: object
      required:
        - id
        - order_id
        - created_at
        - billing_amount
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: integer
        created_at:
          type: string
          format: date-time
        ready_at:
          type: string
          format: date-time
          nullable: true
        served_at:
          type: string
          format: date-time
          nullable: true
        billing_amount:
          type: integer
        received:
          type: integer
        discount_order_cups:
          type: integer

    # コメント作成用
    CommentCreateRequest:
      type: object
      required:
        - author
        - text
      properties:
        author:
          type: string
        text:
          type: string

    CommentResponse:
      type: object
      required:
        - order_id
        - author
        - text
        - created_at
      properties:
        order_id:
          type: string
          format: uuid
        author:
          type: string
        text:
          type: string
        created_at:
          type: string
          format: date-time
    MasterStateResponse:
      type: object
      required:
        - created_at
        - type
      properties:
        created_at:
          type: string
          format: date-time
        type:
          type: string
    MasterStateUpdateRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
    ColorTargetType:
      type: string
      description: 背景色を設定する対象の種類
      enum:
        - Item
        - ItemType
      # 既定の定数名（Item, ItemType）は DB モデルの構造体名と衝突するため明示する
      x-enum-varnames:
        - ColorTargetTypeItem
        - ColorTargetTypeItemType
    ColorScreen:
      type: string
      description: |
        背景色を適用する画面。
        cashier はレジのメニューのボタン、cashier_order はレジの過去の注文のカード、
        master・serve はマスター・提供画面のカップ
      enum:
        - cashier
        - cashier_order
        - master
        - serve
      x-enum-varnames:
        - ColorScreenCashier
        - ColorScreenCashierOrder
        - ColorScreenMaster
        - ColorScreenServe
    ColorSettingResponse:
      type: object
      required:
        - id
        - target_type
        - target_id
        - screen
        - color
      properties:
        id:
          type: string
          format: uuid
        target_type:
          $ref: '#/components/schemas/ColorTargetType'
        target_id:
          type: string
          format: uuid
          description: Item または ItemType の ID
        screen:
          $ref: '#/components/schemas/ColorScreen'
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          example: "#bfdbfe"
    ColorSettingUpsertRequest:
      type: object
      required:
        - target_type
        - target_id
        - screen
        - color
      properties:
        target_type:
          $ref: '#/components/schemas/ColorTargetType'
        target_id:
          type: string
          format: uuid
          description: Item または ItemType の ID
        screen:
          $ref: '#/components/schemas/ColorScreen'
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          example: "#bfdbfe"
    CashierStateResponse:
      type: object
      required:
        - editting_order
        - submitted_order_id
        - updated_at
      properties:
        editting_order:
          type: object
          additionalProperties: true
          description: レジで編集中の注文。フロントの orderSchema の JSON をそのまま保持し、サーバーは上の階層のキーと型を確かめる以外は中身を解釈しない
        submitted_order_id:
          type: string
          format: uuid
          nullable: true
          description: 直前に確定した注文の ID。編集中は null
        updated_at:
          type: string
          format: date-time
    CashierStateUpdateRequest:
      type: object
      required:
        - editting_order
        - submitted_order_id
      properties:
        editting_order:
          type: object
          additionalProperties: true
        submitted_order_id:
          type: string
          format: uuid
          nullable: true
    CaosCupState:
      type: object
      description: カップの今の CaOS の値（OrderCupResponse の同じ名前の列をそのまま）。全部 null なら未割当
      required: [dripper, dripper_position, drip_id, brew_started_at, brew_finished_at]
      properties:
        dripper:
          type: integer
          nullable: true
          minimum: 1
          maximum: 6
        dripper_position:
          type: integer
          nullable: true
        drip_id:
          type: string
          format: uuid
          nullable: true
        brew_started_at:
          type: string
          format: date-time
          nullable: true
        brew_finished_at:
          type: string
          format: date-time
          nullable: true
    CaosCupAfter:
      type: object
      description: |
        CaOS がカップに書く値。順番の数と抽出の時刻は送らない（順番はサーバーが insert_before から決め、開始・終了の時刻はサーバーの今で付ける）。
        start_brew が true なら抽出を始める（brew_started_at にサーバーの今を入れる）。false なら待機・未割当（brew_started_at・brew_finished_at は null）。
        dripper・drip_id・insert_before が全部 null で start_brew が false なら未割当。dripper が null で drip_id があれば、統合した未割当（同じ drip_id のカップと 1 枚のカード）
      required: [dripper, drip_id, insert_before, start_brew]
      properties:
        dripper:
          type: integer
          nullable: true
          minimum: 1
          maximum: 6
        drip_id:
          type: string
          format: uuid
          nullable: true
        insert_before:
          type: string
          format: uuid
          nullable: true
          description: |
            dripper の待機の、どのカード（drip_id）の前に入れるか。null なら最後。先頭に割り込むときは先頭のカードの drip_id。
            dripper が null（未割当）のときと、ほかのカップのカードに入る（統合）ときは null
        start_brew:
          type: boolean
          description: 抽出を始める（空いているドリッパーに置いてそのまま始める）。時刻はサーバーの今
    CaosCupsWrite:
      type: object
      description: |
        カップの組を before から after にする。before はカップの今の値（注文の応答の値をそのまま送り返す。時刻はミリ秒までで比べる）。
        抽出中・終わりのカップ（brew_started_at のあるカップ）は書けない（終えるのは「次へ」）
      required: [cup_ids, before, after]
      properties:
        cup_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        before:
          $ref: '#/components/schemas/CaosCupState'
        after:
          $ref: '#/components/schemas/CaosCupAfter'
    CaosCupsWriteRequest:
      type: object
      required: [writes]
      properties:
        writes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CaosCupsWrite'
    CaosNextRequest:
      type: object
      required: [drip_id]
      properties:
        drip_id:
          type: string
          format: uuid
          nullable: true
          description: 画面が抽出中と見ているカードの drip_id。抽出中が無いと見ているなら null
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Invalid order ID format"
    StockResourceKind:
      type: string
      enum: [cup, bean]
      x-enum-varnames: [StockResourceKindCup, StockResourceKindBean]
    StockResourceRequest:
      type: object
      required:
        - kind
        - name
        - unit
        - per_serving
        - notify_from
        - notify_step
        - buffer
      properties:
        kind:
          $ref: '#/components/schemas/StockResourceKind'
        name:
          type: string
          example: ホットカップ
        unit:
          type: string
          description: 数える単位（個 / g）
          example: 個
        per_serving:
          type: number
          format: double
          description: 1杯あたりの量。残量を杯数に換算するのに使う（カップ 1、豆 15）
          example: 1
        notify_from:
          type: integer
          description: 残りがこの杯数を切ったら通知を始める
          example: 500
        notify_step:
          type: integer
          description: notify_from から何杯減るごとに通知するか
          example: 100
        buffer:
          type: integer
          description: 最低限残したい杯数。これを切ると危険扱い
          example: 100
    StockResourceResponse:
      allOf:
        - $ref: '#/components/schemas/StockResourceRequest'
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
    InventoryLevel:
      type: string
      description: untracked は棚卸し・入荷がまだ一度も無い
      enum: [ok, warning, critical, untracked]
      x-enum-varnames: [InventoryLevelOk, InventoryLevelWarning, InventoryLevelCritical, InventoryLevelUntracked]
    InventoryStatus:
      type: object
      required:
