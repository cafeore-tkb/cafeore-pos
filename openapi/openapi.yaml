# openapi/openapi.yaml
openapi: 3.1.0
info:
  title: CafeOre POS API
  version: 1.0.0
  description: 珈琲・俺POSシステムのAPI仕様

servers:
  - url: http://localhost:8080
    description: 開発環境

paths:
  /status:
    get:
      summary: サーバーステータス取得
      operationId: getStatus
      tags:
        - system
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/items:
    get:
      summary: アイテム一覧取得
      operationId: getItems
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: '#/components/schemas/ItemResponse'
    post:
      summary: アイテム作成
      description: そのアイテムの在庫（在庫対象。単位「個」・1 回 1）も同じトランザクションで作る。量や通知の段階は PUT /api/inventory/resources/{id} で変える。
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
  /api/items/{id}:
    get:
      summary: idからアイテム情報取得
      operationId: getItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
    put:
      summary: アイテム情報更新
      operationId: updateItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
    delete:
      summary: アイテム削除
      description: そのアイテムの在庫も同じトランザクションで論理削除する。
      operationId: deleteItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
  /api/menus:
    get:
      summary: メニュー一覧取得
      operationId: getMenus
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuResponse'
    post:
      summary: メニュー作成
      operationId: createMenu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuCreateRequest'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
  /api/menus/{id}:
    get:
      summary: メニュー取得
      operationId: getMenu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
    put:
      summary: メニュー更新
      operationId: updateMenu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
    delete:
      summary: メニュー削除
      operationId: deleteMenu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
  /api/item-types:
    get:
      summary: アイテムタイプ一覧取得
      operationId: getItemTypes
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: '#/components/schemas/ItemTypeResponse'
    post:
      summary: アイテムタイプ作成
      operationId: createItemType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemTypeCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemTypeResponse'
  /api/item-types/{id}:
    get:
      summary: idからアイテムタイプ情報取得
      operationId: getItemType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemTypeResponse'
    put:
      summary: アイテム情報更新
      operationId: updateItemType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemTypeUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemTypeResponse'
    delete:
      summary: アイテムタイプ削除
      operationId: deleteItemType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
  /api/color-settings:
    get:
      summary: 背景色設定一覧取得
      operationId: getColorSettings
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColorSettingResponse'
    put:
      summary: 背景色設定の作成・更新
      description: 対象（target_type, target_id）と画面（screen）の組が既にあれば色を上書きし、無ければ作成する
      operationId: upsertColorSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColorSettingUpsertRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColorSettingResponse'
        '400':
          description: リクエストが不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/color-settings/{id}:
    delete:
      summary: 背景色設定削除
      operationId: deleteColorSetting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
        '404':
          description: 背景色設定が見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders:
    get:
      summary: オーダー一覧取得
      operationId: getOrders
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: '#/components/schemas/OrderResponse'
    post:
      summary: オーダー作成
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /api/orders/{id}:
    get:
      summary: idからオーダー情報取得
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
    put:
      summary: オーダー情報更新
      operationId: updateOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
    delete:
      summary: オーダー削除
      operationId: deleteOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
  /api/orders/{id}/ready:
    patch:
      summary: オーダーを準備完了にする
      operationId: markOrderReady
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '404':
          description: オーダーが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/served:
    patch:
      summary: オーダーを提供完了にする
      operationId: markOrderServe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '404':
          description: オーダーが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/cups/{cupId}/ready:
    patch:
      summary: カップを準備完了にする
      description: 1杯ずつ準備完了と未準備を切り替える。全カップが準備完了になると注文も準備完了になり、外すと注文の準備完了も外れる。
      operationId: markOrderCupReady
      parameters:
        - name: id
          in: path
          required: true
          description: オーダーID
          schema:
            type: string
            format: uuid
        - name: cupId
          in: path
          required: true
          description: カップID（OrderResponse.cups[].id）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: IDの形式が不正です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: オーダーまたはカップが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/cups/{cupId}/served:
    patch:
      summary: カップを提供完了にする
      description: 1杯ずつ提供済みと未提供を切り替える。全カップが提供済みになると注文も提供済みになり、外すと注文の提供済みも外れる。
      operationId: markOrderCupServe
      parameters:
        - name: id
          in: path
          required: true
          description: オーダーID
          schema:
            type: string
            format: uuid
        - name: cupId
          in: path
          required: true
          description: カップID（OrderResponse.cups[].id）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: IDの形式が不正です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: オーダーまたはカップが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/comments:
    get:
      summary: 特定オーダーのコメント一覧取得
      operationId: getOrderComments
      tags:
        - comments
      parameters:
        - name: id
          in: path
          required: true
          description: オーダーID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentResponse'
        '404':
          description: オーダーが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: オーダーにコメント追加
      operationId: createOrderComment
      tags:
        - comments
      parameters:
        - name: id
          in: path
          required: true
          description: オーダーID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '404':
          description: オーダーが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/master-status:
    get:
      summary: マスターステート取得
      operationId: getMasterState
      tags:
        - system
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MasterStateResponse'
    post: 
      summary: マスターステート更新
      operationId: updateMasterState
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterStateUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterStateResponse'

  /api/inventory:
    get:
      summary: 在庫の残量一覧
      description: 最後の棚卸しからの入荷・注文での消費を差し引いた推定残量。注文での消費は、注文を受けたときに残した量（その時点の per_serving とカップの種類で決めたもの）で数える。
      operationId: getInventory
      tags:
        - inventory
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryStatus'
  /api/inventory/resources:
    post:
      summary: カップの作成
      description: 作れるのはカップだけ。アイテムの在庫はアイテムと一緒に作る（POST /api/items）。
      operationId: createStockResource
      tags:
        - inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockResourceRequest'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResourceResponse'
        '400':
          description: 名前が空、または item_type_ids の種類が無い・重複
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/inventory/resources/{id}:
    put:
      summary: 在庫対象の更新
      description: アイテムの在庫は量・単位・通知の段階だけ変えられる。name・item_type_ids を送ると 400（名前を変えるときはアイテムの名前を変える。PUT /api/items/{id}）。
      operationId: updateStockResource
      tags:
        - inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockResourceRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResourceResponse'
        '400':
          description: 値が正しくない。アイテムの在庫に name・item_type_ids を送った
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: カップの削除
      description: 消せるのはカップだけ。アイテムの在庫はアイテムを消すと一緒に消える（DELETE /api/items/{id}）。
      operationId: deleteStockResource
      tags:
        - inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
        '400':
          description: アイテムの在庫は消せない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/inventory/resources/{id}/events:
    post:
      summary: 棚卸し・入荷・調整の記録
      description: count は実数で残量を置き換える（0 以上）。receipt は入荷として正の数を足す。adjust は差分として足す（減らすときは負の値、0 は不可）。
      operationId: createStockEvent
      tags:
        - inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockEventCreateRequest'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockEventCreateResponse'
  /api/inventory/remind:
    post:
      summary: 残量確認のリマインドを Slack に送る
      description: |
        スケジューラから定期的に叩く。次のどちらかを満たさないと 401。
          - Authorization: Bearer の Google ID トークン（INVENTORY_REMIND_INVOKER の SA が audience INVENTORY_REMIND_AUDIENCE で発行したもの）。本番の Cloud Scheduler はこちら
          - X-Cron-Secret ヘッダーが INVENTORY_CRON_SECRET と一致する。ローカルや手動実行用
        （ヘッダーをパラメータやセキュリティスキームとして書くと、生成される api_gin.go が models の型を参照できずビルドが通らないので説明だけに留める）
        直近に注文が無い（営業していない）ときは送らない。
      operationId: remindInventory
      tags:
        - inventory
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryRemindResponse'
        '401':
          description: ID トークンも合言葉も合わない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cashier-state:
    get:
      summary: レジ状態取得
      description: レジが編集中の注文と直前に確定した注文の ID。まだ一度も同期されていなければ 404。
      operationId: getCashierState
      tags:
        - system
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierStateResponse'
        '404':
          description: まだレジ状態が無い
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: レジ状態更新
      description: 単一のレジ状態を丸ごと置き換える。成功すると WebSocket で全クライアントへ配信される。
      operationId: updateCashierState
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashierStateUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierStateResponse'
        '400':
          description: editting_order に必須のキーが無い、または型が違う
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/square/status:
    get:
      summary: Square 連携が使えるか
      description: |
        SQUARE_ACCESS_TOKEN があれば enabled。フロントはこれを見て Square の決済ボタンと端末の選択を出す。
        決済に使う端末は GET /api/square/devices で取る（ペアリング済みの端末が無ければ決済できない）。
      operationId: getSquareStatus
      tags:
        - square
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareStatusResponse'
  /api/square/devices:
    get:
      summary: Square 端末の一覧
      description: |
        登録した端末と、ペアリング待ちのコード。古い順。
        ペアリング待ち（UNPAIRED）の行は、Square に問い合わせて最新にしてから返す。
        レジは status が PAIRED の行から、そのレジで使う端末を選ぶ。
      operationId: getSquareDevices
      tags:
        - square
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SquareDeviceResponse'
    post:
      summary: device_id を直接登録する
      description: |
        ペアリングせずに、分かっている device_id をそのまま登録する。Sandbox では実機と
        ペアリングできないので、Square が用意しているテスト用の device_id を登録するのに使う。
      operationId: createSquareDevice
      tags:
        - square
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SquareDeviceCreateRequest'
      responses:
        '201':
          description: 登録した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareDeviceResponse'
        '400':
          description: 入力が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: その device_id は登録済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/devices/pair:
    post:
      summary: 端末をペアリングするコード（Device Code）を発行する
      description: |
        返ってきた code を端末のサインイン画面（「デバイスコードでサインイン」）に入力すると、
        GET /api/square/devices で status が PAIRED になり、device_id が入る。
        Square のダッシュボードで発行したコードではペアリングできない（API で発行したコードが必要）。
      operationId: pairSquareDevice
      tags:
        - square
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SquareDevicePairRequest'
      responses:
        '201':
          description: 発行した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareDeviceResponse'
        '400':
          description: 入力が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Square がコードを発行しなかった
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Square 連携が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/devices/import:
    post:
      summary: Square でペアリング済みの端末を取り込む
      description: |
        API で発行したコードのうち PAIRED のものを Square から取り、まだ登録していない端末を登録する。
        管理画面を作る前にペアリングした端末や、一覧から外した端末を戻すのに使う。
        同じ端末に複数のコードがあるときは、最後にペアリングしたコードの名前を使う。
        取り込んだ端末だけを返す（既に登録していた端末は含めない）。
      operationId: importSquareDevices
      tags:
        - square
      responses:
        '200':
          description: 取り込んだ端末
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SquareDeviceResponse'
        '502':
          description: Square から一覧を取れなかった
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Square 連携が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/devices/{id}:
    delete:
      summary: 端末を一覧から外す
      description: |
        レジで選べなくなるだけで、端末は Square にサインインしたまま（API ではペアリングを解除できない）。
        外した端末は POST /api/square/devices/import で戻せる。
      operationId: deleteSquareDevice
      tags:
        - square
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 外した
        '404':
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/checkouts:
    post:
      summary: Square Terminal に決済画面を出す
      description: |
        決済が先・注文が後の順で使う。完了したら、返ってきた id を square_checkout_id に入れて POST /api/orders する。
        同じ idempotency_key で再送したときは、新しく作らずに同じ決済依頼を返す。
        同じ端末で別の決済依頼が進行中なら 409 を返し、進行中のものを checkout に入れる。
        別の端末で進行中の決済依頼があっても出せる。
      operationId: createSquareCheckout
      tags:
        - square
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SquareCheckoutCreateRequest'
      responses:
        '201':
          description: 作成した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '200':
          description: 同じ idempotency_key の決済依頼が既にある
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '400':
          description: 入力が不正、または device_id がペアリング済みの端末として登録されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 同じ端末で別の決済依頼が進行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutConflictResponse'
        '502':
          description: Square が依頼を受け付けなかった
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '503':
          description: Square 連携が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/checkouts/unlinked:
    get:
      summary: 支払い済みなのに注文と結び付いていない決済依頼
      description: 決済中にレジが落ちた・注文の送信に失敗したなどで、お金だけ受け取った状態のものを照合するために使う。新しい順。
      operationId: getUnlinkedSquareCheckouts
      tags:
        - square
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SquareCheckoutResponse'
  /api/square/checkouts/{id}:
    get:
      summary: 決済依頼の状態を取る
      description: 未確定なら Square に問い合わせて最新にしてから返す。レジはこれを数秒おきに呼んで完了を待つ。
      operationId: getSquareCheckout
      tags:
        - square
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '404':
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/square/checkouts/{id}/cancel:
    post:
      summary: 決済依頼を取り消す
      description: PENDING / IN_PROGRESS のときだけ取り消せる。電子マネーで端末にエラーが出ているときは API から取り消せないので、端末側で取り消す。
      operationId: cancelSquareCheckout
      tags:
        - square
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 取り消しを依頼した（IN_PROGRESS だったときは CANCEL_REQUESTED を経て CANCELED になる）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutResponse'
        '404':
          description: 見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Square が取り消しを受け付けなかった（既に完了しているなど）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquareCheckoutConflictResponse'
  /api/square/webhook:
    post:
      summary: Square からの Webhook（terminal.checkout.created / terminal.checkout.updated）
      description: |
        x-square-hmacsha256-signature ヘッダーの署名が合わなければ 403。
        （ヘッダーをパラメータとして書くと、生成される api_gin.go が models の型を参照できずビルドが通らないので説明だけに留める）
      operationId: receiveSquareWebhook
      tags:
        - square
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 受け取った
        '403':
          description: 署名が合わない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Webhook の署名鍵が設定されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    StatusResponse:
      type: object
      required:
        - status
        - timestamp
        - version
        - database
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: 1.0.0
        database:
          type: string
          example: connected
    ItemResponse:
      type: object
      required:
        - id
        - name
        - abbr
        - item_type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        item_type:
          $ref: '#/components/schemas/ItemTypeResponse'
    # 作成リクエスト用（IDや自動生成フィールドを除外）
    ItemCreateRequest:
      type: object
      required:
        - name
        - abbr
        - item_type_id
      properties:
        name:
          type: string
        abbr:
          type: string
        item_type_id:
          type: string
          format: uuid
    # 更新リクエスト用
    ItemUpdateRequest:
      type: object
      required:
        - id
        - name
        - abbr
        - item_type_id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        item_type_id:
          type: string
          format: uuid
    MenuItemResponse:
      type: object
      required:
        - item
        - quantity
      properties:
        item:
          $ref: '#/components/schemas/ItemResponse'
        quantity:
          type: integer
          minimum: 1
    MenuItemRequest:
      type: object
      required:
        - item_id
        - quantity
      properties:
        item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    MenuResponse:
      type: object
      required:
        - id
        - name
        - abbr
        - price
        - key
        - items
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        price:
          type: integer
        key:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItemResponse'
    MenuCreateRequest:
      type: object
      required:
        - name
        - abbr
        - price
        - key
        - items
      properties:
        name:
          type: string
        abbr:
          type: string
        price:
          type: integer
          minimum: 0
        key:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MenuItemRequest'
    MenuUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/MenuCreateRequest'
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
    ItemTypeResponse:
      type: object
      required:
        - id
        - name
        - display_name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
    ItemTypeCreateRequest:
      type: object
      required:
        - name
        - display_name
      properties:
        name:
          type: string
        display_name:
          type: string
    # 更新リクエスト用
    ItemTypeUpdateRequest:
      type: object
      required:
        - id
        - name
        - display_name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
    # 指名を入れたMenu
    MenuInfo:
      type: object
      required:
        - id
        - menu_name
        - unit_price
        - menu
        - assignee
      properties:
        id:
          type: string
          format: uuid
          description: 注文明細ID
        menu_name:
          type: string
          description: 注文時点のメニュー名
        unit_price:
          type: integer
          description: 注文時点のメニュー価格
        menu:
          $ref: '#/components/schemas/MenuResponse'
        assignee:
          type: string
          nullable: true
    # 注文の1杯。注文明細（メニュー）の構成品を数量分に展開したもの（グッズは含まない）
    OrderCupResponse:
      type: object
      required:
        - id
        - order_menu_id
        - item
        - ready_at
        - served_at
      properties:
        id:
          type: string
          format: uuid
        order_menu_id:
          type: string
          format: uuid
          description: このカップを含む注文明細のID（MenuInfo.id）
        item:
          $ref: '#/components/schemas/ItemResponse'
        ready_at:
          type: string
          format: date-time
          nullable: true
          description: このカップが準備完了になった時刻。未準備なら null
        served_at:
          type: string
          format: date-time
          nullable: true
          description: このカップを提供した時刻。未提供なら null
    # Create用のMenuInfo
    MenuInfoCreate:
      type: object
      required:
        - menu_id
        - assignee
      properties:
        order_menu_id:
          type: string
          format: uuid
          description: 更新時に残す既存明細のID。新規明細では省略する。価格・名称はサーバーが保存する。
        menu_id:
          type: string
          format: uuid
        assignee:
          type: string
          nullable: true
    # レスポンス用（完全な情報）
    OrderResponse:
      type: object
      required:
        - id
        - order_id
        - created_at
        - billing_amount
        - received
        - payment_method
        - menus
        - cups
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: integer
        created_at:
          type: string
          format: date-time
        ready_at:
          type: string
          format: date-time
          nullable: true
        served_at:
          type: string
          format: date-time
          nullable: true
        billing_amount:
          type: integer
        received:
          type: integer
        discount_order_id:
          type: integer
          nullable: true
        discount_order_cups:
          type: integer
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        menus:
          type: array
          items:
            $ref: '#/components/schemas/MenuInfo'
        cups:
          type: array
          description: 注文のカップ（1杯ずつ）。注文した順に並ぶ。グッズだけの注文では空
          items:
            $ref: '#/components/schemas/OrderCupResponse'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentResponse'

    # 作成リクエスト用（IDや自動生成フィールドを除外）
    OrderCreateRequest:
      type: object
      required:
        - order_id
        - billing_amount
        - received
        - menu_ids
      properties:
        order_id:
          type: integer
          example: 1
        billing_amount:
          type: integer
          example: 500
        received:
          type: integer
          example: 500
          default: 0
        discount_order_id:
          type: integer
          nullable: true
        discount_order_cups:
          type: integer
          default: 0
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        square_checkout_id:
          type: string
          format: uuid
          nullable: true
          description: payment_method が square のとき必須。COMPLETED で金額が billing_amount と一致し、まだどの注文にも使われていない決済依頼の id。
        menu_ids:
          type: array
          items:
            $ref: '#/components/schemas/MenuInfoCreate'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentCreateRequest'

    # 更新リクエスト用
    OrderUpdateRequest:
      type: object
      required:
        - id
        - order_id
        - billing_amount
        - received
        - menu_ids
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: integer
        ready_at:
          type: string
          format: date-time
          nullable: true
        served_at:
          type: string
          format: date-time
          nullable: true
        billing_amount:
          type: integer
        received:
          type: integer
        discount_order_id:
          type: integer
          nullable: true
        discount_order_cups:
          type: integer
        menu_ids:
          type: array
          items:
            $ref: '#/components/schemas/MenuInfoCreate'

    # 一覧取得用（軽量版、関連データを含まない場合）
    OrderListItem:
      type: object
      required:
        - id
        - order_id
        - created_at
        - billing_amount
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: integer
        created_at:
          type: string
          format: date-time
        ready_at:
          type: string
          format: date-time
          nullable: true
        served_at:
          type: string
          format: date-time
          nullable: true
        billing_amount:
          type: integer
        received:
          type: integer
        discount_order_cups:
          type: integer

    # コメント作成用
    CommentCreateRequest:
      type: object
      required:
        - author
        - text
      properties:
        author:
          type: string
        text:
          type: string

    CommentResponse:
      type: object
      required:
        - order_id
        - author
        - text
        - created_at
      properties:
        order_id:
          type: string
          format: uuid
        author:
          type: string
        text:
          type: string
        created_at:
          type: string
          format: date-time
    MasterStateResponse:
      type: object
      required:
        - created_at
        - type
      properties:
        created_at:
          type: string
          format: date-time
        type:
          type: string
    MasterStateUpdateRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
    ColorTargetType:
      type: string
      description: 背景色を設定する対象の種類
      enum:
        - Item
        - ItemType
      # 既定の定数名（Item, ItemType）は DB モデルの構造体名と衝突するため明示する
      x-enum-varnames:
        - ColorTargetTypeItem
        - ColorTargetTypeItemType
    ColorScreen:
      type: string
      description: |
        背景色を適用する画面。
        cashier はレジのメニューのボタン、cashier_order はレジの過去の注文のカード、
        master・serve はマスター・提供画面のカップ
      enum:
        - cashier
        - cashier_order
        - master
        - serve
      x-enum-varnames:
        - ColorScreenCashier
        - ColorScreenCashierOrder
        - ColorScreenMaster
        - ColorScreenServe
    ColorSettingResponse:
      type: object
      required:
        - id
        - target_type
        - target_id
        - screen
        - color
      properties:
        id:
          type: string
          format: uuid
        target_type:
          $ref: '#/components/schemas/ColorTargetType'
        target_id:
          type: string
          format: uuid
          description: Item または ItemType の ID
        screen:
          $ref: '#/components/schemas/ColorScreen'
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          example: "#bfdbfe"
    ColorSettingUpsertRequest:
      type: object
      required:
        - target_type
        - target_id
        - screen
        - color
      properties:
        target_type:
          $ref: '#/components/schemas/ColorTargetType'
        target_id:
          type: string
          format: uuid
          description: Item または ItemType の ID
        screen:
          $ref: '#/components/schemas/ColorScreen'
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          example: "#bfdbfe"
    CashierStateResponse:
      type: object
      required:
        - editting_order
        - submitted_order_id
        - updated_at
      properties:
        editting_order:
          type: object
          additionalProperties: true
          description: レジで編集中の注文。フロントの orderSchema の JSON をそのまま保持し、サーバーは上の階層のキーと型を確かめる以外は中身を解釈しない
        submitted_order_id:
          type: string
          format: uuid
          nullable: true
          description: 直前に確定した注文の ID。編集中は null
        updated_at:
          type: string
          format: date-time
    CashierStateUpdateRequest:
      type: object
      required:
        - editting_order
        - submitted_order_id
      properties:
        editting_order:
          type: object
          additionalProperties: true
        submitted_order_id:
          type: string
          format: uuid
          nullable: true
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Invalid order ID format"
    StockResourceKind:
      type: string
      description: item はアイテムごとに 1 つある、そのアイテムの在庫。cup はカップで、アイテムには結ばず使うアイテムの種類を持つ
      enum: [item, cup]
      x-enum-varnames: [StockResourceKindItem, StockResourceKindCup]
      # 画面に出す名前
      x-enum-descriptions: [アイテム, カップ]
    StockResourceRequest:
      type: object
      description: name と item_type_ids はカップだけに使う。アイテムの在庫ではアイテムの名前を使い、この 2 つを送ると 400
      required:
        - unit
        - per_serving
        - notify_from
        - notify_step
        - buffer
      properties:
        name:
          type: string
          description: カップの名前（カップでは必須）
          example: ホットカップ
        item_type_ids:
          type: array
          description: このカップを使うアイテムの種類。この種類のアイテムが 1 つ売れるごとに per_serving 減る。省略すると今のまま（作るときは空）
          items:
            type: string
            format: uuid
        unit:
          type: string
          description: 数える単位（個 / g）
          example: 個
        per_serving:
          type: number
          format: double
          description: 1 回で減る量。残量を回数に換算するのにも使う（豆 15、コースター 1、カップ 1）
          minimum: 0
          not:
            enum: [0]
          example: 1
        notify_from:
          type: integer
          description: 残りがこの回数を切ったら通知を始める
          minimum: 0
          example: 500
        notify_step:
          type: integer
          description: notify_from から何回減るごとに通知するか
          minimum: 0
          example: 100
        buffer:
          type: integer
          description: 最低限残したい回数。これを切ると危険扱い
          minimum: 0
          example: 100
    StockResourceResponse:
      type: object
      required:
        - id
        - kind
        - item_id
        - name
        - item_type_ids
        - unit
        - per_serving
        - notify_from
        - notify_step
        - buffer
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/StockResourceKind'
        item_id:
          type: string
          format: uuid
          nullable: true
          description: アイテムの在庫ならそのアイテム。カップは null
        name:
          type: string
          description: アイテムの在庫ならアイテムの名前、カップならカップの名前
        item_type_ids:
          type: array
          description: このカップを使うアイテムの種類（アイテムの在庫は空）
          items:
            type: string
            format: uuid
        unit:
          type: string
        per_serving:
          type: number
          format: double
        notify_from:
          type: integer
        notify_step:
          type: integer
        buffer:
          type: integer
    InventoryLevel:
      type: string
      description: untracked は棚卸し・入荷がまだ一度も無い
      enum: [ok, warning, critical, untracked]
      x-enum-varnames: [InventoryLevelOk, InventoryLevelWarning, InventoryLevelCritical, InventoryLevelUntracked]
    InventoryStatus:
      type: object
      required:
        - resource
        - level
        - received
        - consumed
        - servings
        - servings_last_hour
      properties:
        resource:
          $ref: '#/components/schemas/StockResourceResponse'
        level:
          $ref: '#/components/schemas/InventoryLevel'
        counted_at:
          type: string
          format: date-time
          nullable: true
          description: 最後の棚卸し。無ければ最初の入荷
        counted_quantity:
          type: number
          format: double
          nullable: true
        received:
          type: number
          format: double
          description: counted_at 以降の入荷・調整の合計
        consumed:
          type: number
          format: double
          description: counted_at 以降の注文での消費量
        servings:
          type: integer
          description: counted_at 以降に売れた回数
        remaining:
          type: number
          format: double
          nullable: true
        remaining_servings:
          type: number
          format: double
          nullable: true
        servings_last_hour:
          type: integer
          description: 直近1時間に売れた回数
    StockEventKind:
      type: string
      enum: [count, receipt, adjust]
      x-enum-varnames: [StockEventKindCount, StockEventKindReceipt, StockEventKindAdjust]
    StockEventCreateRequest:
      type: object
      required:
        - kind
        - quantity
      properties:
        kind:
          $ref: '#/components/schemas/StockEventKind'
        quantity:
          type: number
          format: double
        note:
          type: string
    StockEventResponse:
      type: object
      required:
        - id
        - resource_id
        - kind
        - quantity
        - created_at
      properties:
        id:
          type: string
          format: uuid
        resource_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/StockEventKind'
        quantity:
          type: number
          format: double
        note:
          type: string
        created_at:
          type: string
          format: date-time
    StockEventCreateResponse:
      type: object
      required:
        - event
      properties:
        event:
          $ref: '#/components/schemas/StockEventResponse'
        estimated:
          type: number
          format: double
          nullable: true
          description: 記録する直前の推定残量（count のときの答え合わせ用）
        actual_per_serving:
          type: number
          format: double
          nullable: true
          description: 前回の棚卸しから今回までの実測の1回あたり使用量（count のときだけ）
    InventoryRemindResponse:
      type: object
      required:
        - sent
      properties:
        sent:
          type: boolean
        reason:
          type: string
    PaymentMethod:
      type: string
      enum: [cash, square]
      default: cash
      description: 支払い方法。square は Square Terminal での決済（カード・電子マネー・QR）
    SquarePaymentType:
      type: string
      enum: [CARD_PRESENT, FELICA_ALL, QR_CODE]
      description: Square Terminal に出す決済画面の種類（Square の payment_type をそのまま使う）
    SquareCheckoutOutcome:
      type: string
      enum: [pending, paid, failed, attention]
      description: |
        レジが次に何をすべきかをサーバーが判定したもの。
          - pending: まだ決まっていない。待つ
          - paid: 支払い済みで、受取額も依頼額と一致した。注文を送ってよい
          - failed: 取り消された・失敗した。お金は受け取っていない
          - attention: 完了したが受取額が依頼額と合わないなど、人が Square の管理画面で確かめる必要がある
    SquareStatusResponse:
      type: object
      required:
        - enabled
        - environment
        - webhook_enabled
      properties:
        enabled:
          type: boolean
        environment:
          type: string
          description: production か sandbox
        webhook_enabled:
          type: boolean
    SquareDeviceStatus:
      type: string
      enum: [UNPAIRED, PAIRED, EXPIRED]
      description: |
        端末のペアリングの状態（Square の Device Code の status）。
          - UNPAIRED: コードを発行した。端末でまだ入力されていない
          - PAIRED: ペアリング済み。決済に使える
          - EXPIRED: 入力されないまま期限が切れた。外して発行し直す
    SquareDeviceResponse:
      type: object
      required:
        - id
        - name
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: 管理画面とレジで出す名前（例 レジ1）
        status:
          $ref: '#/components/schemas/SquareDeviceStatus'
        device_id:
          type: string
          nullable: true
          description: 端末の ID。決済の依頼に使う。PAIRED になるまで null
        code:
          type: string
          nullable: true
          description: 端末のサインイン画面に入力するコード。UNPAIRED の間だけ入る
        pair_by:
          type: string
          format: date-time
          nullable: true
          description: コードの期限。これを過ぎると EXPIRED になる
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SquareDevicePairRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: 管理画面とレジで出す名前。Square の管理画面にもコードの名前として出る
    SquareDeviceCreateRequest:
      type: object
      required:
        - name
        - device_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        device_id:
          type: string
          minLength: 1
          maxLength: 255
    SquareCheckoutCreateRequest:
      type: object
      required:
        - idempotency_key
        - device_id
        - amount
        - payment_type
      properties:
        device_id:
          type: string
          minLength: 1
          description: 決済画面を出す端末。GET /api/square/devices で PAIRED の行の device_id
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 64
          description: レジが決済ごとに作る一意な値（UUID）。再送しても二重に決済画面が出ないようにする
        amount:
          type: integer
          minimum: 1
          description: 請求額（円）
        payment_type:
          $ref: '#/components/schemas/SquarePaymentType'
        order_number:
          type: integer
          nullable: true
          description: 依頼時点の注文番号（端末のメモと照合の表示に使う）
    SquareCheckoutResponse:
      type: object
      required:
        - id
        - device_id
        - status
        - outcome
        - amount
        - payment_type
        - payment_ids
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        device_id:
          type: string
          description: 決済画面を出した端末
        checkout_id:
          type: string
          nullable: true
          description: Square の TerminalCheckout の id
        status:
          type: string
          description: Square の status（PENDING / IN_PROGRESS / CANCEL_REQUESTED / CANCELED / COMPLETED）。依頼前は CREATING、依頼に失敗したら ERROR
        outcome:
          $ref: '#/components/schemas/SquareCheckoutOutcome'
        cancel_reason:
          type: string
          nullable: true
        amount:
          type: integer
        paid_amount:
          type: integer
          nullable: true
          description: 完了後に Payments API で確かめた受取額（円）
        payment_type:
          type: string
        payment_ids:
          type: array
          items:
            type: string
        error_message:
          type: string
          nullable: true
        order_number:
          type: integer
          nullable: true
        order_id:
          type: string
          format: uuid
          nullable: true
          description: この決済で作った注文。まだ無ければ null
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SquareCheckoutConflictResponse:
      type: object
      required:
        - error
        - checkout
      properties:
        error:
          type: string
        checkout:
          $ref: '#/components/schemas/SquareCheckoutResponse'
