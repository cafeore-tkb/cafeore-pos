        - created_at
      properties:
        id:
          type: string
          format: uuid
        resource_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/StockEventKind'
        quantity:
          type: number
          format: double
        note:
          type: string
        created_at:
          type: string
          format: date-time
    StockEventCreateResponse:
      type: object
      required:
        - event
      properties:
        event:
          $ref: '#/components/schemas/StockEventResponse'
        estimated:
          type: number
          format: double
