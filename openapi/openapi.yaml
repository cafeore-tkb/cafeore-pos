# openapi/openapi.yaml
openapi: 3.1.0
info:
  title: CafeOre POS API
  version: 1.0.0
  description: 珈琲・俺POSシステムのAPI仕様

servers:
  - url: http://localhost:8080
    description: 開発環境

paths:
  /status:
    get:
      summary: サーバーステータス取得
      operationId: getStatus
      tags:
        - system
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/me:
    get:
      summary: API を呼んだ相手と権限
      description: |
        Access か IAP の JWT で確かめた相手と、その権限（AUTH_ADMIN_EMAILS・AUTH_STAFF_EMAILS・AUTH_VIEWER_EMAILS で決まる）を返す。
        POS のトップページに出す。ほかの GET と同じく、閲覧のみ以上の権限が要る
        （AUTH_MODE が iap か cloudflare-access のとき、権限の無い相手には 403、JWT が無い・正しくなければ 401）。
      operationId: getMe
      tags:
        - system
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: JWT が無い・正しくない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 権限が無い
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/items:
    get:
      summary: アイテム一覧取得
      operationId: getItems
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: '#/components/schemas/ItemResponse'
    post:
      summary: アイテム作成
      description: そのアイテムの在庫（在庫対象。単位「個」・1 回 1）も同じトランザクションで作る。量や通知の段階は PUT /api/inventory/resources/{id} で変える。
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
  /api/items/{id}:
    get:
      summary: idからアイテム情報取得
      operationId: getItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
    put:
      summary: アイテム情報更新
      operationId: updateItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
    delete:
      summary: アイテム削除
      description: そのアイテムの在庫も同じトランザクションで論理削除する。
      operationId: deleteItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
  /api/menus:
    get:
      summary: メニュー一覧取得
      description: priority の大きい順に返す（同じなら name・id の順）
      operationId: getMenus
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuResponse'
    post:
      summary: メニュー作成
      operationId: createMenu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuCreateRequest'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
  /api/menus/{id}:
    get:
      summary: メニュー取得
      operationId: getMenu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
    put:
      summary: メニュー更新
      operationId: updateMenu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
    delete:
      summary: メニュー削除
      operationId: deleteMenu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
  /api/item-types:
    get:
      summary: アイテムタイプ一覧取得
      operationId: getItemTypes
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: '#/components/schemas/ItemTypeResponse'
    post:
      summary: アイテムタイプ作成
      operationId: createItemType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemTypeCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemTypeResponse'
  /api/item-types/{id}:
    get:
      summary: idからアイテムタイプ情報取得
      operationId: getItemType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemTypeResponse'
    put:
      summary: アイテム情報更新
      operationId: updateItemType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemTypeUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemTypeResponse'
    delete:
      summary: アイテムタイプ削除
      operationId: deleteItemType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
  /api/color-settings:
    get:
      summary: 背景色設定一覧取得
      operationId: getColorSettings
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColorSettingResponse'
    put:
      summary: 背景色設定の作成・更新
      description: 対象（target_type, target_id）と画面（screen）の組が既にあれば色を上書きし、無ければ作成する
      operationId: upsertColorSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColorSettingUpsertRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColorSettingResponse'
        '400':
          description: リクエストが不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/color-settings/{id}:
    delete:
      summary: 背景色設定削除
      operationId: deleteColorSetting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
        '404':
          description: 背景色設定が見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/printer-settings:
    get:
      summary: プリンター設定取得
      description: ラベル用とレシート用のプリンターの IP アドレス、ラベル用のシールの大きさ（長さ・印字幅・余白）、レシート用のプリンターの用紙（種類と幅）と機種。まだ一度も保存していなければ既定値を返す
      operationId: getPrinterSettings
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterSettingsResponse'
    put:
      summary: プリンター設定の更新
      description: 全レジで共通。両方の IP アドレスとラベル用のシールの大きさ、レシート用の用紙（種類と幅）と機種をまとめて置き換える
      operationId: updatePrinterSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrinterSettingsUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterSettingsResponse'
        '400':
          description: リクエストが不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/label-print-requests:
    post:
      summary: シールをレジに代わりに刷ってもらう（代理印刷）
      description: |
        端末（CaOS・マスターの緊急）がラベル用のプリンターに直接刷れなかった緊急（淹れ直し）のシールを、代理印刷をオンにしたレジに刷ってもらう。
        受け取ったら /api/ws/orders の {"type":"label_print_requested","label_print_request":{...}} で全部の画面に配り
        （ほかのインスタンスへは DB の通知 label_print_requested で）、代理印刷をオンにしたレジが claim してから刷る。
        刷れたら {"type":"label_print_done","label_print_request_id":"<id>"} で知らせる（ほかのインスタンスへは DB の通知 label_print_done で）。
        id は淹れ直しの id。淹れ直しが無い（取り消した・注文の編集や削除で消えた）なら 410 で、頼みは作らない（取り消しと同時に頼まれても、取り消した緊急のシールは刷らない）。
        消えた淹れ直しは戻らないので、頼んだ端末は 410 ならそのシールを捨てる（ルートが無い 404 と見分けるため 404 にはしない）。
        緊急を取り消す・注文の編集や削除で淹れ直しが消えると、この頼みも消える。同じ id は 1 つだけで、2 回目からは中身を変えず、まだ刷れていなければ配り直すだけ（送り直しても 2 枚刷らない）。
        job の中身（シールの印刷データ）はサーバーでは解釈せず、そのまま配る。
      operationId: createLabelPrintRequest
      tags:
        - printer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelPrintRequestCreateRequest'
      responses:
        '204':
          description: 受け取った（もう受け取っていた・刷り終えていたときも）
        '400':
          description: 形の違うリクエスト・印刷データが大きすぎる
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: 淹れ直しが無い（取り消した・注文の編集や削除で消えた）。頼みは作らない。頼んだ端末はそのシールを捨てる
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: まだ刷れていない代理印刷
      description: |
        今日（日本時間）頼まれて、まだ刷れていない代理印刷（古い順）。レジが刷っている途中のものも入る。
        代理印刷をオンにしたレジが、つないだとき・配信を受け損ねたときのために読む。頼んだ端末は、レジで印刷待ちの数を出すのに読む。
      operationId: getLabelPrintRequests
      tags:
        - printer
      responses:
        '200':
          description: まだ刷れていない代理印刷（古い順）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabelPrintRequestResponse'
  /api/label-print-requests/{id}/claim:
    post:
      summary: 代理印刷を引き受ける
      description: |
        代理印刷をオンにしたレジが、刷る前に引き受ける。引き受けたレジだけが刷る（ほかのレジと 2 枚刷らないように）。
        引き受けは 60 秒で切れる（刷っている途中にレジを閉じても、ほかのレジが引き受け直せる）。同じ device_id なら引き受け直せる。
        刷れたら /printed、刷れなかったら /release を呼ぶ。
      operationId: claimLabelPrintRequest
      tags:
        - printer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelPrintDeviceRequest'
      responses:
        '200':
          description: 引き受けた（claimed。job を刷る）・ほかのレジが刷っている（busy）・もう刷れた（printed）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelPrintClaimResponse'
        '400':
          description: 形の違うリクエスト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 頼みが無い（緊急を取り消した）。刷らない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/label-print-requests/{id}/printed:
    post:
      summary: 代理印刷を刷れた
      description: |
        引き受けたレジが、プリンターが刷れたと返したら呼ぶ。刷れたことにして、/api/ws/orders の {"type":"label_print_done"} で全部の画面に知らせる。
        何度呼んでもよい（引き受けが切れた後でも、刷れたことにする）。
      operationId: markLabelPrintRequestPrinted
      tags:
        - printer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelPrintDeviceRequest'
      responses:
        '204':
          description: 刷れたことにした
        '400':
          description: 形の違うリクエスト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 頼みが無い（緊急を取り消した）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/label-print-requests/{id}/release:
    post:
      summary: 代理印刷を刷れなかった（引き受けをやめる）
      description: |
        引き受けたレジが、刷れなかったときに呼ぶ。その device_id が引き受けていれば引き受けをやめ、label_print_requested を配り直す
        （ほかの代理印刷のレジが引き受けられる）。引き受けていなければ何もしない。
      operationId: releaseLabelPrintRequest
      tags:
        - printer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelPrintDeviceRequest'
      responses:
        '204':
          description: 引き受けをやめた（引き受けていなければ何もしない）
        '400':
          description: 形の違うリクエスト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 頼みが無い（緊急を取り消した）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders:
    get:
      summary: オーダー一覧取得
      operationId: getOrders
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: '#/components/schemas/OrderResponse'
    post:
      summary: オーダー作成
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /api/orders/{id}:
    get:
      summary: idからオーダー情報取得
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
    put:
      summary: オーダー情報更新
      operationId: updateOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
    delete:
      summary: オーダー削除
      operationId: deleteOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
  /api/orders/{id}/ready:
    patch:
      summary: オーダーを準備完了にする
      description: 準備完了と未準備を切り替える（カップの準備完了もそろえる）。CaOS の盤面（抽出の時刻）は変えない（CaOS の「次へ」は進めない）。
      operationId: markOrderReady
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '404':
          description: オーダーが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/served:
    patch:
      summary: オーダーを提供完了にする
      description: 提供済みと未提供を切り替える（カップの提供済み・準備完了もそろえる）。CaOS の盤面（抽出の時刻）は変えない。
      operationId: markOrderServe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '404':
          description: オーダーが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/cups/{cupId}/ready:
    patch:
      summary: カップを準備完了にする
      description: 1杯ずつ準備完了と未準備を切り替える。全カップが準備完了になると注文も準備完了になり、外すと注文の準備完了も外れる。CaOS の盤面（抽出の時刻）は変えない（CaOS の「次へ」は進めない）。
      operationId: markOrderCupReady
      parameters:
        - name: id
          in: path
          required: true
          description: オーダーID
          schema:
            type: string
            format: uuid
        - name: cupId
          in: path
          required: true
          description: カップID（OrderResponse.cups[].id）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: IDの形式が不正です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: オーダーまたはカップが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/cups/{cupId}/served:
    patch:
      summary: カップを提供完了にする
      description: 1杯ずつ提供済みと未提供を切り替える。全カップが提供済みになると注文も提供済みになり、外すと注文の提供済みも外れる。CaOS の盤面（抽出の時刻）は変えない。
      operationId: markOrderCupServe
      parameters:
        - name: id
          in: path
          required: true
          description: オーダーID
          schema:
            type: string
            format: uuid
        - name: cupId
          in: path
          required: true
          description: カップID（OrderResponse.cups[].id）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: IDの形式が不正です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: オーダーまたはカップが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/recall:
    post:
      summary: 呼び出し中の注文をもう一度呼ぶ（呼び出し催促）
      description: |
        呼び出し中（準備完了で、まだ提供していない）の注文を、もう一度呼ぶ。注文には何も書かない。
        催促したことは /api/ws/orders の {"type":"order_recalled","order_id":"<id>"} で全部の画面に知らせる（ほかのインスタンスへは DB の通知 order_recalled で）。
        呼び出し画面は、この知らせを受けたら「N番のお客様、商品のご用意ができております。お急ぎ、提供口までお越しください。」と読み上げ、その番号をしばらく目立たせる。
      operationId: recallOrder
      parameters:
        - name: id
          in: path
          required: true
          description: オーダーID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 知らせた
        '400':
          description: IDの形式が不正です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: オーダーが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 呼び出し中ではない（まだ呼んでいない・提供済み。ほかの端末で提供したか、呼び出しを取り消したかもしれない）。error を画面にそのまま出す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/cancel:
