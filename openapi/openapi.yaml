# openapi/openapi.yaml
openapi: 3.1.0
info:
  title: CafeOre POS API
  version: 1.0.0
  description: 珈琲・俺POSシステムのAPI仕様

servers:
  - url: http://localhost:8080
    description: 開発環境

paths:
  /status:
    get:
      summary: サーバーステータス取得
      operationId: getStatus
      tags:
        - system
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/items:
    get:
      summary: アイテム一覧取得
      operationId: getItems
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: '#/components/schemas/ItemResponse'
    post:
      summary: アイテム作成
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
  /api/items/{id}:
    get:
      summary: idからアイテム情報取得
      operationId: getItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
    put:
      summary: アイテム情報更新
      operationId: updateItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
    delete:
      summary: アイテム削除
      operationId: deleteItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
  /api/menus:
    get:
      summary: メニュー一覧取得
      operationId: getMenus
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuResponse'
    post:
      summary: メニュー作成
      operationId: createMenu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuCreateRequest'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
  /api/menus/{id}:
    get:
      summary: メニュー取得
      operationId: getMenu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
    put:
      summary: メニュー更新
      operationId: updateMenu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
    delete:
      summary: メニュー削除
      operationId: deleteMenu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
  /api/item-types:
    get:
      summary: アイテムタイプ一覧取得
      operationId: getItemTypes
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: '#/components/schemas/ItemTypeResponse'
    post:
      summary: アイテムタイプ作成
      operationId: createItemType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemTypeCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemTypeResponse'
  /api/item-types/{id}:
    get:
      summary: idからアイテムタイプ情報取得
      operationId: getItemType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemTypeResponse'
    put:
      summary: アイテム情報更新
      operationId: updateItemType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemTypeUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemTypeResponse'
    delete:
      summary: アイテムタイプ削除
      operationId: deleteItemType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
  /api/orders:
    get:
      summary: オーダー一覧取得
      operationId: getOrders
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: '#/components/schemas/OrderResponse'
    post:
      summary: オーダー作成
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /api/orders/{id}:
    get:
      summary: idからオーダー情報取得
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
    put:
      summary: オーダー情報更新
      operationId: updateOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
    delete:
      summary: オーダー削除
      operationId: deleteOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 成功
  /api/orders/{id}/ready:
    patch:
      summary: オーダーを準備完了にする
      operationId: markOrderReady
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '404':
          description: オーダーが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/served:
    patch:
      summary: オーダーを提供完了にする
      operationId: markOrderServe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '404':
          description: オーダーが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/menus/{orderMenuId}/ready:
    patch:
      summary: 注文明細（カップ）を準備完了にする
      description: 準備完了と未準備を切り替える。全カップが準備完了になると注文も準備完了になり、外すと注文の準備完了も外れる。
      operationId: markOrderMenuReady
      parameters:
        - name: id
          in: path
          required: true
          description: オーダーID
          schema:
            type: string
            format: uuid
        - name: orderMenuId
          in: path
          required: true
          description: 注文明細ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: オーダーまたは注文明細が見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/menus/{orderMenuId}/served:
    patch:
      summary: 注文明細（カップ）を提供完了にする
      description: 提供済みと未提供を切り替える。全カップが提供済みになると注文も提供済みになり、外すと注文の提供済みも外れる。
      operationId: markOrderMenuServe
      parameters:
        - name: id
          in: path
          required: true
          description: オーダーID
          schema:
            type: string
            format: uuid
        - name: orderMenuId
          in: path
          required: true
          description: 注文明細ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: オーダーまたは注文明細が見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/comments:
    get:
      summary: 特定オーダーのコメント一覧取得
      operationId: getOrderComments
      tags:
        - comments
      parameters:
        - name: id
          in: path
          required: true
          description: オーダーID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentResponse'
        '404':
          description: オーダーが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: オーダーにコメント追加
      operationId: createOrderComment
      tags:
        - comments
      parameters:
        - name: id
          in: path
          required: true
          description: オーダーID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '404':
          description: オーダーが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/master-status:
    get:
      summary: マスターステート取得
      operationId: getMasterState
      tags:
        - system
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MasterStateResponse'
    post: 
      summary: マスターステート更新
      operationId: updateMasterState
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterStateUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterStateResponse'

components:
  schemas:
    StatusResponse:
      type: object
      required:
        - status
        - timestamp
        - version
        - database
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: 1.0.0
        database:
          type: string
          example: connected
    ItemResponse:
      type: object
      required:
        - id
        - name
        - abbr
        - item_type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        item_type:
          $ref: '#/components/schemas/ItemTypeResponse'
    # 作成リクエスト用（IDや自動生成フィールドを除外）
    ItemCreateRequest:
      type: object
      required:
        - name
        - abbr
        - item_type_id
      properties:
        name:
          type: string
        abbr:
          type: string
        item_type_id:
          type: string
          format: uuid
    # 更新リクエスト用
    ItemUpdateRequest:
      type: object
      required:
        - id
        - name
        - abbr
        - item_type_id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        item_type_id:
          type: string
          format: uuid
    MenuItemResponse:
      type: object
      required:
        - item
        - quantity
      properties:
        item:
          $ref: '#/components/schemas/ItemResponse'
        quantity:
          type: integer
          minimum: 1
    MenuItemRequest:
      type: object
      required:
        - item_id
        - quantity
      properties:
        item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    MenuResponse:
      type: object
      required:
        - id
        - name
        - abbr
        - price
        - key
        - items
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        price:
          type: integer
        key:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItemResponse'
    MenuCreateRequest:
      type: object
      required:
        - name
        - abbr
        - price
        - key
        - items
      properties:
        name:
          type: string
        abbr:
          type: string
        price:
          type: integer
        key:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MenuItemRequest'
    MenuUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/MenuCreateRequest'
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
    ItemTypeResponse:
      type: object
      required:
        - id
        - name
        - display_name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
    ItemTypeCreateRequest:
      type: object
      required:
        - name
        - display_name
      properties:
        name:
          type: string
        display_name:
          type: string
    # 更新リクエスト用
    ItemTypeUpdateRequest:
      type: object
      required:
        - id
        - name
        - display_name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
    # 指名を入れたMenu
    MenuInfo:
      type: object
      required:
        - id
        - menu_name
        - unit_price
        - menu
        - assignee
        - ready_at
        - served_at
      properties:
        id:
          type: string
          format: uuid
          description: 注文明細ID
        menu_name:
          type: string
          description: 注文時点のメニュー名
        unit_price:
          type: integer
          description: 注文時点のメニュー価格
        menu:
          $ref: '#/components/schemas/MenuResponse'
        assignee:
          type: string
          nullable: true
        ready_at:
          type: string
          format: date-time
          nullable: true
          description: このカップが準備完了になった時刻。未準備なら null
        served_at:
          type: string
          format: date-time
          nullable: true
          description: このカップを提供した時刻。未提供なら null
    # Create用のMenuInfo
    MenuInfoCreate:
      type: object
      required:
        - menu_id
        - assignee
      properties:
        order_menu_id:
          type: string
          format: uuid
          description: 更新時に残す既存明細のID。新規明細では省略する。価格・名称はサーバーが保存する。
        menu_id:
          type: string
          format: uuid
        assignee:
          type: string
          nullable: true
    # レスポンス用（完全な情報）
    OrderResponse:
      type: object
      required:
        - id
        - order_id
        - created_at
        - billing_amount
        - received
        - menus
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: integer
        created_at:
          type: string
          format: date-time
        ready_at:
          type: string
          format: date-time
          nullable: true
        served_at:
          type: string
          format: date-time
          nullable: true
        billing_amount:
          type: integer
        received:
          type: integer
        discount_order_id:
          type: integer
          nullable: true
        discount_order_cups:
          type: integer
        menus:
          type: array
          items:
            $ref: '#/components/schemas/MenuInfo'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentResponse'

    # 作成リクエスト用（IDや自動生成フィールドを除外）
    OrderCreateRequest:
      type: object
      required:
        - order_id
        - billing_amount
        - received
        - menu_ids
      properties:
        order_id:
          type: integer
          example: 1
        billing_amount:
          type: integer
          example: 500
        received:
          type: integer
          example: 500
          default: 0
        discount_order_id:
          type: integer
          nullable: true
        discount_order_cups:
          type: integer
          default: 0
        menu_ids:
          type: array
          items:
            $ref: '#/components/schemas/MenuInfoCreate'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentCreateRequest'

    # 更新リクエスト用
    OrderUpdateRequest:
      type: object
      required:
        - id
        - order_id
        - billing_amount
        - received
        - menu_ids
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: integer
        ready_at:
          type: string
          format: date-time
          nullable: true
        served_at:
          type: string
          format: date-time
          nullable: true
        billing_amount:
          type: integer
        received:
          type: integer
        discount_order_id:
          type: integer
          nullable: true
        discount_order_cups:
          type: integer
        menu_ids:
          type: array
          items:
            $ref: '#/components/schemas/MenuInfoCreate'

    # 一覧取得用（軽量版、関連データを含まない場合）
    OrderListItem:
      type: object
      required:
        - id
        - order_id
        - created_at
        - billing_amount
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: integer
        created_at:
          type: string
          format: date-time
        ready_at:
          type: string
          format: date-time
          nullable: true
        served_at:
          type: string
          format: date-time
          nullable: true
        billing_amount:
          type: integer
        received:
          type: integer
        discount_order_cups:
          type: integer

    # コメント作成用
    CommentCreateRequest:
      type: object
      required:
        - author
        - text
      properties:
        author:
          type: string
        text:
          type: string

    CommentResponse:
      type: object
      required:
        - order_id
        - author
        - text
        - created_at
      properties:
        order_id:
          type: string
          format: uuid
        author:
          type: string
        text:
          type: string
        created_at:
          type: string
          format: date-time
    MasterStateResponse:
      type: object
      required:
        - created_at
        - type
      properties:
        created_at:
          type: string
          format: date-time
        type:
          type: string
    MasterStateUpdateRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Invalid order ID format"
