  /api/inventory/remind:
    post:
      summary: 残量確認のリマインドを Slack に送る
      description: |
        スケジューラから定期的に叩く。次のどちらかを満たさないと 401。
          - Authorization: Bearer の Google ID トークン（INVENTORY_REMIND_INVOKER の SA が audience INVENTORY_REMIND_AUDIENCE で発行したもの）。本番の Cloud Scheduler はこちら
          - X-Cron-Secret ヘッダーが INVENTORY_CRON_SECRET と一致する。ローカルや手動実行用
        （ヘッダーをパラメータやセキュリティスキームとして書くと、生成される api_gin.go が models の型を参照できずビルドが通らないので説明だけに留める）
        直近に注文が無い（営業していない）ときは送らない。
      operationId: remindInventory
      tags:
        - inventory
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryRemindResponse'
        '401':
          description: ID トークンも合言葉も合わない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cashier-state:
    get:
      summary: レジ状態取得
      description: レジが編集中の注文と直前に確定した注文の ID。まだ一度も同期されていなければ 404。
      operationId: getCashierState
      tags:
        - system
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierStateResponse'
        '404':
          description: まだレジ状態が無い
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: レジ状態更新
      description: 単一のレジ状態を丸ごと置き換える。成功すると WebSocket で全クライアントへ配信される。
      operationId: updateCashierState
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashierStateUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierStateResponse'
        '400':
          description: editting_order に必須のキーが無い、または型が違う
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    StatusResponse:
      type: object
      required:
        - status
        - timestamp
        - version
        - database
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: 1.0.0
        database:
          type: string
          example: connected
    ItemResponse:
      type: object
      required:
        - id
        - name
        - abbr
        - item_type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        item_type:
          $ref: '#/components/schemas/ItemTypeResponse'
    # 作成リクエスト用（IDや自動生成フィールドを除外）
    ItemCreateRequest:
      type: object
      required:
        - name
        - abbr
        - item_type_id
      properties:
        name:
          type: string
        abbr:
          type: string
        item_type_id:
          type: string
          format: uuid
    # 更新リクエスト用
    ItemUpdateRequest:
      type: object
      required:
        - id
        - name
        - abbr
        - item_type_id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        item_type_id:
          type: string
          format: uuid
    MenuItemResponse:
      type: object
      required:
        - item
        - quantity
      properties:
        item:
          $ref: '#/components/schemas/ItemResponse'
        quantity:
          type: integer
          minimum: 1
    MenuItemRequest:
      type: object
      required:
        - item_id
        - quantity
      properties:
        item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    MenuResponse:
      type: object
      required:
        - id
        - name
        - abbr
        - price
        - key
        - items
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbr:
          type: string
        price:
          type: integer
        key:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItemResponse'
    MenuCreateRequest:
      type: object
      required:
        - name
        - abbr
        - price
        - key
        - items
      properties:
        name:
          type: string
        abbr:
          type: string
        price:
          type: integer
          minimum: 0
        key:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MenuItemRequest'
    MenuUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/MenuCreateRequest'
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
    ItemTypeResponse:
      type: object
      required:
        - id
        - name
        - display_name
        - makes_cup
        - needs_brew
        - senior_only
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
        makes_cup:
          type: boolean
          description: この種類のアイテムは1杯ずつカップを作る（注文のカップ・マスター・提供画面に出る）。グッズは false
        needs_brew:
          type: boolean
          description: この種類のアイテムは抽出が要る（割引の対象の杯数・ドリッパーの割り振りに数える）。makes_cup が false なら必ず false
        senior_only:
          type: boolean
          description: この種類のアイテムは上級生だけが淹れる（限定）。needs_brew が false なら必ず false
    ItemTypeCreateRequest:
      type: object
      required:
        - name
        - display_name
      properties:
        name:
          type: string
        display_name:
          type: string
        makes_cup:
          type: boolean
          default: true
          description: 省略したら true
        needs_brew:
          type: boolean
          description: 省略したら makes_cup と同じ。makes_cup が false のときに true は 400
        senior_only:
          type: boolean
          default: false
          description: 省略したら false。needs_brew が false のときに true は 400
    # 更新リクエスト用
    ItemTypeUpdateRequest:
      type: object
      required:
        - id
        - name
        - display_name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
        makes_cup:
          type: boolean
          description: 省略したら今の値のまま
        needs_brew:
          type: boolean
          description: 省略したら今の値のまま（makes_cup を false にしたときは false）。makes_cup が false のときに true は 400
        senior_only:
          type: boolean
          description: 省略したら今の値のまま（needs_brew が false になるときは false）。needs_brew が false のときに true は 400
    # 指名を入れたMenu
    MenuInfo:
      type: object
      required:
        - id
        - menu_name
        - unit_price
        - menu
        - assignee
        - dripper
      properties:
        id:
          type: string
          format: uuid
          description: 注文明細ID
        menu_name:
          type: string
          description: 注文時点のメニュー名
        unit_price:
          type: integer
          description: 注文時点のメニュー価格
        menu:
          $ref: '#/components/schemas/MenuResponse'
        assignee:
          type: string
          nullable: true
          description: 指名の自由記述（ラベルに印刷する文）。dripper が無い明細では null。番号より前の注文は自由記述だけのことがある
        dripper:
          type: integer
          minimum: 1
          maximum: 6
          nullable: true
          description: 指名したドリッパーの番号（1st〜6th は 1〜6）。指名しない明細は null
    # 注文の1杯。注文明細（メニュー）の構成品を数量分に展開したもの（グッズは含まない）
    OrderCupResponse:
      type: object
      required:
        - id
        - order_menu_id
        - item
        - ready_at
        - served_at
        - dripper
        - dripper_position
        - drip_id
        - brew_started_at
        - brew_finished_at
      properties:
        id:
          type: string
          format: uuid
        order_menu_id:
          type: string
          format: uuid
          description: このカップを含む注文明細のID（MenuInfo.id）
        item:
          $ref: '#/components/schemas/ItemResponse'
        ready_at:
          type: string
          format: date-time
          nullable: true
          description: このカップが準備完了になった時刻。未準備なら null
        served_at:
          type: string
          format: date-time
          nullable: true
          description: このカップを提供した時刻。未提供なら null
        dripper:
          type: integer
          nullable: true
          minimum: 1
          maximum: 6
          description: CaOS が置いたドリッパーの番号（1〜6）。未割当なら null。以下の CaOS の列は CaOS 以外の画面は読まない
        dripper_position:
          type: number
          format: double
          nullable: true
          description: CaOS のドリッパーの中の順番（小さいほど先）
        drip_id:
          type: string
          format: uuid
          nullable: true
          description: CaOS のカードの印。同じ値のカップを 1 枚のカード（1 回のドリップ）で淹れる
        brew_started_at:
          type: string
          format: date-time
          nullable: true
          description: CaOS で抽出を始めた時刻
        brew_finished_at:
          type: string
          format: date-time
          nullable: true
          description: CaOS で抽出を終えた時刻
    # Create用のMenuInfo
    MenuInfoCreate:
      type: object
      required:
        - menu_id
        - assignee
        - dripper
      properties:
        order_menu_id:
          type: string
          format: uuid
          description: 更新時に残す既存明細のID。新規明細では省略する。価格・名称はサーバーが保存する。
        menu_id:
          type: string
          format: uuid
        assignee:
          type: string
          nullable: true
          description: 指名の自由記述。新しい明細では dripper が無いと付けられない。空白だけなら null として扱う
        dripper:
          type: integer
          minimum: 1
          maximum: 6
          nullable: true
          description: 指名したドリッパーの番号（1〜6）。指名しない明細は null
    # レスポンス用（完全な情報）
    OrderResponse:
      type: object
      required:
        - id
        - order_id
        - created_at
        - billing_amount
        - received
        - menus
        - cups
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: integer
        created_at:
          type: string
          format: date-time
        ready_at:
          type: string
          format: date-time
          nullable: true
        served_at:
          type: string
          format: date-time
          nullable: true
        billing_amount:
          type: integer
        received:
          type: integer
        discount_order_id:
          type: integer
          nullable: true
        discount_order_cups:
          type: integer
        menus:
          type: array
          items:
            $ref: '#/components/schemas/MenuInfo'
        cups:
          type: array
          description: 注文のカップ（1杯ずつ）。注文した順に並ぶ。グッズだけの注文では空
          items:
            $ref: '#/components/schemas/OrderCupResponse'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentResponse'

    # 作成リクエスト用（IDや自動生成フィールドを除外）
    OrderCreateRequest:
      type: object
      required:
        - order_id
        - billing_amount
        - received
        - menu_ids
      properties:
        order_id:
          type: integer
          example: 1
        billing_amount:
          type: integer
          example: 500
        received:
          type: integer
          example: 500
          default: 0
        discount_order_id:
          type: integer
          nullable: true
        discount_order_cups:
          type: integer
          default: 0
        menu_ids:
          type: array
          items:
            $ref: '#/components/schemas/MenuInfoCreate'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentCreateRequest'

    # 更新リクエスト用
    OrderUpdateRequest:
      type: object
      required:
        - id
        - order_id
        - billing_amount
        - received
        - menu_ids
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: integer
        ready_at:
          type: string
          format: date-time
          nullable: true
        served_at:
          type: string
          format: date-time
          nullable: true
        billing_amount:
          type: integer
        received:
          type: integer
        discount_order_id:
          type: integer
          nullable: true
        discount_order_cups:
          type: integer
        menu_ids:
          type: array
          items:
            $ref: '#/components/schemas/MenuInfoCreate'

    # 一覧取得用（軽量版、関連データを含まない場合）
    OrderListItem:
      type: object
      required:
        - id
        - order_id
        - created_at
        - billing_amount
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: integer
        created_at:
          type: string
          format: date-time
        ready_at:
          type: string
          format: date-time
          nullable: true
        served_at:
          type: string
          format: date-time
          nullable: true
        billing_amount:
          type: integer
        received:
          type: integer
        discount_order_cups:
          type: integer

    # コメント作成用
    CommentCreateRequest:
      type: object
      required:
        - author
        - text
      properties:
        author:
          type: string
        text:
          type: string

    CommentResponse:
      type: object
      required:
        - order_id
        - author
        - text
        - created_at
      properties:
        order_id:
          type: string
          format: uuid
        author:
          type: string
        text:
          type: string
        created_at:
          type: string
          format: date-time
    MasterStateResponse:
      type: object
      required:
        - created_at
        - type
      properties:
        created_at:
          type: string
          format: date-time
        type:
          type: string
    MasterStateUpdateRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
    ColorTargetType:
      type: string
      description: 背景色を設定する対象の種類
      enum:
        - Item
        - ItemType
      # 既定の定数名（Item, ItemType）は DB モデルの構造体名と衝突するため明示する
      x-enum-varnames:
        - ColorTargetTypeItem
        - ColorTargetTypeItemType
    ColorScreen:
      type: string
      description: |
        背景色を適用する画面。
        cashier はレジのメニューのボタン、cashier_order はレジの過去の注文のカード、
        master・serve はマスター・提供画面のカップ
      enum:
        - cashier
        - cashier_order
        - master
        - serve
      x-enum-varnames:
        - ColorScreenCashier
        - ColorScreenCashierOrder
        - ColorScreenMaster
        - ColorScreenServe
    ColorSettingResponse:
      type: object
      required:
        - id
        - target_type
        - target_id
        - screen
        - color
      properties:
        id:
          type: string
          format: uuid
        target_type:
          $ref: '#/components/schemas/ColorTargetType'
        target_id:
          type: string
          format: uuid
          description: Item または ItemType の ID
        screen:
          $ref: '#/components/schemas/ColorScreen'
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          example: "#bfdbfe"
    ColorSettingUpsertRequest:
      type: object
      required:
        - target_type
        - target_id
        - screen
        - color
      properties:
        target_type:
          $ref: '#/components/schemas/ColorTargetType'
        target_id:
          type: string
          format: uuid
          description: Item または ItemType の ID
        screen:
          $ref: '#/components/schemas/ColorScreen'
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          example: "#bfdbfe"
    CashierStateResponse:
      type: object
      required:
        - editting_order
        - submitted_order_id
        - updated_at
      properties:
        editting_order:
          type: object
          additionalProperties: true
          description: レジで編集中の注文。フロントの orderSchema の JSON をそのまま保持し、サーバーは上の階層のキーと型を確かめる以外は中身を解釈しない
        submitted_order_id:
          type: string
          format: uuid
          nullable: true
          description: 直前に確定した注文の ID。編集中は null
        updated_at:
          type: string
          format: date-time
    CashierStateUpdateRequest:
      type: object
      required:
        - editting_order
        - submitted_order_id
      properties:
        editting_order:
          type: object
          additionalProperties: true
        submitted_order_id:
          type: string
          format: uuid
          nullable: true
    CaosCupState:
      type: object
      description: カップの今の CaOS の値（OrderCupResponse の同じ名前の列をそのまま）。全部 null なら未割当
      required: [dripper, dripper_position, drip_id, brew_started_at, brew_finished_at]
      properties:
        dripper:
          type: integer
          nullable: true
          minimum: 1
          maximum: 6
        dripper_position:
          type: number
          format: double
          nullable: true
        drip_id:
          type: string
          format: uuid
          nullable: true
        brew_started_at:
          type: string
          format: date-time
          nullable: true
        brew_finished_at:
          type: string
          format: date-time
          nullable: true
    CaosCupAfter:
      type: object
      description: |
        CaOS がカップに書く値。抽出の時刻は送らない（開始・終了の時刻はサーバーの今で付ける）。
        start_brew が true なら抽出を始める（brew_started_at にサーバーの今を入れる）。false なら待機・未割当（brew_started_at・brew_finished_at は null）。
        dripper・dripper_position・drip_id が全部 null で start_brew が false なら未割当
      required: [dripper, dripper_position, drip_id, start_brew]
      properties:
        dripper:
          type: integer
          nullable: true
          minimum: 1
          maximum: 6
        dripper_position:
          type: number
          format: double
          nullable: true
        drip_id:
          type: string
          format: uuid
          nullable: true
        start_brew:
          type: boolean
          description: 抽出を始める（空いているドリッパーに置いてそのまま始める）。時刻はサーバーの今
    CaosCupsWrite:
      type: object
      description: |
        カップの組を before から after にする。before はカップの今の値（注文の応答の値をそのまま送り返す。時刻はミリ秒までで比べる）。
        抽出中・終わりのカップ（brew_started_at のあるカップ）は書けない（終えるのは「次へ」）
      required: [cup_ids, before, after]
      properties:
        cup_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        before:
          $ref: '#/components/schemas/CaosCupState'
        after:
          $ref: '#/components/schemas/CaosCupAfter'
    CaosCupsWriteRequest:
      type: object
      required: [writes]
      properties:
        writes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CaosCupsWrite'
    CaosNextRequest:
      type: object
      required: [drip_id]
      properties:
        drip_id:
          type: string
          format: uuid
          nullable: true
          description: 画面が抽出中と見ているカードの drip_id。抽出中が無いと見ているなら null
    CaosNextResult:
      type: object
      required: [finished_drip_id, started_drip_id]
      properties:
        finished_drip_id:
          type: string
          format: uuid
          nullable: true
          description: 終えたカード。無ければ null
        started_drip_id:
          type: string
          format: uuid
          nullable: true
          description: 始めたカード。待機が無ければ null
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Invalid order ID format"
    StockResourceKind:
      type: string
      enum: [cup, bean]
      x-enum-varnames: [StockResourceKindCup, StockResourceKindBean]
    StockResourceRequest:
      type: object
      required:
        - kind
        - name
        - unit
        - per_serving
        - notify_from
        - notify_step
        - buffer
      properties:
        kind:
          $ref: '#/components/schemas/StockResourceKind'
        name:
          type: string
          example: ホットカップ
        unit:
          type: string
          description: 数える単位（個 / g）
          example: 個
        per_serving:
          type: number
          format: double
          description: 1杯あたりの量。残量を杯数に換算するのに使う（カップ 1、豆 15）
          example: 1
        notify_from:
          type: integer
          description: 残りがこの杯数を切ったら通知を始める
          example: 500
        notify_step:
          type: integer
          description: notify_from から何杯減るごとに通知するか
          example: 100
        buffer:
          type: integer
          description: 最低限残したい杯数。これを切ると危険扱い
          example: 100
    StockResourceResponse:
      allOf:
        - $ref: '#/components/schemas/StockResourceRequest'
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
    InventoryLevel:
      type: string
      description: untracked は棚卸し・入荷がまだ一度も無い
      enum: [ok, warning, critical, untracked]
      x-enum-varnames: [InventoryLevelOk, InventoryLevelWarning, InventoryLevelCritical, InventoryLevelUntracked]
    InventoryStatus:
      type: object
      required:
        - resource
        - level
        - received
        - consumed
        - servings
        - servings_last_hour
      properties:
        resource:
          $ref: '#/components/schemas/StockResourceResponse'
        level:
          $ref: '#/components/schemas/InventoryLevel'
        counted_at:
          type: string
          format: date-time
          nullable: true
          description: 最後の棚卸し。無ければ最初の入荷
        counted_quantity:
          type: number
          format: double
          nullable: true
        received:
          type: number
          format: double
          description: counted_at 以降の入荷・調整の合計
        consumed:
          type: number
          format: double
          description: counted_at 以降の注文での消費量
        servings:
          type: integer
