        - target_type
        - target_id
        - screen
        - color
      properties:
        id:
          type: string
          format: uuid
        target_type:
          $ref: '#/components/schemas/ColorTargetType'
        target_id:
          type: string
          format: uuid
          description: Item または ItemType の ID
        screen:
          $ref: '#/components/schemas/ColorScreen'
        color:
          type: string
