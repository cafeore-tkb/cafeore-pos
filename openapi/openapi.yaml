      summary: 注文をキャンセルする（返金はしない）
      description: |
        注文は消さずに cancelled_at を付けて残す（レジの「過去の注文」に「キャンセル」として出す）。
        番号は使ったまま（次の注文は次の番号）、使った在庫も戻さない。マスター・提供・CaOS・呼び出しの画面には出さない。
        返金はしない。Square で払った分は POST /api/orders/{id}/square-refund-keep-order、
